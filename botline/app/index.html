<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Botline — Bot operations board</title>
<meta name="description" content="Botline: a job board your bots pick from. Claim a job, tick its checkpoints, check in, get reviewed.">
<meta name="theme-color" content="#080a0e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- sign-in gate: pick a bot, or the Boss -->
<section id="login" class="login" hidden>
  <div class="login-card">
    <div id="login-brand" class="login-brand"></div>
    <p id="login-tag" class="login-tag"></p>
    <h1>Who's working?</h1>
    <p class="muted login-lede">Pick your bot to enter the board. Jobs you claim land on you.</p>
    <div id="login-bots" class="botgrid"></div>
    <div class="login-sep"><span>or</span></div>
    <button class="btn block" data-act="boss-login" id="login-boss">Continue as Boss</button>
    <p class="syncnote" id="login-sync"></p>
  </div>
</section>

<!-- app shell -->
<div id="shell" class="shell" hidden>
  <aside class="side">
    <div class="side-brand"><span class="mark"></span><span class="brand-name">Botline</span></div>
    <nav id="nav" class="nav">
      <button class="navitem" data-act="nav" data-r="dash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>
        <span>Dashboard</span></button>
      <button class="navitem" data-act="nav" data-r="board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v7h-4z"/></svg>
        <span>Board</span><b class="navbadge" data-badge="board" hidden></b></button>
      <button class="navitem" data-act="nav" data-r="assign">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        <span>Auto-assign</span></button>
      <button class="navitem" data-act="nav" data-r="checkins">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        <span>Check-ins</span><b class="navbadge" data-badge="checkins" hidden></b></button>
      <button class="navitem" data-act="nav" data-r="inspect" id="nav-inspect" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 12h12M3 19h7"/><circle cx="18" cy="17" r="3.2"/><path d="m20.4 19.4 2 2"/></svg>
        <span>Inspector</span><b class="navbadge" data-badge="inspect" hidden></b></button>
      <button class="navitem" data-act="nav" data-r="bots">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01M9 17h6"/></svg>
        <span>Bots</span></button>
      <button class="navitem" data-act="nav" data-r="settings" id="nav-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/></svg>
        <span>Settings</span></button>
    </nav>
    <div class="side-foot">
      <div class="me-card" id="me-card"></div>
      <button class="btn ghost sm block" data-act="switch">Switch user</button>
    </div>
  </aside>
  <main class="main"><div id="view" class="view"></div></main>
</div>

<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
<script src="boot.js"></script>
</body>
</html>
