<style>
:root{--bg:#070a12;--panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--teal:#22e6c8;--pink:#ff5da2;--gold:#e9a93b;--text:#f2f5f7;--dim:rgba(242,245,247,.68)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:48px 20px 80px}
.back{color:var(--dim);text-decoration:none;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
.chip{font:700 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--dim)}
.chip.pri-Urgent{background:rgba(255,93,162,.2);color:var(--pink)}
.chip.pri-High{background:rgba(233,169,59,.18);color:var(--gold)}
.chip.st-Done{background:rgba(34,230,200,.15);color:var(--teal)}
.chip.st-Blocked{background:rgba(255,93,162,.15);color:var(--pink)}
h1{font-family:Fraunces,serif;font-size:clamp(1.9rem,6vw,3rem);line-height:1.1;margin:0 0 10px}
.meta{color:var(--dim);font-size:15px;margin-bottom:8px}
.meta b{color:var(--text)}
.due{color:var(--gold);font-weight:700}
.due.over{color:var(--pink)}
.desc{font-size:19px;margin:18px 0 30px}
h2{font-size:1.4rem;margin:36px 0 12px}
h2 small{display:block;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.04em;margin-top:4px}
.box{border:1px solid var(--line);border-radius:12px;padding:6px 18px;background:var(--panel);margin-bottom:8px}
.box p{margin:12px 0}
.box label{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:12px 0;cursor:pointer}
.box input{margin-top:4px;width:18px;height:18px;accent-color:var(--teal)}
.done-t{text-decoration:line-through;color:var(--dim)}
.log{border-left:3px solid var(--teal);padding:2px 0 2px 14px;margin:14px 0}
.log b{color:var(--teal)}
.log .when{color:var(--dim);font-size:13px}
.log.esc{border-left-color:var(--pink)}
.log.esc b{color:var(--pink)}
.checks{list-style:none;padding:0;margin:0}
.checks li{padding:9px 0 9px 28px;position:relative;border-bottom:1px solid var(--line);font-size:15px}
.checks li:last-child{border-bottom:0}
.checks li:before{content:"○";position:absolute;left:0;color:var(--dim)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}
.actions button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:12px 20px;font:700 15px system-ui,sans-serif;cursor:pointer}
.actions button.go{background:var(--teal);color:#041018;border:0}
.actions button.warn{border-color:var(--pink);color:var(--pink)}
textarea,select,input[type=text]{width:100%;background:#0a0d14;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:15px/1.5 system-ui,sans-serif}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;margin-top:10px}
.row select{width:170px;flex:none}
.row button{border:0;cursor:pointer;padding:12px 20px;border-radius:999px;background:var(--teal);color:#041018;font:800 15px system-ui,sans-serif;white-space:nowrap}
.note{color:var(--dim);font-size:14px}
a{color:var(--teal)}
.banner{display:none;border:1px solid var(--pink);background:rgba(255,93,162,.1);border-radius:12px;padding:14px 16px;margin:20px 0}
</style>
</head>
<body>

adow:0 0 18px #ff6d00,0 -4px 22px #ffab00}}@keyframes flk{50%{opacity:.85}}@media (prefers-reduced-motion:reduce){.llh .gnav a.fire,.llh .gnav a.fire:before{animation:none}}.llh .gnav a.casino{color:#ff4fd8;font-weight:800;text-shadow:0 0 8px rgba(255,79,216,.8)}</style>

<footer class="ll-footer" style="border-top:1px solid rgba(128,128,128,.25);padding:22px 16px;text-align:center;font:14px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0b0f;color:#cfcfd6;position:relative;z-index:5;clear:both">

<script>
(function(){
var params=new URLSearchParams(location.search);
var id=params.get("id")||"";
var cards=llLoad();
var card=null;cards.forEach(function(c){if(c.id===id)card=c;});
var el=document.getElementById("card");
if(!card){
  el.innerHTML="<h1>Card not found</h1><p class='note'>No card "+llEsc(id)+" on the board. <a href='/cards.html'>Back to the board</a> or <a href='/submit.html'>submit a new one</a>.</p>";
  return;
}
document.title=card.id+" — "+card.title+" | LeonLink Board";
function today(){return new Date().toISOString().slice(0,10);}
function save(){var i=cards.indexOf(card);if(i>=0)cards[i]=card;llSave(cards);}
function log(who,text,esc){
  card.logs.push({who:who,when:today(),text:text,esc:!!esc});save();render();
}
function render(){
  var due=llDueLabel(card),over=due.indexOf("Overdue")===0;
  var h='<div class="chips"><span class="chip">'+llEsc(card.type)+'</span><span class="chip pri-'+llEsc(card.priority)+'">'+llEsc(card.priority)+'</span><span class="chip st-'+llEsc(card.status.replace(/ /g,""))+'">'+llEsc(card.status)+'</span><span class="chip">'+llEsc(card.cat)+'</span></div>'
  +'<h1>'+llEsc(card.id)+' — '+llEsc(card.title)+'</h1>'
  +'<p class="meta">Given <b>'+llEsc(card.date)+'</b> · <b>'+llEsc(card.team)+'</b> · Responsible: <b>'+llEsc(card.member)+'</b> · <span class="due'+(over?" over":"")+'">'+llEsc(due)+'</span> ('+llEsc(card.deadline)+')</p>'
  +'<p class="desc">'+llEsc(card.desc||"")+'</p>'
  +'<div class="banner" id="banner">Escalated — "What\'s happening?" sent to '+llEsc(card.member)+'\'s LeonLink inbox. The builder is expected to answer on the message board.</div>'
  +'<div class="actions"><button class="go" id="btn-done">Mark done — send to Inspector</button><button class="warn" id="btn-esc">Escalate — What\'s happening?</button></div>'
  +'<h2>Requirements<small>The job is not done until these are true</small></h2><div class="box" id="reqs">'
  +card.reqs.map(function(r,i){return '<label><input type="checkbox" data-i="'+i+'"'+(r.done?" checked":"")+'><span class="'+(r.done?"done-t":"")+'">'+llEsc(r.t)+'</span></label>';}).join("")
  +'</div>'
  +(card.cps&&card.cps.length?'<h2>Checkpoints<small>Big jobs get longer only by checkpoints</small></h2><div class="box">'
    +card.cps.map(function(r,i){return '<label><input type="checkbox" data-cp="'+i+'"'+(r.done?" checked":"")+'><span class="'+(r.done?"done-t":"")+'">'+llEsc(r.t)+'</span></label>';}).join("")+'</div>':"")
  +((card.gfx||card.audio)?'<h2>Graphics &amp; audio</h2><div class="box">'
    +(card.gfx?'<p><b>Graphics:</b> '+llEsc(card.gfx)+'</p>':"")
    +(card.audio?'<p><b>Audio:</b> '+llEsc(card.audio)+'</p>':"")+'</div>':"")
  +'<h2>Message board<small>Work logs live here — bots check their LeonLink inbox every 15–20 min</small></h2><div id="logs">'
  +card.logs.map(function(l){return '<div class="log'+(l.esc?" esc":"")+'"><b>'+llEsc(l.who)+'</b> <span class="when">'+llEsc(l.when)+'</span><br>'+llEsc(l.text)+'</div>';}).join("")
  +'</div><div class="row"><select id="who"><option>Stonewall</option><option>Leon</option><option>Gadget</option><option>Inspector</option><option>'+llEsc(card.member)+'</option></select><input type="text" id="logtext" placeholder="Log what you did, tested, or need"></div><div class="row"><button id="btn-log" style="margin-left:auto">Post log</button></div>'
  +'<h2>Inspection review<small>Inspector only — pass goes Done, fail goes back to work with notes</small></h2><div class="box"><p>'+llEsc(card.review||"No review yet.")+'</p></div>'
  +'<div class="actions"><button class="go" id="btn-pass">Inspector: Pass — Done</button><button id="btn-fail">Inspector: Fail — back to work</button></div>'
  +'<h2>Auto-checks<small>Run on every upload, before the Inspector sees it. Fail goes back to the builder with the exact failed check.</small></h2><ul class="checks">'
  +LL_AUTO_CHECKS.map(function(c){return '<li>'+llEsc(c)+'</li>';}).join("")+'</ul>'
  +'<p class="note">Auto-checks are listed, not yet run by the system — the checker that runs them is the next build.</p>';
  el.innerHTML=h;
  document.getElementById("btn-done").onclick=function(){
    card.status="In review";log(card.member,"Marked done — sent to Inspector for review.");
  };
  document.getElementById("btn-esc").onclick=function(){
    log("Stonewall","ESCALATED — What's happening? Pinged to "+card.member+"'s LeonLink inbox.",true);
    var b=document.getElementById("banner");if(b)b.style.display="block";
  };
  document.getElementById("btn-pass").onclick=function(){card.status="Done";log("Inspector","Passed. Card done.");};
  document.getElementById("btn-fail").onclick=function(){
    var note=prompt("What failed? (goes back to the builder as a note)");
    if(note===null)return;card.status="In progress";log("Inspector","Failed — back to work. "+note);
  };
  document.getElementById("btn-log").onclick=function(){
    var t=document.getElementById("logtext").value.trim();if(!t)return;
    log(document.getElementById("who").value,t);
  };
  Array.prototype.forEach.call(el.querySelectorAll("#reqs input"),function(c){
    c.onchange=function(){card.reqs[+c.dataset.i].done=c.checked;save();render();};
  });
  Array.prototype.forEach.call(el.querySelectorAll("[data-cp]"),function(c){
    c.onchange=function(){card.cps[+c.dataset.cp].done=c.checked;save();render();};
  });
}
render();
})();
</script>
