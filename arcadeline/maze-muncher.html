<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Maze Muncher - Arcadeline</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:"Courier New",monospace;color:#fff}
#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
.p{letter-spacing:.5em;font-size:2.2vmin;color:#9fdcff;opacity:0;animation:f 1s .3s forwards}
h1{font-size:12vmin;margin:.3em 0;color:#fff;text-shadow:0 0 10px #7fd8ff,0 0 30px #ff3bd4;opacity:0;transform:scale(.3);animation:r 1.2s 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
.t{font-size:3vmin;color:#ff8bf0;opacity:0;animation:f 1s 3s forwards}
.b{width:50vmin;height:2.4vmin;border:2px solid #7fd8ff;border-radius:2vmin;margin-top:5vmin;overflow:hidden;box-shadow:0 0 12px #7fd8ff}
.b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd8ff,#ff3bd4);animation:g 5.6s .6s linear forwards}
.ball{position:absolute;bottom:8vmin;left:-10vmin;width:4vmin;height:4vmin;border-radius:50%;background:#eaf8ff;box-shadow:0 0 15px #fff;animation:roll 6.2s .3s ease-in forwards}
@keyframes f{to{opacity:1}}@keyframes r{to{opacity:1;transform:scale(1)}}@keyframes g{to{width:100%}}
@keyframes roll{to{left:110vw;width:14vmin;height:14vmin;transform:rotate(1080deg)}}
#game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:5vmin;opacity:0;transition:opacity .8s}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;justify-content:space-between;padding:10px 14px;font-size:clamp(14px,4vmin,24px);text-shadow:0 0 8px #7fd8ff;pointer-events:none;z-index:2}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,6,15,.8);z-index:3;text-align:center;padding:20px;box-sizing:border-box}
#ov h2{font-size:clamp(28px,9vmin,64px);margin:0 0 10px;text-shadow:0 0 10px #7fd8ff,0 0 24px #ff3bd4}
#ov p{font-size:clamp(14px,3.6vmin,22px);color:#9fdcff;margin:6px}
#ov button{margin-top:18px;font:inherit;font-size:clamp(18px,5vmin,30px);padding:12px 30px;border-radius:30px;border:2px solid #7fd8ff;background:transparent;color:#fff;box-shadow:0 0 14px #ff3bd4}
#s{z-index:10;background:#05060f}
body{touch-action:none;user-select:none;-webkit-user-select:none}
</style></head><body>
<div id="hud"><span id="sc">Score 0</span><span id="lv">Lv 1</span><span id="lf">Lives 3</span><span id="hi">Best 0</span></div>
<canvas id="c"></canvas>
<div id="ov" style="display:none"><h2 id="ot">MAZE MUNCHER</h2><p id="op">Eat every dot and dodge the ghosts.<br>Power pellets let you eat them!</p><p>Swipe or arrow keys / WASD &middot; P to pause</p><button id="go">PLAY</button></div>
<div id="s"><div class="p">LEONLINK PRESENTS</div><h1>ARCADELINE</h1><div class="t">Start small. Roll big.</div><div class="b"><i></i></div><div class="ball"></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');
const MAP=["###################","#........#........#","#o##.###.#.###.##o#","#.................#","#.##.#.#####.#.##.#","#....#...#...#....#","####.### # ###.####","   #.#       #.#   ","####.# ##-## #.####","    .  #GGG#  .    ","####.# ##### #.####","   #.#       #.#   ","####.# ##### #.####","#........#........#","#.##.###.#.###.##.#","#o.#.....P.....#.o#","##.#.#.#####.#.#.##","#....#...#...#....#","#.######.#.######.#","#.................#","###################"];
const W=MAP[0].length,H=MAP.length;let grid,dots,pac,ghosts,score=0,lives=3,level=1,st='load',best=+localStorage.getItem('mm_best')||0,fright=0,T=20,ox=0,oy=0,last=0,combo=0;
$('hi').textContent='Best '+best;
const DIRS={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]},GC=['#ff3b5c','#ff8bf0','#00f0ff','#ff9a1f'];
function size(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;T=Math.floor(Math.min(cv.width/W,(cv.height-50*r)/H));ox=(cv.width-T*W)/2;oy=(cv.height-T*H)/2+20*r}
addEventListener('resize',size);size();
function cell(x,y){if(y<0||y>=H)return'#';return grid[y][(x+W)%W]}
function setup(full){if(full){grid=MAP.map(r=>r.split(''));dots=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c=='.'||c=='o')dots++;if(c=='P'||c=='G')grid[y][x]=' '}}
 let gi=0;ghosts=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=MAP[y][x];if(c=='P')pac={x,y,px:x,py:y,d:[0,0],nd:[0,0],t:0};if(c=='G'){ghosts.push({x,y,px:x,py:y,d:[0,0],t:0,c:GC[gi],hx:x,hy:y,wait:gi*2,out:0,eaten:0});gi++}}
 ghosts.push({x:9,y:7,px:9,py:7,d:[-1,0],t:0,c:GC[3],hx:9,hy:9,wait:0,out:1,eaten:0});fright=0}
function canGo(e,d,isG){const c=cell(e.x+d[0],e.y+d[1]);if(c=='#')return false;if(c=='-')return !!isG&&((!e.out&&e.wait<=0)||e.eaten);return true}
function step(e,dt,sp,isG){e.t+=dt*sp;let n=0;while(e.t>=1&&n++<3){e.t-=1;e.px=e.x;e.py=e.y;
 if(isG)ghostAI(e);else{if(canGo(e,e.nd))e.d=e.nd;if(!canGo(e,e.d))e.d=[0,0]}
 e.x=(e.x+e.d[0]+W)%W;e.y+=e.d[1];if(isG&&!e.eaten&&cell(e.x,e.y)=='-')e.out=1;
 if(!isG)eat();if(!e.d[0]&&!e.d[1]){e.t=0;break}}}
function ghostAI(e){if(e.wait>0){e.d=[0,0];return}let tx,ty;
 if(e.eaten){tx=e.hx;ty=e.hy;if(e.x==tx&&e.y==ty){e.eaten=0;e.out=0;e.wait=1}}
 else if(!e.out){tx=9;ty=7}else if(fright>0){tx=Math.random()*W|0;ty=Math.random()*H|0}
 else{const i=ghosts.indexOf(e);tx=pac.x;ty=pac.y;if(i==1){tx+=pac.d[0]*4;ty+=pac.d[1]*4}if(i==2){tx=W-1-pac.x;ty=H-1-pac.y}if(i==3&&Math.hypot(e.x-pac.x,e.y-pac.y)<6){tx=0;ty=H}}
 let bestD=null,bd=1e9;for(const k in DIRS){const d=DIRS[k];if((e.d[0]||e.d[1])&&d[0]==-e.d[0]&&d[1]==-e.d[1])continue;if(!canGo(e,d,1))continue;const s=Math.hypot(e.x+d[0]-tx,e.y+d[1]-ty)+Math.random()*.4;if(s<bd){bd=s;bestD=d}}
 if(!bestD){const r=[-e.d[0],-e.d[1]];bestD=canGo(e,r,1)?r:[0,0]}e.d=bestD}
function eat(){const c=grid[pac.y][pac.x];if(c=='.'||c=='o'){grid[pac.y][pac.x]=' ';dots--;score+=c=='o'?50:10;
 if(c=='o'){fright=Math.max(3,8-level);combo=0;for(const gh of ghosts)if(gh.out&&!gh.eaten)gh.d=[-gh.d[0],-gh.d[1]]}
 hud();if(dots<=0){level++;setup(1);msg('LEVEL '+level,'Ghosts get faster!','GO')}}}
function hud(){if(score>best){best=score;localStorage.setItem('mm_best',best)}$('sc').textContent='Score '+score;$('lv').textContent='Lv '+level;$('lf').textContent='Lives '+lives;$('hi').textContent='Best '+best}
function msg(t,p,b){st='msg';$('ot').textContent=t;$('op').innerHTML=p;$('go').textContent=b;$('ov').style.display='flex'}
function pos(e){let dx=e.x-e.px;if(Math.abs(dx)>1)dx=0;return[e.x-dx*(1-e.t),e.y-(e.y-e.py)*(1-e.t)]}
function collide(){const[bx,by]=pos(pac);for(const e of ghosts){if(e.eaten)continue;const[ax,ay]=pos(e);
 if(Math.abs(ax-bx)<.6&&Math.abs(ay-by)<.6){if(fright>0&&e.out){e.eaten=1;combo++;score+=200*(1<<(combo-1));hud()}
 else{lives--;hud();if(lives<=0){msg('GAME OVER','Score '+score+' &middot; Best '+best,'PLAY AGAIN');st='over'}else{setup(0);msg('OUCH!','Lives left: '+lives,'GO')}return}}}}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(st=='play'){const sp=6.5+level*.4;step(pac,dt,sp);
 for(const e of ghosts){e.wait-=dt;step(e,dt,e.eaten?14:fright>0&&e.out?sp*.55:sp*Math.min(1,.82+level*.03),1)}if(fright>0)fright-=dt;collide()}draw(ts);requestAnimationFrame(loop)}
function draw(ts){g.shadowBlur=0;g.fillStyle='#05060f';g.fillRect(0,0,cv.width,cv.height);if(!grid)return;g.shadowBlur=T*.4;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x],X=ox+x*T,Y=oy+y*T;
  if(c=='#'){g.shadowColor=g.strokeStyle='#3b7bff';g.lineWidth=Math.max(1,T*.12);g.strokeRect(X+T*.18,Y+T*.18,T*.64,T*.64)}
  else if(c=='-'){g.fillStyle='#ff8bf0';g.fillRect(X,Y+T*.45,T,T*.1)}
  else if(c=='.'){g.shadowColor=g.fillStyle='#ffe9a8';g.beginPath();g.arc(X+T/2,Y+T/2,T*.1,0,7);g.fill()}
  else if(c=='o'&&Math.sin(ts/150)>-.3){g.shadowColor=g.fillStyle='#fff';g.beginPath();g.arc(X+T/2,Y+T/2,T*.28,0,7);g.fill()}}
 let[px,py]=pos(pac);px=ox+(px+.5)*T;py=oy+(py+.5)*T;const d=pac.d,a=d[0]>0?0:d[0]<0?Math.PI:d[1]>0?Math.PI/2:d[1]<0?-Math.PI/2:0,m=.22*Math.abs(Math.sin(ts/80));
 g.shadowColor=g.fillStyle='#ffe600';g.beginPath();g.moveTo(px,py);g.arc(px,py,T*.45,a+m*Math.PI,a+(2-m)*Math.PI);g.closePath();g.fill();
 for(const e of ghosts){let[x,y]=pos(e);x=ox+(x+.5)*T;y=oy+(y+.5)*T;const r=T*.45,fl=fright>0&&e.out&&!e.eaten,col=fl?(fright<2&&Math.sin(ts/90)>0?'#fff':'#3b7bff'):e.c;
  if(!e.eaten){g.shadowBlur=T*.4;g.shadowColor=g.fillStyle=col;g.beginPath();g.arc(x,y,r,Math.PI,0);g.lineTo(x+r,y+r);for(let i=1;i<=4;i++)g.lineTo(x+r-i*r/2,y+r*(i%2?.7:1));g.closePath();g.fill()}
  g.shadowBlur=0;g.fillStyle='#fff';g.beginPath();g.arc(x-r*.35,y-r*.15,r*.22,0,7);g.arc(x+r*.35,y-r*.15,r*.22,0,7);g.fill();
  g.fillStyle='#05060f';g.beginPath();g.arc(x-r*.35+e.d[0]*r*.1,y-r*.15+e.d[1]*r*.1,r*.11,0,7);g.arc(x+r*.35+e.d[0]*r*.1,y-r*.15+e.d[1]*r*.1,r*.11,0,7);g.fill()}
 if(st=='pause'){g.fillStyle='#fff';g.font=(T*2|0)+'px monospace';g.textAlign='center';g.fillText('PAUSED',cv.width/2,cv.height/2)}}
function dir(k){if(st=='play')pac.nd=DIRS[k]}
addEventListener('keydown',e=>{const m={ArrowLeft:'L',a:'L',A:'L',ArrowRight:'R',d:'R',D:'R',ArrowUp:'U',w:'U',W:'U',ArrowDown:'D',s:'D',S:'D'}[e.key];
 if(m){dir(m);e.preventDefault()}else if(e.key=='p'||e.key=='P'){if(st=='play')st='pause';else if(st=='pause')st='play'}else if((e.key==' '||e.key=='Enter')&&$('ov').style.display=='flex')$('go').click()});
let sx=0,sy=0;cv.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',e=>{const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20){dir(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));sx=t.clientX;sy=t.clientY}e.preventDefault()},{passive:false});
$('go').onclick=()=>{$('ov').style.display='none';if(st=='over'||!grid){score=0;lives=3;level=1;setup(1);hud()}st='play'};
setup(1);requestAnimationFrame(loop);
setTimeout(()=>{$('s').style.opacity=0;setTimeout(()=>{$('s').style.display='none';$('ov').style.display='flex';st='menu'},800)},7000);
</script></body></html>
