<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ghost Call — fake incoming calls</title>
<meta name="description" content="Ghost Call: schedule a fake incoming call from Mom, your Boss, or a mystery number. The perfect excuse to leave anywhere. Free.">
<link rel="canonical" href="https://www.leonlink.net/ghost-call.html">
<meta property="og:title" content="Ghost Call — fake incoming calls">
<meta property="og:description" content="Schedule a fake incoming call. The perfect excuse to leave anywhere. Free.">
<meta property="og:image" content="https://www.leonlink.net/img/cards/ghostcall.jpg">
<meta name="theme-color" content="#000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;color:#fff;font-family:"DM Sans",system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.view{position:fixed;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
/* setup */
#setup{align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center}
#setup h1{font-family:"Fraunces",Georgia,serif;font-size:15px;letter-spacing:.2em;color:#888;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick{border:1px solid #333;background:#111;color:#fff;border-radius:999px;padding:14px 22px;font-size:17px;min-height:52px}
.pick.on{border-color:#34c759;background:#12351c}
.big{background:#34c759;color:#fff;border:0;border-radius:999px;font-size:22px;font-weight:700;padding:20px 54px;min-height:64px;box-shadow:0 0 30px #34c75966}
.big:active{transform:scale(.97)}
label{font-size:13px;letter-spacing:.15em;color:#666}
/* incoming */
#incoming{align-items:center;padding-top:12vh;background:radial-gradient(600px 400px at 50% 0%,#1a1a2e, #000)}
.avatar{width:110px;height:110px;border-radius:50%;background:#2a2a3a;display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:18px}
#inName{font-size:34px;font-weight:600}
#inNum{font-size:17px;color:#aaa;margin-top:6px}
#inLabel{font-size:14px;color:#888;margin-top:2px}
.spacer{flex:1}
.actions{display:flex;justify-content:space-around;width:100%;padding:0 50px calc(48px + env(safe-area-inset-bottom))}
.abtn{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:#fff;font-size:13px}
.circle{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.circle svg{width:32px;height:32px;fill:#fff}
.decline .circle{background:#ff3b30}
.accept .circle{background:#34c759;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #34c75988}50%{box-shadow:0 0 0 14px #34c75900}}
/* in call */
#incall{align-items:center;padding-top:12vh}
#callTimer{font-size:20px;color:#aaa;margin-top:8px;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin:40px 0;opacity:.85}
.pad button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.pad .circle{width:62px;height:62px;background:#222}
.pad svg{width:24px;height:24px;fill:#fff}
.endrow{margin-top:auto;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
@media(prefers-reduced-motion:reduce){.accept .circle{animation:none}}
</style></head>
<body>

<div class="view on" id="setup">
  <h1>GHOST CALL</h1>
  <div><label>WHO'S CALLING</label><div class="row" id="callers" style="margin-top:10px"></div></div>
  <div><label>RING IN</label><div class="row" id="delays" style="margin-top:10px"></div></div>
  <button class="big" id="arm">Ring my phone</button>
  <div style="color:#555;font-size:13px" id="countdown"></div>
  <a href="https://www.leonlink.net/" style="color:#444;font-size:12px;text-decoration:none;margin-top:8px">← leonlink.net</a>
</div>

<div class="view" id="incoming">
  <div class="avatar" id="inAvatar">📱</div>
  <div id="inName">Mom</div>
  <div id="inNum">+1 (555) 010-2030</div>
  <div id="inLabel">mobile</div>
  <div class="spacer"></div>
  <div class="actions">
    <button class="abtn decline" id="dec"><span class="circle"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.2.3-4.6 1L2 5.6 5.6 2l2.5 3.1c1-.4 2.1-.6 3.2-.6s2.5.2 3.6.7l2.6-3.2 3.5 3.6-2.6 2.5c2.7 1.6 4.6 4.5 4.6 7.9h-2c0-4.4-3.6-8-8-8z" transform="rotate(135 12 12)"/></svg></span>Decline</button>
    <button class="abtn accept" id="acc"><span class="circle"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></span>Accept</button>
  </div>
</div>

<div class="view" id="incall">
  <div class="avatar" id="callAvatar">📱</div>
  <div id="callName" style="font-size:28px;font-weight:600;margin-top:14px">Mom</div>
  <div id="callTimer">00:00</div>
  <div class="pad">
    <button><span class="circle"><svg viewBox="0 0 24 24"><path d="M12 14c1.7 0 3-1.3 3-3V5c0-1.7-1.3-3-3-3S9 3.3 9 5v6c0 1.7 1.3 3 3 3zm5-3c0 3-2.5 5.4-5.5 5.4S6 14 6 11H4c0 3.4 2.7 6.2 6 6.9V21h4v-3.1c3.3-.7 6-3.5 6-6.9h-2z"/></svg></span>mute</button>
    <button><span class="circle"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg></span>speaker</button>
    <button><span class="circle"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>add</button>
  </div>
  <div class="endrow">
    <button class="abtn decline" id="end"><span class="circle"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.2.3-4.6 1L2 5.6 5.6 2l2.5 3.1c1-.4 2.1-.6 3.2-.6s2.5.2 3.6.7l2.6-3.2 3.5 3.6-2.6 2.5c2.7 1.6 4.6 4.5 4.6 7.9h-2c0-4.4-3.6-8-8-8z" transform="rotate(135 12 12)"/></svg></span></button>
  </div>
</div>

<script>
const CALLERS=[
 {n:'Mom',p:'+1 (555) 010-2030',e:'👩'},
 {n:'Boss',p:'+1 (555) 010-7741',e:'💼'},
 {n:'Unknown',p:'No Caller ID',e:'❓'},
 {n:'Pizza Guy',p:'+1 (555) 010-3654',e:'🍕'},
];
const DELAYS=[['Now',0],['15 sec',15],['1 min',60],['5 min',300]];
let caller=0,delay=0,timer=null,audio=null;

const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$(id).classList.add('on')}

CALLERS.forEach((c,i)=>{const b=document.createElement('button');b.className='pick'+(i?'':' on');b.textContent=c.e+' '+c.n;b.onclick=()=>{caller=i;[...$('callers').children].forEach((x,j)=>x.classList.toggle('on',j===i))};$('callers').appendChild(b)});
DELAYS.forEach((d,i)=>{const b=document.createElement('button');b.className='pick'+(i?'':' on');b.textContent=d[0];b.onclick=()=>{delay=i;[...$('delays').children].forEach((x,j)=>x.classList.toggle('on',j===i))};$('delays').appendChild(b)});

function ringtone(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended')ctx.resume();
  const g=ctx.createGain();g.gain.value=.12;g.connect(ctx.destination);
  let t=0;const seq=[];
  for(let i=0;i<40;i++){seq.push([440+440*(i%2),t]);t+=.45;seq.push([0,t]);t+=.25}
  seq.forEach(([f,at])=>{if(!f)return;const o=ctx.createOscillator();o.frequency.value=f;o.connect(g);o.start(ctx.currentTime+at);o.stop(ctx.currentTime+at+.4)});
  return ctx;
}
function ring(){
  show('incoming');
  const c=CALLERS[caller];
  $('inName').textContent=c.n;$('inNum').textContent=c.p;$('inAvatar').textContent=c.e;
  $('callName').textContent=c.n;$('callAvatar').textContent=c.e;
  try{audio=ringtone()}catch(e){}
  if(navigator.vibrate){const v=setInterval(()=>navigator.vibrate([400,300]),900);if(audio)audio._v=v}
}
function stopRing(){
  if(audio){try{audio.close()}catch(e){}if(audio._v)clearInterval(audio._v);audio=null}
  if(navigator.vibrate)navigator.vibrate(0);
}
let secs=0,clock=null;
$('acc').onclick=()=>{stopRing();show('incall');secs=0;$('callTimer').textContent='00:00';
  clock=setInterval(()=>{secs++;$('callTimer').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')},1000)};
const hangup=()=>{stopRing();clearInterval(clock);show('setup');$('countdown').textContent=''};
$('dec').onclick=hangup;$('end').onclick=hangup;

$('arm').onclick=()=>{
  const s=DELAYS[delay][1];
  if(!s){ring();return}
  let left=s;$('countdown').textContent='Ringing in '+left+'s…';
  clearInterval(timer);timer=setInterval(()=>{left--;$('countdown').textContent='Ringing in '+left+'s…';
    if(left<=0){clearInterval(timer);$('countdown').textContent='';ring()}},1000);
};
</script>
<script>(function(){try{var p=location.pathname;fetch("/api/track?p="+encodeURIComponent(p)+"&r="+encodeURIComponent(document.referrer||""),{mode:"no-cors",keepalive:true}).catch(function(){})}catch(e){}})();</script>
</body></html>
