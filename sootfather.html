<script>/* Full-screen tap (Blue eyed Robert): while a "tap to continue" line is showing, a tap anywhere on the stage advances it, not just on the text box. Buttons, HUD and title/end screens are ignored. */
(function(){var st=document.getElementById('stage');if(!st)return;st.addEventListener('click',function(e){var t=document.getElementById('text'),p=document.getElementById('panel');if(!t||!p||p.hidden||typeof t.onclick!=='function')return;if(t.contains(e.target))return;if(e.target.closest('button,a,input,#hud,.ov,#choices'))return;t.click();});})();</script>
<style>@keyframes sfSpin{to{transform:rotate(360deg)}}#sfBoot .br{animation:sfSpin 1.4s linear infinite;display:inline-block}</style>
<script>/* Sootcrest intro (Blue eyed Robert). 1) Boot screen replaces the shared LeonLink "General Pip Production" intro: Sootcrest Studios card with a spinning chimney brush instead of the spinning L. Once per session. 2) First "New game" tap plays the full Sootcrest intro (sting, title, flash, tagline). Taps are ignored for the first 4.2s so it always plays through; after that a tap continues. Silent if muted. */
(function(){var st=document.getElementById('stage'),b=document.getElementById('bNew');if(!st)return;var A='/audio/sootfather/';
function muted(){var m=document.getElementById('bMute');return m&&m.textContent.indexOf('\uD83D\uDD07')>-1;}
function snd(n){if(muted())return;try{var a=new Audio(A+n+'.mp3');a.volume=.8;var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
var seen=false;try{seen=!!sessionStorage.getItem('sf-boot');}catch(e){}
if(!seen){var bo=document.createElement('div');bo.id='sfBoot';bo.className='ov';bo.style.cssText='z-index:60;background:#0b0b12;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s';
bo.innerHTML='<div class="br"><svg viewBox="0 0 64 64" width="84" height="84"><rect x="29" y="4" width="6" height="34" rx="3" fill="#8a5a2b" stroke="#18181b" stroke-width="2"/><rect x="25" y="36" width="14" height="6" rx="2" fill="#9aa0a6" stroke="#18181b" stroke-width="2"/><path d="M22 42h20l4 18H18z" fill="#2a2a2e" stroke="#18181b" stroke-width="2"/><path d="M22 48l-2 12M28 48v12M36 48v12M42 48l2 12" stroke="#55555c" stroke-width="2"/></svg></div><div class="sub" style="margin-top:16px;letter-spacing:.25em;font-size:15px">SOOTCREST STUDIOS</div>';
st.appendChild(bo);var bd=false;function bend(){if(bd)return;bd=true;try{sessionStorage.setItem('sf-boot','1');}catch(e){}bo.style.opacity='0';setTimeout(function(){if(bo.parentNode)bo.parentNode.removeChild(bo);},520);}
setTimeout(function(){bo.addEventListener('click',bend);},1200);setTimeout(bend,2600);}
if(!b)return;var done=false;
b.addEventListener('click',function(e){if(done)return;e.stopImmediatePropagation();e.preventDefault();done=true;
var o=document.createElement('div');o.className='ov';o.style.cssText='z-index:50;background:#0b0b12;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:background .2s';
o.innerHTML='<div id="sfI1" class="sub" style="opacity:0;transition:opacity .6s;font-size:15px;letter-spacing:.2em">SOOTCREST STUDIOS PRESENTS</div><h1 id="sfI2" style="opacity:0;transform:scale(1.3);filter:blur(8px);transition:all .7s"><span class="r">ASHBUSTEN</span> TOWN</h1><div id="sfI3" class="sub" style="opacity:0;transition:opacity .5s">The family needs a sweep.</div><div id="sfI4" class="sub" style="position:absolute;bottom:18px;font-size:12px;opacity:0;transition:opacity .4s">tap to continue</div>';
st.appendChild(o);var T=[],g=function(id){return document.getElementById(id);},fin=false;
function end(){if(fin)return;fin=true;T.forEach(clearTimeout);if(o.parentNode)o.parentNode.removeChild(o);b.click();}
snd('intro_sting');T.push(setTimeout(function(){g('sfI1').style.opacity=1;},100));
T.push(setTimeout(function(){snd('smoke_bomb');g('sfI1').style.opacity=0;var h=g('sfI2');h.style.opacity=1;h.style.transform='scale(1)';h.style.filter='blur(0)';},1400));
T.push(setTimeout(function(){snd('railgun_shot');o.style.background='#fff';setTimeout(function(){o.style.background='#0b0b12';g('sfI3').style.opacity=1;},90);},2600));
T.push(setTimeout(function(){g('sfI4').style.opacity=.6;o.addEventListener('click',end);},4200));
T.push(setTimeout(end,7000));},true);})();</script>
