<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battleline — a LeonLink game</title>
<meta name="description" content="Battleline: turn-based arena duels. Pick your class, read your enemy, climb the 10-rung ladder. Free.">
<link rel="canonical" href="https://www.leonlink.net/battleline.html">
<meta property="og:title" content="Battleline — a LeonLink game">
<meta property="og:description" content="Ten fighters. One line. Climb it.">
<meta property="og:image" content="https://www.leonlink.net/img/cards/battleline.jpg">
<meta name="theme-color" content="#0b0b16">
<link rel="icon" href="/favicon.png">
<script src="/js/nav.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:#0b0b16}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef;user-select:none;-webkit-user-select:none;min-height:100dvh;display:flex;flex-direction:column;font-size:17px}
#gtop{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#10101d;border-bottom:1px solid #26263e;flex:0 0 auto}
#gtop a.back{color:#9b9dba;text-decoration:none;font-weight:700;font-size:15px;min-height:44px;display:flex;align-items:center}
#gtop .wm{font-weight:900;letter-spacing:.18em;font-size:16px;color:#f2c14e}
#rungpill{margin-left:auto;background:#1a1a2e;border:1px solid #33335a;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:800;color:#9be7ff;white-space:nowrap}
main{flex:1 0 auto;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;padding-bottom:96px}
.view{display:none;flex-direction:column;padding:14px;gap:12px;width:100%}
.view.on{display:flex}
h1{font-size:34px;font-weight:900;letter-spacing:.01em}
.sub{color:#9b9dba;font-size:16px;line-height:1.45}
.namerow{display:flex;gap:10px}
#fname{flex:1;background:#141422;border:2px solid #33335a;color:#fff;border-radius:12px;padding:0 14px;font-size:19px;font-weight:700;min-height:58px;min-width:0}
#fname:focus{outline:none;border-color:#f2c14e}
#fdice{background:#1a1a2e;border:2px solid #33335a;color:#fff;border-radius:12px;min-width:58px;min-height:58px;font-size:22px;font-weight:900;cursor:pointer}
#fdice:active{transform:scale(.94)}
.classcard{display:block;width:100%;text-align:left;background:#141422;border:2px solid #33335a;color:#fff;border-radius:14px;padding:14px;cursor:pointer;min-height:76px}
.classcard .cn{font-size:21px;font-weight:900}
.classcard .cs{font-size:14px;color:#9b9dba;margin-top:2px}
.classcard .cb{font-size:15px;margin-top:6px;line-height:1.4}
.classcard .ca{font-size:13px;color:#f2c14e;margin-top:6px;font-weight:700}
.classcard.sel{border-color:#f2c14e;background:#1c1a26}
.bigbtn{display:block;width:100%;background:#f2c14e;color:#171207;border:none;border-radius:14px;font-size:21px;font-weight:900;padding:18px;cursor:pointer;min-height:64px}
.bigbtn:active{transform:scale(.98)}
.bigbtn:disabled{opacity:.45}
.ghostbtn{display:block;width:100%;background:transparent;color:#9b9dba;border:2px solid #33335a;border-radius:14px;font-size:17px;font-weight:700;padding:14px;cursor:pointer;min-height:58px}
/* ---- duel ---- */
#v-duel{height:calc(100dvh - 135px);max-height:720px;min-height:480px;padding-bottom:8px}
.plate{background:#10101d;border:1px solid #26263e;border-radius:12px;padding:8px 12px}
.plate .pr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pname{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phpt{font-size:13px;color:#9b9dba;font-weight:700;white-space:nowrap}
.hpbar{height:12px;border-radius:99px;background:#23233a;overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
#ehpf{background:linear-gradient(90deg,#b91c1c,#ff5c5c)}
#mhpf{background:linear-gradient(90deg,#0f766e,#5eead4)}
.stbar{height:8px;border-radius:99px;background:#23233a;overflow:hidden;margin-top:5px}
.stbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7c5cff,#b79bff);transition:width .35s ease}
#intent{min-height:22px;font-size:14px;font-weight:700;color:#ffb84d;margin-top:4px}
#midrow{display:flex;align-items:center;justify-content:space-between}
#rungtag{font-size:13px;font-weight:900;letter-spacing:.14em;color:#9be7ff}
#scoretag{font-size:13px;font-weight:800;color:#9b9dba}
#stage{position:relative;flex:1 1 auto;min-height:140px;border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 50% 110%,#23233f 0%,#14141f 55%,#0d0d17 100%);border:1px solid #26263e}
#stage .floor{position:absolute;left:6%;right:6%;bottom:12%;height:3px;background:#33335a;border-radius:99px;opacity:.7}
.fx{position:absolute;bottom:14%;width:32%;max-width:150px}
#fxM{left:7%}
#fxE{right:7%}
.fx .flip{transform:scaleX(-1)}
.fx svg{width:100%;height:auto;display:block;overflow:visible}
.ovl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.fx.flash .ovl{animation:fl .3s ease}
@keyframes fl{0%{opacity:0}30%{opacity:.55}100%{opacity:0}}
.fx.atkM{animation:lungeR .38s ease}
.fx.atkE{animation:lungeL .38s ease}
@keyframes lungeR{0%{transform:translateX(0)}40%{transform:translateX(52px)}100%{transform:translateX(0)}}
@keyframes lungeL{0%{transform:translateX(0)}40%{transform:translateX(-52px)}100%{transform:translateX(0)}}
.fx.hurt{animation:shk2 .32s ease}
@keyframes shk2{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.fx.ko{animation:kod .6s ease forwards}
@keyframes kod{to{transform:rotate(72deg) translateY(26px);opacity:.25}}
#stage.shake{animation:shk .36s ease}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,2px)}}
.hitnum{position:absolute;font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none;animation:pop .75s ease forwards;white-space:nowrap}
.hitnum.crit{color:#ffd75c;font-size:32px}
.hitnum.miss{color:#9b9dba;font-size:20px}
.hitnum.heal{color:#5eead4}
@keyframes pop{0%{transform:translateY(6px) scale(.7);opacity:0}18%{opacity:1;transform:translateY(0) scale(1.12)}100%{transform:translateY(-44px) scale(1);opacity:0}}
#banner{position:absolute;top:16%;left:0;right:0;text-align:center;font-size:34px;font-weight:900;letter-spacing:.04em;opacity:0;pointer-events:none;text-shadow:0 3px 14px #000}
#banner.show{animation:ban 1.5s ease forwards}
@keyframes ban{0%{opacity:0;transform:scale(.85)}18%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
#dock{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 auto}
.act{background:#1a1a2e;border:2px solid #33335a;color:#fff;border-radius:14px;padding:10px 8px;cursor:pointer;min-height:66px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.act b{font-size:18px}
.act span{font-size:12.5px;color:#9b9dba;font-weight:600}
.act:active:not(:disabled){transform:scale(.97)}
.act:disabled{opacity:.38;cursor:default}
.act.cd span{color:#f2c14e}
#taunt{font-size:14.5px;font-style:italic;color:#9b9dba;text-align:center;min-height:20px}
/* ---- gear / end ---- */
.gearcard{display:block;width:100%;text-align:left;background:#141422;border:2px solid #33335a;color:#fff;border-radius:14px;padding:16px;cursor:pointer;min-height:88px}
.gearcard .gs{font-size:12px;font-weight:800;letter-spacing:.12em;color:#9be7ff}
.gearcard .gn{font-size:20px;font-weight:900;margin-top:2px}
.gearcard .gd{font-size:15px;color:#9b9dba;margin-top:4px;line-height:1.4}
.gearcard:active{transform:scale(.98);border-color:#f2c14e}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#141422;border:1px solid #26263e;border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:26px;display:block}
.stat span{font-size:13px;color:#9b9dba}
.best{font-size:14px;color:#9b9dba;text-align:center}
@media(min-width:560px){
  #dock{grid-template-columns:repeat(4,1fr)}
  h1{font-size:40px}
}

/* ---- overhaul: arena, motion, particles ---- */
#stage{background:#0d0d17;box-shadow:inset 0 0 60px rgba(0,0,0,.7),0 8px 30px rgba(0,0,0,.45)}
#stage .arena{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage .floor{display:none}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,transparent 45%,rgba(0,0,0,.55) 100%)}
.star{animation:tw 2.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.torch{animation:tf .18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.flame{animation:tf .12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes tf{from{transform:scale(.92);opacity:.85}to{transform:scale(1.08);opacity:1}}
.crowd{animation:cr 1.6s ease-in-out infinite}
#stage.cheer .crowd{animation:cr .25s ease-in-out 6}
@keyframes cr{50%{transform:translateY(-2px)}}
.fx{z-index:2;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.fx .flip{transform:scaleX(-1);transform-origin:50px 0}
.fx .breathe{animation:br 2.4s ease-in-out infinite;transform-origin:50px 134px}
@keyframes br{50%{transform:scaleY(1.02) translateY(-1px)}}
.fx .cape{animation:cp 2.8s ease-in-out infinite;transform-origin:44px 46px}
@keyframes cp{50%{transform:skewX(-4deg)}}
.eyeglow{animation:eg 1.8s ease-in-out infinite}
@keyframes eg{50%{opacity:.15}}
.fx.atkM .wpn,.fx.atkE .wpn{animation:sw .38s ease;transform-origin:76px 78px}
@keyframes sw{40%{transform:rotate(55deg)}}
.fx.flash .ovl{fill:#fff}
.ovl{mix-blend-mode:screen}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;z-index:4;pointer-events:none;box-shadow:0 0 8px currentColor;animation:spk .6s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.slash{position:absolute;top:44%;width:14%;height:4px;border-radius:99px;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 12px #fff;animation:sl .34s ease-out forwards}
.slash.big{height:7px;background:linear-gradient(90deg,transparent,#ffd75c,transparent);box-shadow:0 0 18px #ffb84d}
@keyframes sl{0%{opacity:0;width:0}30%{opacity:1;width:16%}100%{opacity:0;width:20%}}
#stage.zoom{animation:zm .45s ease}
@keyframes zm{30%{transform:scale(1.06)}}
.hitnum{z-index:5;-webkit-text-stroke:1.5px rgba(0,0,0,.6);font-size:30px}
.hitnum.crit{font-size:38px;color:#ffd75c;text-shadow:0 0 16px #ff9a1a,0 2px 8px #000}
#banner{z-index:6;background:linear-gradient(90deg,transparent,rgba(0,0,0,.55),transparent);padding:6px 0;color:#ffd75c}
.hpbar{position:relative;height:14px;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.hpbar i{position:relative;z-index:1;box-shadow:0 0 10px currentColor}
.hpbar i::after{content:"";position:absolute;inset:0 0 50% 0;background:rgba(255,255,255,.25);border-radius:99px}
.hpbar.low i{animation:lowp .8s ease-in-out infinite}
@keyframes lowp{50%{filter:brightness(1.6)}}
.plate{background:linear-gradient(180deg,#151528,#0e0e1a);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#intent{display:flex;align-items:center;gap:6px}
.act{background:linear-gradient(180deg,#232342,#16162a);box-shadow:0 3px 0 #0a0a14,0 6px 14px rgba(0,0,0,.35);transition:transform .06s,box-shadow .06s,border-color .2s}
.act:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #0a0a14}
.act[data-a="heavy"]{border-color:#7a3b2a}.act[data-a="block"]{border-color:#2a5a7a}.act[data-a="ability"]{border-color:#6a4fb8}
.act[data-a="ability"]:not(:disabled){animation:abr 1.6s ease-in-out infinite}
@keyframes abr{50%{box-shadow:0 3px 0 #0a0a14,0 0 18px rgba(124,92,255,.55)}}
#dock.wait .act{opacity:.45}
#turnind{text-align:center;font-size:12px;font-weight:900;letter-spacing:.16em;color:#9be7ff;min-height:16px}
#dock.wait+#turnind,#turnind.enemy{color:#ff7a7a}
#blmute{background:#1a1a2e;border:1px solid #33335a;color:#fff;border-radius:999px;width:40px;height:40px;font-size:16px;cursor:pointer;flex:0 0 auto}
.classcard,.gearcard{transition:transform .1s,border-color .2s;background:linear-gradient(180deg,#191930,#121222)}
@media (prefers-reduced-motion:reduce){.star,.torch,.flame,.crowd,.fx .breathe,.fx .cape,.eyeglow{animation:none}}
/* ---- phone landscape: stage left, controls right ---- */
@media (orientation:landscape) and (max-height:540px){
  #gtop{padding:4px 10px}#gtop a.back{min-height:34px;font-size:13px}
  main{max-width:none;padding-bottom:calc(8px + env(safe-area-inset-bottom));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .view{padding:8px}
  #v-duel.on{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto 1fr auto auto auto;column-gap:10px;row-gap:6px;height:calc(100dvh - 54px);min-height:0;max-height:none}
  #eplate{grid-column:2;grid-row:1}
  #midrow{grid-column:2;grid-row:2}
  #stage{grid-column:1;grid-row:1/7;min-height:0}
  #taunt{grid-column:2;grid-row:3;align-self:center;font-size:12px}
  #mplate{grid-column:2;grid-row:4}
  #dock{grid-column:2;grid-row:5;grid-template-columns:1fr 1fr;gap:6px}
  #turnind{grid-column:2;grid-row:6}
  .act{min-height:48px;padding:4px 6px}.act b{font-size:15px}.act span{font-size:10.5px}
  .plate{padding:5px 9px}.pname{font-size:14px}.hpbar{height:10px;margin-top:3px}
  #v-create.on,#v-gear.on,#v-end.on{max-width:640px;margin:0 auto}
  h1{font-size:26px}
}
@media (max-height:680px) and (orientation:portrait){
  #v-duel{height:calc(100dvh - 120px);min-height:420px}
  .act{min-height:56px}
}
</style>
</head>
<body>
<div id="gtop">
  <a class="back" href="/games.html">&larr; Games</a>
  <span class="wm">BATTLELINE</span>
  <span id="rungpill" style="display:none"></span>
  <button id="blmute" aria-label="Sound on/off">&#128266;</button>
</div>
  <div id="turnind">YOUR MOVE</div>
<main>
<!-- CREATE -->
<section class="view on" id="v-create">
  <h1>Build your fighter.</h1>
  <p class="sub">Ten rungs. One line. Climb it.</p>
  <div class="namerow">
    <input id="fname" maxlength="16" placeholder="Fighter name" autocomplete="off">
    <button id="fdice" aria-label="Random name">&#9861;</button>
  </div>
  <button class="classcard" data-cls="blade">
    <div class="cn">Blade</div><div class="cs">112 HP &middot; balanced &middot; 25% crit</div>
    <div class="cb">The all-rounder. Reliable strikes that sometimes land twice as hard.</div>
    <div class="ca">ABILITY: Flurry — 3 quick strikes (3-turn cooldown)</div>
  </button>
  <button class="classcard" data-cls="brawler">
    <div class="cn">Brawler</div><div class="cs">118 HP &middot; heavy hits &middot; hits like a truck</div>
    <div class="cb">Slow, mean, and hard to put down. Heavies hurt everybody.</div>
    <div class="ca">ABILITY: Crush — huge hit, ignores Block (4-turn cooldown)</div>
  </button>
  <button class="classcard" data-cls="ranger">
    <div class="cn">Ranger</div><div class="cs">100 HP &middot; fast &middot; 30% double-strike</div>
    <div class="cb">Fragile and furious. Wins before the other guy loads up.</div>
    <div class="ca">ABILITY: Pinpoint — one guaranteed crit (3-turn cooldown)</div>
  </button>
  <button class="bigbtn" id="startbtn" disabled>Pick a class</button>
</section>
<!-- DUEL -->
<section class="view" id="v-duel">
  <div class="plate" id="eplate">
    <div class="pr"><span class="pname" id="ename">—</span><span class="phpt" id="ehpt"></span></div>
    <div class="hpbar"><i id="ehpf"></i></div>
    <div id="intent"></div>
  </div>
  <div id="midrow"><span id="rungtag"></span><span id="scoretag"></span></div>
  <div id="stage">
    <div class="floor"></div>
    <div class="fx" id="fxM"></div>
    <div class="fx" id="fxE"></div>
    <div id="hits"></div>
    <div id="banner"></div>
  </div>
  <div id="taunt"></div>
  <div class="plate" id="mplate">
    <div class="pr"><span class="pname" id="mname">—</span><span class="phpt" id="mhpt"></span></div>
    <div class="hpbar"><i id="mhpf"></i></div>
    <div class="stbar"><i id="mstf"></i></div>
  </div>
  <div id="dock">
    <button class="act" data-a="strike"><b>Strike</b><span>Reliable. No cost.</span></button>
    <button class="act" data-a="heavy"><b>Heavy</b><span>Big damage. Can miss. <span class="cost"></span></span></button>
    <button class="act" data-a="block"><b>Block</b><span>Halve next hit. +25 stamina.</span></button>
    <button class="act" data-a="ability"><b class="abn">Ability</b><span class="abd"></span></button>
  </div>
</section>
<!-- GEAR -->
<section class="view" id="v-gear">
  <h1>Rung <span id="gcleared"></span> clear.</h1>
  <p class="sub" id="gheal"></p>
  <p class="sub" style="font-weight:800;color:#fff">Take one:</p>
  <div id="gears" style="display:flex;flex-direction:column;gap:10px"></div>
</section>
<!-- END -->
<section class="view" id="v-end">
  <h1 id="endtitle">K.O.</h1>
  <p class="sub" id="endsub"></p>
  <div class="statgrid">
    <div class="stat"><b id="st-rung">0</b><span>rungs cleared</span></div>
    <div class="stat"><b id="st-score">0</b><span>score</span></div>
    <div class="stat"><b id="st-nohit">0</b><span>no-hit rounds</span></div>
    <div class="stat"><b id="st-comeback">0</b><span>comebacks</span></div>
  </div>
  <p class="best" id="st-best"></p>
  <button class="bigbtn" id="againbtn">Fight again</button>
  <a class="ghostbtn" href="/games.html" style="text-align:center;text-decoration:none">Back to games</a>
</section>
</main>
<script>
"use strict";
/* ================= ENGINE (no DOM) ================= */
var BL = (function(){
  var seed = 1;
  function setSeed(n){ seed = (n>>>0) || 1; }
  function rnd(){ // mulberry32
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed>>>15), 1|seed);
    t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  }
  function rr(a,b){ return a + rnd()*(b-a); }
  function ri(a,b){ return Math.floor(rr(a, b+1)); }
  function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }

  var CLASSES = {
    blade:   {label:'Blade',   hp:112, st:100, smin:13, smax:17, hmin:26, hmax:34, hcost:25, hacc:0.75, crit:0.25, dbl:0,
              ab:{name:'Flurry', kind:'flurry', cd:3, cost:20}, col:['#3a4356','#7aa2ff'], wpn:'sword'},
    brawler: {label:'Brawler', hp:118, st:100, smin:14, smax:18, hmin:32, hmax:42, hcost:25, hacc:0.70, crit:0.10, dbl:0,
              ab:{name:'Crush', kind:'crush', cd:4, cost:30}, col:['#4a3636','#ff7a5c'], wpn:'hammer'},
    ranger:  {label:'Ranger',  hp:100,  st:110, smin:11, smax:15, hmin:24, hmax:30, hcost:25, hacc:0.80, crit:0.15, dbl:0.30,
              ab:{name:'Pinpoint', kind:'pinpoint', cd:3, cost:20}, col:['#2c4438','#5cffb1'], wpn:'bow'}
  };

  var NAMES = ['Ash','Rook','Vex','Juno','Kade','Mira','Sol','Drex','Ivy','Corv','Lux','Bram','Zed','Onyx','Raze','Talon','Wren','Zara','Flint','Sable'];
  function randomName(){ return pick(NAMES); }

  function mkFighter(name, cls, isPlayer){
    var c = CLASSES[cls];
    return { name:name, cls:cls, isPlayer:!!isPlayer,
      maxhp:c.hp, hp:c.hp, maxst:c.st, st:c.st,
      smin:c.smin, smax:c.smax, hmin:c.hmin, hmax:c.hmax,
      hcost:c.hcost, hacc:c.hacc, crit:c.crit, dbl:c.dbl,
      ab:{name:c.ab.name, kind:c.ab.kind, cd:c.ab.cd, cost:c.ab.cost, t:0},
      col:c.col.slice(), wpn:c.wpn,
      block:false, blockPow:0.5, sPow:0, hPow:0, proc:0, abPow:0,
      stRegen:12, hCostMod:0, healKill:0, lifeSteal:0, gear:[] };
  }

  var RUNGS = [

  [[22,150],[378,150]].forEach(function(p){s+='<rect x="'+(p[0]-2)+'" y="'+p[1]+'" width="4" height="30" fill="#2a1a10"/><circle class="torch" cx="'+p[0]+'" cy="'+(p[1]-4)+'" r="26" fill="url(#atorch)"/><path class="flame" d="M'+(p[0]-4)+' '+p[1]+' Q'+p[0]+' '+(p[1]-16)+' '+(p[0]+4)+' '+p[1]+'Z" fill="#ffcf5a"/>';});
  return s+'</svg>';
}
var SFX={ac:null,muted:false,
  init:function(){if(!this.ac){try{this.ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ac&&this.ac.state==='suspended')this.ac.resume()},
  tone:function(f,d,type,vol,slide){if(this.muted||!this.ac)return;var t=this.ac.currentTime,o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(this.ac.destination);o.start(t);o.stop(t+d)},
  noise:function(d,vol,hp){if(this.muted||!this.ac)return;var n=this.ac.sampleRate*d,b=this.ac.createBuffer(1,n,this.ac.sampleRate),c=b.getChannelData(0);
    for(var i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);var s=this.ac.createBufferSource(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();
    f.type='highpass';f.frequency.value=hp||800;s.buffer=b;g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(this.ac.destination);s.start()},
  play:function(k){switch(k){
    case 'hit':this.noise(0.12,0.25,600);this.tone(160,0.12,'square',0.1,60);break;
    case 'crit':this.noise(0.25,0.35,300);this.tone(520,0.25,'sawtooth',0.12,90);break;
    case 'miss':this.noise(0.15,0.08,2500);break;
    case 'block':this.tone(880,0.12,'triangle',0.12,660);this.tone(1320,0.18,'sine',0.06);break;
    case 'heal':this.tone(520,0.15,'sine',0.1,880);break;
    case 'ab':this.tone(300,0.3,'sawtooth',0.1,900);break;
    case 'ko':this.tone(200,0.6,'sawtooth',0.14,40);this.noise(0.5,0.3,200);break;
    case 'win':[523,659,784,1046].forEach(function(f,i){setTimeout(function(){SFX.tone(f,0.18,'square',0.09)},i*110)});break;
    case 'tap':this.tone(700,0.04,'square',0.04);break;}}};
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function sparks(xPct, crit, col){
  var st=$('stage'),r=st.getBoundingClientRect(),n=crit?22:12;
  for(var i=0;i<n;i++){var p=document.createElement('i');p.className='spark';
    var a=Math.random()*6.283,d=(crit?70:44)*(0.5+Math.random());
    p.style.left=xPct+'%';p.style.top=(48+Math.random()*10)+'%';
    p.style.background=col||(crit?'#ffd75c':(i%3?'#fff':'#ff9a5c'));
    p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',(Math.sin(a)*d-20)+'px');
    st.appendChild(p);setTimeout(function(el){return function(){el.remove()}}(p),620)}
  var sl=document.createElement('i');sl.className='slash'+(crit?' big':'');sl.style.left=(xPct-6)+'%';sl.style.transform='rotate('+(Math.random()*60-30)+'deg)';
  st.appendChild(sl);setTimeout(function(){sl.remove()},360);
  if(crit){st.classList.remove('zoom');void st.offsetWidth;st.classList.add('zoom')}
}

var G = null; // run state
function setTurn(mine){ var d=$('dock'),t=$('turnind'); if(!d||!t)return; d.classList.toggle('wait',!mine); t.classList.toggle('enemy',!mine); t.textContent = mine ? 'YOUR MOVE' : 'ENEMY TURN\u2026'; }
function show(id){
  ['v-create','v-duel','v-gear','v-end'].forEach(function(v){ $(v).classList.toggle('on', v===id); });
  window.scrollTo(0,0);
}
function banner(t){ var b=$('banner'); b.textContent=t; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
function hitnum(x, txt, cls){
  var s=document.createElement('span'); s.className='hitnum '+(cls||''); s.textContent=txt;
  s.style.left=x+'%'; s.style.top=(38+Math.random()*14)+'%';
  $('hits').appendChild(s); setTimeout(function(){ s.remove(); }, 780);
}
function fxHit(el, heavy){
  el.classList.remove('hurt','flash'); void el.offsetWidth;
  el.classList.add('hurt','flash');
  if(heavy){ var st=$('stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); }
}
function fxAtk(el, me){ el.classList.remove('atkM','atkE'); void el.offsetWidth; el.classList.add(me?'atkM':'atkE'); }

function updBars(){
  var e=G.enemy, m=G.me;
  $('ehpf').style.width=(100*e.hp/e.maxhp)+'%';
  $('mhpf').style.width=(100*m.hp/m.maxhp)+'%';
  $('mstf').style.width=(100*m.st/m.maxst)+'%';
  $('ehpt').textContent=e.hp+'/'+e.maxhp;
  $('mhpt').textContent=m.hp+'/'+m.maxhp+' · '+Math.floor(m.st)+' st';
  $('rungpill').textContent = 'RUNG ' + G.rung;
  $('rungtag').textContent = 'RUNG ' + G.rung + (G.rung>10 ? ' · ENDLESS' : ' / 10');
  $('scoretag').textContent = 'SCORE ' + G.score;
  var btns = document.querySelectorAll('#dock .act');
  var cost = m.hcost + m.hCostMod;
  btns[1].disabled = m.st < cost;
  btns[1].querySelector('.cost').textContent = cost + ' st';
  var ab = btns[3];
  ab.querySelector('.abn').textContent = m.ab.name;
  if(m.ab.t > 0 || m.st < m.ab.cost){ ab.disabled = true; ab.classList.add('cd'); }
  else { ab.disabled = false; ab.classList.remove('cd'); }
  ab.querySelector('.abd').textContent = m.ab.t>0 ? ('Ready in '+m.ab.t) : (m.ab.name==='Flurry'?'3 quick strikes · '+m.ab.cost+' st':m.ab.name==='Crush'?'Ignores block · '+m.ab.cost+' st':'Guaranteed crit · '+m.ab.cost+' st');
  $('intent').textContent = e.hp>0 ? BL.intentText(e.intent) : '';
  $('ehpf').parentNode.classList.toggle('low', e.hp/e.maxhp<0.3);
  $('mhpf').parentNode.classList.toggle('low', m.hp/m.maxhp<0.3);
}

function startDuel(){
  var e = G.enemy;
  $('ename').textContent = e.name;
  $('mname').textContent = G.me.name;
  $('fxM').innerHTML = fighterSVG(G.me.col, G.me.wpn, false);
  $('fxE').innerHTML = fighterSVG(e.col, e.wpn, true);
  var oa=$('stage').querySelector('.arena');if(oa)oa.remove();$('stage').insertAdjacentHTML('afterbegin',arenaSVG(G.rung));
  setTurn(true);
  $('fxE').classList.remove('ko'); $('fxM').classList.remove('ko');
  $('taunt').textContent = '\u201C' + e.taunt + '\u201D';
  $('hits').innerHTML = '';
  G.lock = false;
  updBars();
}

function eventsToFx(events, attEl, defEl, defIsEnemy){
  var ax = defIsEnemy ? 24 : 62;   // attacker side
  var dx = defIsEnemy ? 62 : 24;   // defender side
  events.forEach(function(ev, k){
    setTimeout(function(){
      if(ev.type==='dmg'){
        fxHit(defEl, ev.kind==='heavy' || ev.kind==='crush' || ev.crit);
        hitnum(dx, ev.dmg, ev.crit?'crit':'');
        sparks(dx+6, ev.crit || ev.kind==='heavy' || ev.kind==='crush', ev.wasBlocked?'#9be7ff':null);
        SFX.play(ev.wasBlocked?'block':(ev.crit?'crit':'hit')); buzz(ev.crit?[30,40,60]:(defIsEnemy?15:40));
        if(ev.wasBlocked) hitnum(dx, 'blocked', 'miss');
      } else if(ev.type==='miss'){ hitnum(dx, 'miss', 'miss'); SFX.play('miss'); }
      else if(ev.type==='block'){ hitnum(ax, 'guard', 'heal'); SFX.play('block'); }
      else if(ev.type==='fail'){ hitnum(ax, 'nope', 'miss'); }
      else if(ev.type==='lifesteal'){ hitnum(ax, '+'+ev.amt, 'heal'); SFX.play('heal'); }
      else if(ev.type==='ability'){ banner(ev.name.toUpperCase()+'!'); SFX.play('ab'); }
      updBars();
    }, k*260);
  });
  return events.length*260;
}

function playerAct(act){
  if(!G || G.lock || G.over) return;
  var m=G.me, e=G.enemy;
  var ok = act==='strike' || act==='block' ||
    (act==='heavy' && m.st >= m.hcost+m.hCostMod) ||
    (act==='ability' && m.ab.t<=0 && m.st>=m.ab.cost);
  if(!ok) return;
  G.lock = true; SFX.init(); setTurn(false);
  fxAtk($('fxM'), true);
  var evs = BL.takeAction(m, e, act);
  var wait = eventsToFx(evs, $('fxM'), $('fxE'), true);
  setTimeout(function(){
    if(e.hp<=0){ winFight(); return; }
    setTimeout(enemyAct, 320);
  }, wait + 200);
}

function enemyAct(){
  var m=G.me, e=G.enemy;
  fxAtk($('fxE'), false);
  var evs = BL.takeAction(e, m, e.intent);
  evs.forEach(function(ev){ if(ev.type==='dmg' && ev.to===m.name) G.tookDmg = true; });
  var wait = eventsToFx(evs, $('fxE'), $('fxM'), false);
  setTimeout(function(){
    if(m.hp<=0){ loseRun(); return; }
    BL.endTurn(e); BL.endTurn(m);
    e.intent = BL.aiChoose(e);
    updBars();
    G.lock = false; setTurn(true);
  }, wait + 200);
}

function winFight(){
  SFX.play('win'); buzz([20,30,20]); var stc=$('stage'); stc.classList.remove('cheer'); void stc.offsetWidth; stc.classList.add('cheer'); $('fxE').classList.add('ko');
  var m=G.me, e=G.enemy;
  $('fxE').classList.add('ko');
  var nohit = (G.tookDmg===false);
  G.score += 100;
  if(nohit){ G.score += 50; G.st.nohit++; }
  if(m.hp <= m.maxhp*0.25){ G.score += 75; G.st.comeback++; }
  G.st.rungs++;
  banner(G.rung>=10 && G.rung%10!==0 ? 'RUNG '+G.rung+' CLEAR' : (G.rung===10 ? 'LINE CONQUERED' : 'RUNG '+G.rung+' CLEAR'));
  if(m.healKill){ m.hp = Math.min(m.maxhp, m.hp+m.healKill); }
  setTimeout(function(){
    if(G.rung >= 10 && !G.endlessAsked && G.rung === 10){
      G.endlessAsked = true;
      banner('ENDLESS MODE');
    }
    showGear();
  }, 1500);
}

function showGear(){
  var m=G.me;
  var hp0 = m.hp;
  BL.betweenRungs(m);
  $('gcleared').textContent = G.rung;
  $('gheal').textContent = 'Healed '+(m.hp-hp0)+' HP, hits harder now. Choose one upgrade:';
  var gs = BL.drawGear(3);
  var box = $('gears'); box.innerHTML = '';
  gs.forEach(function(g){
    var b=document.createElement('button'); b.className='gearcard';
    b.innerHTML = '<div class="gs">'+esc(g.slot.toUpperCase())+'</div><div class="gn">'+esc(g.name)+'</div><div class="gd">'+esc(g.desc)+'</div>';
    b.addEventListener('click', function(){
      BL.applyGear(m, g);
      banner(esc(g.name).toUpperCase());
      G.rung++;
      G.enemy = BL.mkEnemy(G.rung, m.cls);
      G.enemy.intent = BL.aiChoose(G.enemy, true);
      G.tookDmg = false;
      show('v-duel');
      startDuel();
    });
    box.appendChild(b);
  });
  show('v-gear');
}


function loseRun(){
  SFX.play('ko'); buzz([80,60,160]); $('fxM').classList.add('ko');
  G.over = true;
  $('fxM').classList.add('ko');
  banner('K.O.');
  setTimeout(function(){ endRun(false); }, 1400);
}

function endRun(finished){
  var best = null;
  try{ best = JSON.parse(localStorage.getItem('battleline:best')||'null'); }catch(e){}
  var score = G.score;
  if(!best || score > best.score){
    best = {rung:G.st.rungs, score:score, name:G.me.name, cls:G.me.cls, d:new Date().toISOString().slice(0,10)};
    try{ localStorage.setItem('battleline:best', JSON.stringify(best)); }catch(e){}
  }
  $('endtitle').textContent = finished ? 'Line conquered.' : 'K.O.';
  $('endsub').textContent = finished
    ? 'You cleared all 10 rungs. The line remembers.'
    : G.me.name + ' fell on rung ' + G.rung + ' to ' + G.enemy.name + '.';
  $('st-rung').textContent = G.st.rungs;
  $('st-score').textContent = score;
  $('st-nohit').textContent = G.st.nohit;
  $('st-comeback').textContent = G.st.comeback;
  $('st-best').textContent = 'Best: ' + best.name + ' (' + best.cls + ') — rung ' + best.rung + ', ' + best.score + ' pts';
  $('rungpill').style.display = 'none';
  show('v-end');
}

  };
