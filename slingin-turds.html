for(const b of blocks){if(b.dead)continue;const n=circBox(s,b);if(n){const vn=s.vx*n.x+s.vy*n.y;if(vn<0){const sp=Math.hypot(s.vx,s.vy),mul=s.t=='brick'&&b.m=='stone'?3:1;const d=sp*s.m*.09*sk()*mul/MAT[b.m].dn;dmgB(b,d);if(!b.fx){b.vx+= -n.x*sp*s.m*.35/MAT[b.m].dn;b.vy+= -n.y*sp*s.m*.2/MAT[b.m].dn}if(sp>250){SFX.splat();splat(s.x-n.x*s.r,s.y-n.y*s.r)}const keep=b.dead?.7:.3;s.vx-=(1+.2)*vn*n.x;s.vy-=(1+.2)*vn*n.y;s.vx*=keep;s.vy*=keep;if(s.t=='boom'&&!s.gone&&(s===cur?!abUsed:1)){explode(s.x,s.y,170,160);s.gone=1;if(s===cur)abUsed=true;return}}s.x+=n.x*n.p;s.y+=n.y*n.p}}
for(const f of flies){if(f.dead)continue;const d=Math.hypot(s.x-f.x,s.y-f.y);if(d<s.r+f.r){const sp=Math.hypot(s.vx,s.vy);dmgF(f,sp*s.m*.12*sk());f.vx+=s.vx*.4;f.vy+=s.vy*.4-100;s.vx*=.6;s.vy*=.6;const k=(s.r+f.r-d)/(d||1);s.x+=(s.x-f.x)*k;s.y+=(s.y-f.y)*k}}
if(Math.hypot(s.vx,s.vy)<25&&s.y>GY-s.r-4)s.rest=(s.rest||0)+dt;else s.rest=0;if(s.rest>.6||s.x>WW+300||s.x<-300||s.life>9)s.stop=1}
function splat(px,py){for(let i=0;i<10;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*300,vy:-Math.random()*300,l:.6,c:'#6b3f16',r:3+Math.random()*4})}
const MAXP=1150,MAXD=130;
function upd(dt){tm+=dt;clouds.forEach(c=>{c.x+=c.s*12*dt;if(c.x>WW+200)c.x=-200});if(st!='play'||paused)return;
const sub=3;for(let k=0;k<sub;k++){phys(dt/sub);if(cur)stepShot(cur,dt/sub);shots.forEach(s=>stepShot(s,dt/sub))}
parts.forEach(p=>{p.l-=dt;if(!p.ring&&!p.stk){p.vy+=900*dt}p.x+=p.vx*dt;p.y+=p.vy*dt});parts=parts.filter(p=>p.l>0);if(parts.length>400)parts.splice(0,parts.length-400);
pops.forEach(p=>{p.l-=dt;p.y-=40*dt});pops=pops.filter(p=>p.l>0);blocks.forEach(b=>b.hit=Math.max(0,b.hit-dt));shake*=.88;
shots=shots.filter(s=>!s.stop&&!s.gone);
const alive=flies.filter(f=>!f.dead).length;
if(cur&&cur.fly&&(cur.stop||cur.gone)&&!shots.length){if(alive&&queue.length)next();else if(alive)cur=null}
const busy=(cur&&cur.fly&&!cur.stop&&!cur.gone)||shots.length;
if(!alive){endT+=dt;if(endT>1.2)finish(true)}else if(!cur&&!busy&&!queue.length){endT+=dt;if(endT>2)finish(false)}
hud()}
function finish(win){if(st!='play')return;st='end';const n=LV[lvI][1];let stars=0,coins=0;if(win){const left=queue.length+(cur&&!cur.fly?1:0);score+=left*1000;const par=LV[lvI][2].length;const L2=left-SV.up.ammo;stars=L2>=2?3:L2>=1?2:1;coins=20+stars*15+Math.floor(score/400);const prev=SV.stars[lvI]||0;if(stars>prev)coins+=(stars-prev)*25;SV.stars[lvI]=Math.max(prev,stars);SV.best[lvI]=Math.max(SV.best[lvI]||0,score);SV.coins+=coins;save();SFX.win()}else{coins=Math.floor(score/800);SV.coins+=coins;save();SFX.lose()}
setTimeout(()=>showEnd(win,stars,coins),300)}

function wpt(e){const t=e.touches?e.touches[0]||e.changedTouches[0]:e;return{x:(t.clientX-OX)/S,y:(t.clientY-OY)/S}}
function down(e){if(st!='play'||paused)return;const p=wpt(e);if(cur&&!cur.fly){if(Math.hypot(p.x-SX,p.y-SYY)<160||true){drag=p;e.preventDefault()}}else ability()}
function move(e){if(!drag||!cur)return;const p=wpt(e);let dx=p.x-SX,dy=p.y-SYY,d=Math.hypot(dx,dy);if(d>MAXD){dx*=MAXD/d;dy*=MAXD/d}cur.x=SX+dx;cur.y=SYY+dy;e.preventDefault()}
function up(e){if(!drag||!cur)return;drag=null;const dx=SX-cur.x,dy=SYY-cur.y,d=Math.hypot(dx,dy);if(d<20){cur.x=SX;cur.y=SYY;return}const p=MAXP*pw()*d/MAXD;cur.vx=dx/d*p;cur.vy=dy/d*p;cur.fly=1;SFX.fling();endT=0}

cv.addEventListener('touchstart',down,{passive:false});addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up);
addEventListener('keydown',e=>{if(e.key==' ')ability();if(e.key=='Escape'||e.key=='p')togglePause();if(e.key=='r'&&st=='play')load(lvI)});
function turd(cx,cy,r,col,t,ang,skin){x.save();x.translate(cx,cy);x.rotate(ang||0);let c=col;const sf=SKINS[skin==null?SV.skin:skin].f;if(sf&&sf!='rb')c=sf;if(sf=='rb'){c=x.createLinearGradient(-r,-r,r,r);['#f44','#fa3','#ee3','#4c4','#49f','#a5f'].forEach((k,i)=>c.addColorStop(i/5,k))}
x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=6;x.fillStyle=c;
x.beginPath();x.ellipse(0,r*.45,r,r*.5,0,0,7);x.fill();x.beginPath();x.ellipse(0,0,r*.78,r*.42,0,0,7);x.fill();x.beginPath();x.ellipse(0,-r*.4,r*.52,r*.34,0,0,7);x.fill();x.beginPath();x.moveTo(-r*.2,-r*.6);x.quadraticCurveTo(r*.1,-r*1.15,r*.3,-r*.95);x.quadraticCurveTo(r*.2,-r*.7,r*.25,-r*.55);x.fill();x.shadowBlur=0;
x.fillStyle='rgba(255,255,255,.25)';x.beginPath();x.ellipse(-r*.35,-r*.1,r*.25,r*.1,-.3,0,7);x.fill();
const e=r*.24;for(const s of[-1,1]){x.fillStyle='#fff';x.beginPath();x.arc(s*r*.28,-r*.02,e,0,7);x.fill();x.strokeStyle='#000';x.lineWidth=1.5;x.stroke();x.fillStyle='#000';x.beginPath();x.arc(s*r*.28+Math.sin(tm*3+s)*e*.35,-r*.02+e*.25,e*.45,0,7);x.fill()}
x.strokeStyle='#2a1404';x.lineWidth=2;x.beginPath();x.arc(0,r*.3,r*.25,.2,2.9);x.stroke();
if(t=='boom'){x.fillStyle='#3a8a2a';x.fillRect(-3,-r*1.2,6,10)}if(t=='dash'){x.fillStyle='#ccc';x.fillRect(-r*1.1,-4,r*.4,8)}
x.restore()}
function fly(f){const k=f.boss?1.55:1,r=f.r;x.save();x.translate(f.x,f.y+Math.sin(f.t*4)*2);const fl=Math.sin(f.t*60)*.5;x.fillStyle='rgba(220,240,255,.55)';x.strokeStyle='rgba(255,255,255,.8)';for(const s of[-1,1]){x.beginPath();x.ellipse(s*r*.55,-r*.75,r*.55,r*.28,s*(.6+fl),0,7);x.fill();x.stroke()}
const g=x.createRadialGradient(-r*.3,-r*.3,2,0,0,r);g.addColorStop(0,f.boss?'#7a3fa0':'#3f8f4a');g.addColorStop(1,f.boss?'#2a0f3a':'#0f2a12');x.fillStyle=f.t2>0?'#f88':g;x.beginPath();x.arc(0,0,r,0,7);x.fill();
x.fillStyle='#c22';for(const s of[-1,1]){x.beginPath();x.ellipse(s*r*.42,-r*.15,r*.36,r*.42,0,0,7);x.fill()}x.fillStyle='rgba(255,255,255,.6)';for(const s of[-1,1]){x.beginPath();x.arc(s*r*.32,-r*.3,r*.1,0,7);x.fill()}
x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.moveTo(-r*.25,r*.45);x.quadraticCurveTo(0,r*.6,r*.3,r*.38);x.stroke();
if(f.boss){x.fillStyle='#f5c518';x.beginPath();x.moveTo(-r*.6,-r*.85);x.lineTo(-r*.6,-r*1.35);x.lineTo(-r*.3,-r*1.05);x.lineTo(0,-r*1.45);x.lineTo(r*.3,-r*1.05);x.lineTo(r*.6,-r*1.35);x.lineTo(r*.6,-r*.85);x.fill()}else{x.fillStyle='#222';x.fillRect(-r*.5,-r*1.05,r,r*.18);x.fillRect(-r*.3,-r*1.35,r*.6,r*.32)}
if(f.hp<f.mx){x.fillStyle='#000a';x.fillRect(-r,r+6,r*2,5);x.fillStyle='#6f6';x.fillRect(-r,r+6,r*2*f.hp/f.mx,5)}x.restore();f.t2=(f.t2||0)-1/60}
function block(b){const m=MAT[b.m];x.save();x.translate(b.x,b.y);const g=x.createLinearGradient(0,0,b.w,b.h);g.addColorStop(0,m.c);g.addColorStop(1,m.c2);x.fillStyle=b.hit>0?'#fff':g;x.fillRect(0,0,b.w,b.h);x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=2;x.strokeRect(1,1,b.w-2,b.h-2);
if(b.m=='wood'){x.strokeStyle='rgba(90,50,10,.35)';x.lineWidth=1;for(let i=6;i<(b.w>b.h?b.h:b.w);i+=6){x.beginPath();if(b.w>b.h){x.moveTo(3,i);x.lineTo(b.w-3,i)}else{x.moveTo(i,3);x.lineTo(i,b.h-3)}x.stroke()}}
if(b.m=='glass'){x.strokeStyle='rgba(255,255,255,.8)';x.beginPath();x.moveTo(4,b.h*.3);x.lineTo(b.w*.4,4);x.stroke()}
if(b.m=='tp'){x.fillStyle='#ddd5c3';x.beginPath();x.arc(b.w/2,b.h/2,b.w*.18,0,7);x.fill()}
if(b.m=='stone'){x.fillStyle='rgba(0,0,0,.12)';x.fillRect(b.w*.2,b.h*.25,b.w*.2,b.h*.15);x.fillRect(b.w*.6,b.h*.6,b.w*.25,b.h*.18)}
const dm=1-b.hp/b.mx;if(dm>.3&&!b.fx){x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=1.5;x.beginPath();x.moveTo(b.w*.2,0);x.lineTo(b.w*.5,b.h*.5);x.lineTo(b.w*.3,b.h);if(dm>.6){x.moveTo(b.w,b.h*.2);x.lineTo(b.w*.5,b.h*.5)}x.stroke()}x.restore()}
function bg(){const w=WORLDS[LV[lvI][0]];const g=x.createLinearGradient(0,-400,0,GY);g.addColorStop(0,w.sky[0]);g.addColorStop(1,w.sky[1]);x.fillStyle=g;x.fillRect(-2000,-2000,WW+4000,GY+2000);
if(LV[lvI][0]<2){x.fillStyle='rgba(255,240,180,.9)';x.beginPath();x.arc(1350,140,55,0,7);x.fill()}
x.fillStyle='rgba(255,255,255,.75)';clouds.forEach(c=>{x.beginPath();x.arc(c.x,c.y,40*c.s,0,7);x.arc(c.x+40*c.s,c.y+10,30*c.s,0,7);x.arc(c.x-38*c.s,c.y+12,28*c.s,0,7);x.fill()});
x.fillStyle=w.hill;x.globalAlpha=.6;x.beginPath();x.moveTo(-2000,GY);for(let i=-2000;i<=WW+2000;i+=80)x.lineTo(i,GY-120-Math.sin(i*.004)*60-Math.sin(i*.011)*25);x.lineTo(WW+2000,GY);x.fill();x.globalAlpha=1;
x.fillStyle=w.gr;x.fillRect(-2000,GY,WW+4000,2000);x.fillStyle='rgba(0,0,0,.15)';for(let i=-2000;i<WW+2000;i+=40)x.fillRect(i,GY,20,6);
// slingshot (plunger-fork)
x.fillStyle='#6b3f16';x.fillRect(SX-10,SYY+20,20,GY-SYY-20);x.fillRect(SX-38,SYY-10,14,40);x.fillRect(SX+24,SYY-10,14,40);x.fillRect(SX-38,SYY+20,76,14)}
function draw(){x.setTransform(DPR,0,0,DPR,0,0);x.fillStyle='#000';x.fillRect(0,0,W,H);const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;x.setTransform(DPR*S,0,0,DPR*S,DPR*(OX+sx*S),DPR*(OY+sy*S));
bg();
if(cur&&!cur.fly){x.strokeStyle='#3a1f0a';x.lineWidth=7;x.beginPath();x.moveTo(SX-31,SYY-6);x.lineTo(cur.x,cur.y);x.stroke()}
if(drag&&cur){const dx=SX-cur.x,dy=SYY-cur.y,d=Math.hypot(dx,dy);if(d>20){const p=MAXP*pw()*d/MAXD;let vx=dx/d*p,vy=dy/d*p,px=cur.x,py=cur.y;x.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<34;i++){for(let k=0;k<3;k++){vy+=G/180;px+=vx/180;py+=vy/180}if(i%2==0){x.beginPath();x.arc(px,py,5-i*.1,0,7);x.fill()}}}}
blocks.forEach(b=>{if(!b.dead)block(b)});flies.forEach(f=>{if(!f.dead)fly(f)});
shots.forEach(s=>{if(!s.gone)turd(s.x,s.y,s.r,T[s.t].c,s.t,s.life*6)});if(cur&&!cur.gone)turd(cur.x,cur.y,cur.r,T[cur.t].c,cur.t,cur.fly?cur.life*6:0);
if(cur&&!cur.fly){x.strokeStyle='#3a1f0a';x.lineWidth=7;x.beginPath();x.moveTo(SX+31,SYY-6);x.lineTo(cur.x,cur.y);x.stroke()}

x.font='bold 30px system-ui';x.textAlign='center';pops.forEach(p=>{x.globalAlpha=p.l;x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=4;x.strokeText(p.t,p.x,p.y);x.fillText(p.t,p.x,p.y)});x.globalAlpha=1}
const $=id=>document.getElementById(id),ov=$('ov'),cd=$('cd');
function hideOv(){ov.classList.remove('on')}function show(h){cd.innerHTML=h;ov.classList.add('on')}
function hud(){$('sc').textContent=score.toLocaleString();$('co').textContent='\u{1F4B0} '+SV.coins;$('mu').innerHTML=mute?'&#128263;':'&#128264;';
const t=cur&&(!cur.fly)?cur.t:null;$('am').textContent=st=='play'?(t?T[t].n+' \u2022 '+TIP[t]:(cur&&cur.fly&&T[cur.t].ab&&!abUsed?'Tap to use ability!':'')+'  '+LV[lvI][1]):'';$('am').style.display=st=='play'?'':'none'}
const tot=()=>Object.values(SV.stars).reduce((a,b)=>a+b,0);
function unlocked(i){return i==0||SV.stars[i-1]>0}
function menu(){st='menu';show(`<h1>Slingin' Turds</h1><p>Fling googly-eyed turds at smug flies in their toilet-paper forts.</p><p><b>\u2B50 ${tot()} / ${LV.length*3}</b> &nbsp; <b>\u{1F4B0} ${SV.coins}</b></p><button class="btn" onclick="ST.levels()">Play</button><button class="btn g" onclick="ST.shop()">Upgrades & Skins</button><button class="btn g" onclick="ST.help()">How to play</button>`)}
function levels(){let h='<h2>Choose a level</h2>';WORLDS.forEach((w,wi)=>{h+=`<div style="text-align:left;font-weight:800;margin-top:8px">${w.n}</div><div class="grid">`;LV.forEach((l,i)=>{if(l[0]!=wi)return;const s=SV.stars[i]||0;h+=`<button class="lv" ${unlocked(i)?'':'disabled'} onclick="ST.load(${i})">${i+1}<small>${unlocked(i)?'\u2605'.repeat(s)+'\u2606'.repeat(3-s):'\u{1F512}'}</small></button>`});h+='</div>'});show(h+'<button class="btn g" onclick="ST.menu()">Back</button>')}
function shop(){let h=`<h2>Upgrades & Skins</h2><p><b>\u{1F4B0} ${SV.coins}</b></p>`;for(const k in UPS){const u=UPS[k],lv=SV.up[k],mx=u.p.length,pr=u.p[lv];h+=`<div class="it"><div><b>${u.n}</b> ${'\u25CF'.repeat(lv)}${'\u25CB'.repeat(mx-lv)}<p>${u.d}</p></div>${lv>=mx?'<span>MAX</span>':`<button class="btn" ${SV.coins<pr?'disabled':''} onclick="ST.buy('${k}')">\u{1F4B0}${pr}</button>`}</div>`}
h+='<div style="font-weight:800;margin-top:10px;text-align:left">Skins</div>';SKINS.forEach((s,i)=>{const own=SV.skins.includes(i);h+=`<div class="it"><div><b>${s.n}</b><p>${own?(SV.skin==i?'Equipped':'Owned'):''}</p></div>${own?(SV.skin==i?'':`<button class="btn g" onclick="ST.skin(${i})">Equip</button>`):`<button class="btn" ${SV.coins<s.p?'disabled':''} onclick="ST.bskin(${i})">\u{1F4B0}${s.p}</button>`}</div>`});show(h+'<button class="btn g" onclick="ST.menu()">Back</button>')}
function help(){show(`<h2>How to play</h2><p style="text-align:left">Drag back from the slingshot and let go to fling. The dotted line shows your arc. Tap mid-flight to fire a turd's ability. Take out every fly to clear the level. Turds you don't use are worth 1,000 points each and earn more stars. Spend the coins you win on upgrades and skins.</p><p style="text-align:left"><b>Plop:</b> the standard turd<br><b>Triplet:</b> splits into 3<br><b>Rocket Log:</b> dashes forward<br><b>Chili Bomb:</b> explodes<br><b>Brick:</b> heavy, and smashes stone</p><p style="text-align:left">Glass breaks easily. Toilet paper falls apart. Stone is tough. Keyboard: Space for abilities, R to restart, P to pause.</p><button class="btn" onclick="ST.menu()">Got it</button>`)}
function showEnd(win,stars,coins){show(`<h2>${win?'Level cleared!':'Out of turds!'}</h2>${win?`<div class="stars">${'\u2605'.repeat(stars)}<span class="dim">${'\u2605'.repeat(3-stars)}</span></div>`:''}<p>Score <b>${score.toLocaleString()}</b> &nbsp; Best <b>${(SV.best[lvI]||0).toLocaleString()}</b></p><p>+\u{1F4B0}${coins}</p><button class="btn g" onclick="ST.load(${lvI})">Retry</button>${win&&lvI<LV.length-1?`<button class="btn" onclick="ST.load(${lvI+1})">Next</button>`:''}<button class="btn g" onclick="ST.levels()">Levels</button><button class="btn g" onclick="ST.shop()">Shop</button>`);if(coins)SFX.coin()}

$('pz').onclick=togglePause;$('mu').onclick=()=>{mute=!mute;localStorage.setItem(K+'m',mute?'1':'0');hud()};
window.ST={load,menu,levels,shop,help,resume:()=>{paused=false;hideOv()},buy:k=>{const pr=UPS[k].p[SV.up[k]];if(SV.coins>=pr){SV.coins-=pr;SV.up[k]++;save();SFX.coin();shop()}},bskin:i=>{if(SV.coins>=SKINS[i].p){SV.coins-=SKINS[i].p;SV.skins.push(i);SV.skin=i;save();SFX.coin();shop()}},skin:i=>{SV.skin=i;save();shop()},_t:{phys,LV,get flies(){return flies},get blocks(){return blocks},upd,get st(){return st},get cur(){return cur},set cur(v){cur=v}}};
