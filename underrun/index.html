<script>
/* Touch twin-sticks: drive the game's own input model (keys[] + mouse_x/mouse_y). */
(function(){
  if(!window.matchMedia('(pointer:coarse)').matches) return;
  var K_LEFT=37,K_UP=38,K_RIGHT=39,K_DOWN=40,K_SHOOT=512;
  function bind(id,isMove){
    var el=document.getElementById(id),nub=el.firstElementChild,ptr=null,sx=0,sy=0;
    function setKey(k,v){ if(typeof keys!=='undefined') keys[k]=v; }
    el.addEventListener('pointerdown',function(e){ptr=e.pointerId;sx=e.clientX;sy=e.clientY;el.setPointerCapture(ptr);e.preventDefault();});
    el.addEventListener('pointermove',function(e){
      if(e.pointerId!==ptr)return;
      var dx=e.clientX-sx,dy=e.clientY-sy,m=Math.max(14,Math.abs(dx),Math.abs(dy));
      nub.style.transform='translate('+Math.max(-39,Math.min(39,dx))+'px,'+Math.max(-39,Math.min(39,dy))+'px)';
      if(isMove){setKey(K_LEFT,dx<-14?1:0);setKey(K_RIGHT,dx>14?1:0);setKey(K_UP,dy<-14?1:0);setKey(K_DOWN,dy>14?1:0);}
      else{
        if(typeof c!=='undefined'){
          var r=c.getBoundingClientRect();
          mouse_x=Math.max(0,Math.min(c.width,(r.left+r.width/2+(dx/m)*c.width*0.6)/r.width*c.width));
          mouse_y=Math.max(0,Math.min(c.height,(r.top+r.height/2+(dy/m)*c.height*0.6)/r.height*c.height));
          setKey(K_SHOOT,(Math.abs(dx)>14||Math.abs(dy)>14)?1:0);
        }
      }
    });
    function up(e){if(e.pointerId!==ptr)return;ptr=null;nub.style.transform='';
      if(isMove){setKey(K_LEFT,0);setKey(K_RIGHT,0);setKey(K_UP,0);setKey(K_DOWN,0);}
      else setKey(K_SHOOT,0);}
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  }
  bind('stL',true);bind('stR',false);
})();
</script>
