<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0f14;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
/* top bar — kept narrow for 390px (house lesson: min-content <=360px) */
#topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0d141b;border-bottom:1px solid #1f2a36;flex:0 0 auto}
#topbar a.back{color:#9b9dba;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
#topbar .wordmark{font-weight:800;letter-spacing:.16em;font-size:15px;color:#f2c14e;white-space:nowrap}
#scorepill{margin-left:auto;background:#141d27;border:1px solid #2b3a4b;color:#ffd970;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;white-space:nowrap}
/* playfield */
#play{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:8px 10px;z-index:5;pointer-events:none}
.pill{background:rgba(8,12,17,.72);border:1px solid #2b3a4b;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
#windpill{color:#9fd8ff}
#streakpill{color:#ffb14e}
#ammopills{display:flex;gap:3px}
#ammopills i{width:9px;height:22px;border-radius:3px;background:#ffd970;display:block}
#ammopills i.spent{background:#2b3a4b}
#reloadbar{position:absolute;left:10px;right:10px;bottom:44px;height:6px;border-radius:99px;background:rgba(8,12,17,.7);overflow:hidden;display:none;z-index:5}
#reloadbar.on{display:block}
#reloadbar i{display:block;height:100%;width:0;background:#ffd970;border-radius:99px}
#breathwrap{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;pointer-events:none}
#breathwrap .blabel{font-size:10px;letter-spacing:.14em;color:#8fa3b8;font-weight:800;margin-bottom:3px}
#bbar{height:10px;border-radius:99px;background:rgba(8,12,17,.72);border:1px solid #2b3a4b;overflow:hidden}
#bbar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#37d67a,#b8f36b);transition:none}
#bbar i.low{background:linear-gradient(90deg,#e5484d,#ff9a3d)}
#banner{position:absolute;top:34%;left:0;right:0;text-align:center;z-index:6;pointer-events:none;display:none}
#banner.on{display:block}
#banner b{display:block;font-size:clamp(26px,7vw,44px);font-weight:800;text-shadow:0 2px 14px #000}
#banner span{font-size:15px;color:#cfe0f0;text-shadow:0 1px 8px #000}
/* control deck — thumb arc: two big buttons, >=56px, no hover dependence */
#deck{flex:0 0 auto;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0d141b;border-top:1px solid #1f2a36}
#deck button{flex:1;border-radius:18px;border:2px solid #2b3a4b;background:#182230;color:#eef;font-weight:800;cursor:pointer;touch-action:none}
#deck button:active{transform:scale(.96)}
#steady{min-height:76px;font-size:17px;letter-spacing:.08em}
#steady.held{background:#12352a;border-color:#37d67a;color:#b8f36b}
#fire{flex:1.5;min-height:88px;font-size:22px;letter-spacing:.1em;background:#3a1416;border-color:#e5484d;color:#ffd9d9}
#fire:active{background:#5a1d20}
/* overlays: menu + summary */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,9,13,.92);padding:24px;text-align:center}
.screen h1{font-size:clamp(38px,11vw,64px);font-weight:800;letter-spacing:.1em;color:#f2c14e}
.screen h1 em{font-style:normal;color:#9fd8ff}
.screen p{font-size:16px;color:#b9c8d8;max-width:320px;line-height:1.5}
.screen .rules{font-size:13.5px;color:#8fa3b8;max-width:330px;line-height:1.7}
.bigbtn{background:#f2c14e;color:#191104;border:none;border-radius:18px;min-height:64px;min-width:220px;font-size:20px;font-weight:800;letter-spacing:.06em;cursor:pointer}
.bigbtn:active{transform:scale(.96)}
#trophies{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:340px;width:100%}
.tcard{background:#141d27;border:1px solid #2b3a4b;border-radius:14px;padding:10px}
.tcard b{display:block;font-size:13px;color:#9fd8ff;letter-spacing:.06em}
.tcard span{font-size:20px;font-weight:800;color:#ffd970}
#sumscore{font-size:52px;font-weight:800;color:#ffd970}
#sumbest{font-size:14px;color:#8fa3b8}
.hidden{display:none!important}
</style>

<body>
<header id="topbar">
  <a class="back" href="/games.html">&larr; Games</a>
  <span class="wordmark">HUNTLINE</span>
  <span id="scorepill">0</span>
</header>

<div id="play">
  <canvas id="cv"></canvas>
  <div id="hud">
    <span class="pill" id="roundpill">R1</span>
    <span class="pill" id="timepill">60</span>
    <span class="pill" id="windpill">&rarr; 0</span>
    <span class="pill hidden" id="streakpill">x1.0</span>
    <span id="ammopills" style="margin-left:auto"></span>
  </div>
  <div id="reloadbar"><i></i></div>
  <div id="breathwrap"><div class="blabel">BREATH</div><div id="bbar"><i></i></div></div>
  <div id="banner"><b></b><span></span></div>

  <div class="screen" id="menu">
    <h1>HUNT<em>LINE</em></h1>
    <p>Steady your breath. Read the wind.<br>Clean harvests only.</p>
    <div class="rules">Drag anywhere to aim &middot; hold STEADY to calm the sway &middot; FIRE.<br>Heart shot = double. Misses spook the range.</div>
    <button class="bigbtn" id="startbtn">START SEASON</button>

  </div>

  <div class="screen hidden" id="summary">
    <h1 style="font-size:34px">SEASON <em>DONE</em></h1>
    <div id="sumscore">0</div>
    <div id="sumbest"></div>
    <div id="trophies2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:340px;width:100%"></div>
    <button class="bigbtn" id="againbtn">HUNT AGAIN</button>
  </div>
</div>

<div id="deck">
  <button id="steady">STEADY</button>
  <button id="fire">FIRE</button>
</div>

<script src="/js/nav.js" defer></script>
<script>
(function(){
"use strict";
/* ============================== utils ============================== */
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
/* seeded rng (harness) — browser uses Math.random */
var _s=987654321;
function srand(s){_s=s>>>0||1}
function srandom(){_s=(_s*1664525+1013904223)>>>0;return _s/4294967296}
function pickR(rng){return rng()<0.5?-1:1}

/* ============================== config ============================== */
var SPECIES={
  deer:  {base:100,spd:[42,72],  band:[0.42,0.62],size:1.0, label:'Deer'},
  boar:  {base:120,spd:[70,110], band:[0.60,0.76],size:0.8, label:'Boar'},
  rabbit:{base:150,spd:[125,180],band:[0.76,0.90],size:0.55,label:'Rabbit'},
  duck:  {base:180,spd:[150,220],band:[0.10,0.30],size:0.7, label:'Duck',fly:true},
  stag:  {base:500,spd:[110,160],band:[0.38,0.58],size:1.15,label:'Golden Stag',rare:true}
};
var SPAWN_W={deer:0.28,boar:0.24,rabbit:0.20,duck:0.24}; /* stag handled by rarity roll */
var STAG_P=0.04; /* golden stag rarity per spawn */
var RANGES=[
  {name:'DAWN',sky:['#241a4d','#b4503f','#e8956b'],sun:'#ffd9a0',ground:'#3a2b3a',far:'#5b3f63'},
  {name:'DAY', sky:['#2f6db3','#7fb6e8','#cfe8ff'],sun:'#fff6d8',ground:'#3f5a34',far:'#6d8a5f'},
  {name:'DUSK', sky:['#1c1440','#7a3f6e','#e0704f'],sun:'#ff9a5c',ground:'#33302e',far:'#54455a'}
];
/* season: 6 rounds across 3 ranges, escalating */
var ROUNDS=[
  {range:0,spd:1.00,wind:6, spawn:1.6,dist:1.00,time:60},
  {range:0,spd:1.12,wind:8, spawn:1.5,dist:1.06,time:60},
  {range:1,spd:1.25,wind:10,spawn:1.3,dist:1.14,time:60},
  {range:1,spd:1.38,wind:12,spawn:1.2,dist:1.20,time:60},
  {range:2,spd:1.52,wind:15,spawn:1.0,dist:1.30,time:60},
  {range:2,spd:1.66,wind:18,spawn:0.9,dist:1.36,time:60}
];
var MAG=5, RELOAD_T=2.0, FIRE_CD=0.55;
var PAR_SEASON=18000;
/* hit zones (px at size 1, dist 1) — heart ellipse + body ellipse */
var ZONES={
  deer:  {body:[34,20],heart:[9,7,14,-2]},
  boar:  {body:[26,16],heart:[7,6,10,-1]},
  rabbit:{body:[16,10],heart:[4.5,4,6,0]},
  duck:  {body:[18,10],heart:[5,4.5,7,-1]},
  stag:  {body:[36,21],heart:[9,7,15,-2]}
};

/* ============================== state ============================== */
var W=390,H=640; /* CSS-px world == css px: drag deltas map 1:1 to reticle */
var G=null;

function newSeason(){
  return {round:0,score:0,streak:0,animals:[],shots:[],popups:[],parts:[],fx:[],
    aim:{x:W/2,y:H*0.55},swayT:0,wind:{x:0,y:0,spd:0,ang:0},
    breath:{m:100,holding:false,locked:false},ammo:MAG,reloading:0,fireCd:0,
    timeLeft:ROUNDS[0].time,spawnT:1.0,zoom:1,recoil:0,over:false,hits:0,fired:0};
}
function startRound(g,i){
  var r=ROUNDS[i];g.round=i;g.timeLeft=r.time;g.animals=[];g.shots=[];g.popups=[];
  g.ammo=MAG;g.reloading=0;g.streak=0;g.spawnT=0.6;
  var a=r.wind*(0.6+Math.random()*0.4);
  g.wind={spd:a,ang:Math.random()*Math.PI*2,x:0,y:0};
  g.wind.x=Math.cos(g.wind.ang)*a;g.wind.y=Math.sin(g.wind.ang)*a*0.4;
}

/* ============================== spawning ============================== */
function rollSpecies(rng){
  if(rng()<STAG_P)return 'stag';
  var r=rng(),acc=0;
  for(var k in SPAWN_W){acc+=SPAWN_W[k];if(r<acc)return k}
  return 'deer';
}
function spawnAnimal(g,rng){
  rng=rng||Math.random;
  var sp=rollSpecies(rng),c=SPECIES[sp],r=ROUNDS[g.round];
  var dir=pickR(rng);
  var band=c.band;
  var y=H*(band[0]+rng()*(band[1]-band[0]));
  var dist=r.dist*(1+rng()*0.4); /* 1.0 near .. ~1.9 far */
  var spd=(c.spd[0]+rng()*(c.spd[1]-c.spd[0]))*r.spd;
  return {sp:sp,dir:dir,x:dir>0?-60:W+60,y:y,baseY:y,
    vx:spd,dist:dist,state:'calm',tState:0,alertN:0,
    ph:rng()*6.28,sz:c.size};
}
function updateAnimals(g,dt){
  var r=ROUNDS[g.round];
  for(var i=g.animals.length-1;i>=0;i--){
    var a=g.animals[i],c=SPECIES[a.sp];
    a.ph+=dt*6;a.tState+=dt;
    if(a.state==='calm'){
      a.x+=a.dir*a.vx*dt;
      /* graze pauses */
      a.graze=(a.graze||0)-dt;
      /* time pressure: calm animals may go alert on their own */
      if(Math.random()<dt*0.06){a.state='alert';a.tState=0}
    }else if(a.state==='alert'){
      a.x+=a.dir*a.vx*dt*0.15;
      if(a.tState>1.4){a.state='calm';a.tState=0}
    }else{ /* flee */
      a.x+=a.dir*a.vx*dt*2.3;
    }
    if(c.fly)a.y=a.baseY+Math.sin(a.ph*1.7)*14;
    else if(a.sp==='rabbit')a.y=a.baseY-Math.abs(Math.sin(a.ph*3))*10;
    if((a.dir>0&&a.x>W+80)||(a.dir<0&&a.x<-80))g.animals.splice(i,1);
  }
  /* spawner */
  g.spawnT-=dt;
  if(g.spawnT<=0&&g.animals.length<4){g.animals.push(spawnAnimal(g));g.spawnT=r.spawn*(0.7+Math.random()*0.6)}
}

/* ============================== aim / sway / breath ============================== */
/* drag deltas are CSS px; world==CSS px so 1:1 */
function aimDelta(g,dx,dy){
  g.aim.x=clamp(g.aim.x+dx,20,W-20);
  g.aim.y=clamp(g.aim.y+dy,60,H-20);
}
function swayAmp(g){
  var b=g.breath.m;
  if(g.breath.holding)return 4;
  if(b<30)return 20;
  return 14;
}
function effPoint(g){
  /* where the shot actually lands: aim + breathing sway + wind drift + recoil kick */
  var t=g.swayT,amp=swayAmp(g);
  var sx=(Math.sin(t*1.7)+0.5*Math.sin(t*2.9+1.3))*amp;
  var sy=(Math.cos(t*1.3+0.7)+0.5*Math.sin(t*2.3))*amp*0.8;
  var df=1.15; /* wind pushes harder at range feel */
  var wx=(g.wind.x*0.55+g.recoil*22)*df, wy=g.wind.y*0.55*df;
  return {x:g.aim.x+sx+wx,y:g.aim.y+sy+wy};
}
function breathTick(g,dt){
  var b=g.breath;
  if(b.holding&&!b.locked){
    b.m-=33*dt;
    if(b.m<=0){b.m=0;b.locked=true;b.holding=false}
  }else{
    b.m=Math.min(100,b.m+25*dt);
    if(b.locked&&b.m>=100)b.locked=false;
  }
  /* scope zoom feel while steadying — transform only */
  g.zoom=lerp(g.zoom,b.holding?1.07:1,Math.min(1,dt*6));
  g.recoil=Math.max(0,g.recoil-dt*3);
}

/* ============================== shooting ============================== */
function hitTest(a,px,py){
  var z=ZONES[a.sp],k=a.sz/a.dist; /* farther = smaller target */
  var lx=(px-a.x)/k,ly=(py-a.y)/k;
  var hx=z.heart[2]*a.dir,hy=z.heart[3];
  var hd=((lx-hx)*(lx-hx))/(z.heart[0]*z.heart[0])+((ly-hy)*(ly-hy))/(z.heart[1]*z.heart[1]);
  if(hd<=1)return 'heart';
  var bd=(lx*lx)/(z.body[0]*z.body[0])+(ly*ly)/(z.body[1]*z.body[1]);
  if(bd<=1)return 'body';
  return null;
}
function scoreShot(sp,zone,dist,streak){
  if(zone==='heart')return Math.round(SPECIES[sp].base*2.0*dist*(1+Math.min(streak,10)*0.1));
  return Math.round(SPECIES[sp].base*1.0*dist*(1+Math.min(streak,10)*0.1));
}
function fire(g){
  if(g.reloading>0||g.fireCd>0)return 'busy';
  if(g.ammo<=0){startReload(g);return 'reloading'}
  g.ammo--;g.fireCd=FIRE_CD;g.recoil=1;g.fired++;
  var p=effPoint(g);
  var travel=0.06+0.08*clamp(g.shotDist||1.2,1,2); /* bullet flight: lead matters on ducks */
  g.shots.push({x:p.x,y:p.y,t:travel});
  if(g.ammo<=0)startReload(g);
  return 'fired';
}
function startReload(g){
  if(g.reloading>0||g.ammo===MAG)return;
  g.reloading=RELOAD_T;
}
function resolveShot(g,s){
  var best=null,bestZone=null;
  for(var i=0;i<g.animals.length;i++){
    var z=hitTest(g.animals[i],s.x,s.y);
    if(z&&(z==='heart'||!bestZone)){best=g.animals[i];bestZone=z}
  }
  if(best){
    var pts=scoreShot(best.sp,bestZone,best.dist,g.streak);
    g.score+=pts;g.streak++;g.hits++;
    trophyHit(best.sp,pts);
    g.popups.push({x:s.x,y:s.y-24,txt:(bestZone==='heart'?'CLEAN +':'+')+pts,age:0,
      big:bestZone==='heart'||best.sp==='stag'});
    burst(g,s.x,s.y,best.sp==='stag'?'#ffd970':'#fff');
    if(g.fx.length<32){g.fx.push({t:'ring',x:s.x,y:s.y,age:0,life:0.45,stag:best.sp==='stag'});best.hitFlash=1}
    /* harvested animal leaves calmly */
    best.state='flee';best.dir=best.x<W/2?1:-1;
    return {hit:true,zone:bestZone,pts:pts};
  }
  /* miss: spook nearby animals */
  g.streak=0;
  for(var j=0;j<g.animals.length;j++){
    var a=g.animals[j],d=Math.hypot(a.x-s.x,a.y-s.y);
    if(d<110){
      if(a.state==='alert'||a.alertN>0){a.state='flee'}
      else{a.state='alert';a.tState=0;a.alertN++}
    }
  }
  g.popups.push({x:s.x,y:s.y-20,txt:'MISS',age:0,miss:true});
  if(g.fx.length<32)g.fx.push({t:'dust',x:s.x,y:s.y,age:0,life:0.7});
  return {hit:false};
}
function burst(g,x,y,col){
  for(var i=0;i<10;i++){
    var a=Math.random()*6.28,sp=40+Math.random()*90;
    g.parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,life:0.5,col:col});
  }
}

/* ============================== trophies ============================== */
var TKEY='huntline:v1';
function loadT(){
  try{var t=JSON.parse(localStorage.getItem(TKEY)||'null');
    if(t&&t.tr)return t}catch(e){}
  return {tr:{deer:0,boar:0,rabbit:0,duck:0,stag:0},best:0,plays:0};
}
function saveT(t){try{localStorage.setItem(TKEY,JSON.stringify(t))}catch(e){}}
function trophyHit(sp,pts){
  var t=loadT();
  if(pts>(t.tr[sp]||0)){t.tr[sp]=pts;saveT(t)}
}

/* ============================== season sim (balance) ============================== */
/* scripted decent-shot policy: 65% hit, 40% of hits heart, avg dist per round */
function policySeason(s){
  srand(s);
  var total=0;
  for(var r=0;r<ROUNDS.length;r++){
    var rc=ROUNDS[r],streak=0,shots=20;
    for(var i=0;i<shots;i++){
      var u=srandom();
      if(u<0.65){
        var spk=['deer','deer','boar','boar','rabbit','duck','duck'][Math.floor(srandom()*7)];
        var dist=rc.dist*(1+srandom()*0.4);
        var zone=srandom()<0.4?'heart':'body';
        total+=scoreShot(spk,zone,dist,streak);streak++;
      }else streak=0;
    }
  }
  return total;
}

/* ============================== public API (harness + boot) ============================== */
var HUNT={
  SPECIES:SPECIES,ROUNDS:ROUNDS,RANGES:RANGES,ZONES:ZONES,
  PAR_SEASON:PAR_SEASON,MAG:MAG,RELOAD_T:RELOAD_T,STAG_P:STAG_P,
  newSeason:newSeason,startRound:startRound,spawnAnimal:spawnAnimal,rollSpecies:rollSpecies,
  updateAnimals:updateAnimals,aimDelta:aimDelta,effPoint:effPoint,swayAmp:swayAmp,
  breathTick:breathTick,fire:fire,startReload:startReload,resolveShot:resolveShot,
  hitTest:hitTest,scoreShot:scoreShot,policySeason:policySeason,
  loadT:loadT,saveT:saveT,trophyHit:trophyHit,
  tick:tick,endRound:endRound,endSeason:endSeason,
  setView:function(w,h){W=w;H=h},
  srand:srand
};
if(typeof window!=='undefined')window.HUNT=HUNT;
if(typeof module!=='undefined'&&module.exports)module.exports=HUNT;

/* ============================== browser boot ============================== */
if(typeof document==='undefined')return;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var dpr=Math.min(2,window.devicePixelRatio||1);
function fit(){
  var r=document.getElementById('play').getBoundingClientRect();
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  HUNT.setView(Math.round(r.width),Math.round(r.height));
}
window.addEventListener('resize',fit);

var G=HUNT.newSeason(),playing=false,lastT=0;
var steadyBtn=document.getElementById('steady'),fireBtn=document.getElementById('fire');
var scorepill=document.getElementById('scorepill'),roundpill=document.getElementById('roundpill'),
    timepill=document.getElementById('timepill'),windpill=document.getElementById('windpill'),
    streakpill=document.getElementById('streakpill'),ammopills=document.getElementById('ammopills'),
    bbar=document.querySelector('#bbar i'),reloadbar=document.getElementById('reloadbar'),
    reloadfill=reloadbar.querySelector('i'),banner=document.getElementById('banner'),
    bB=banner.querySelector('b'),bS=banner.querySelector('span');
var bnT=0;

  var an=G.animals.slice().sort(function(a,b){return a.dist-b.dist});
  for(i=0;i<an.length;i++)drawAnimal(G,an[i]);
  for(i=0;i<G.shots.length;i++){var t0=G.shots[i]; /* tracer to in-flight shot */
    ctx.strokeStyle='rgba(255,220,150,0.35)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(W/2,H-26);ctx.lineTo(t0.x,t0.y);ctx.stroke()}
  for(var j=G.parts.length-1;j>=0;j--){ /* star-bursts: 4-ray stars, alpha fade */
    var q=G.parts[j],al=1-q.age/q.life,rr=2+3*al;
    ctx.globalAlpha=al;ctx.strokeStyle=q.col;ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(q.x-rr,q.y);ctx.lineTo(q.x+rr,q.y);
    ctx.moveTo(q.x,q.y-rr);ctx.lineTo(q.x,q.y+rr);
    ctx.moveTo(q.x-rr*0.7,q.y-rr*0.7);ctx.lineTo(q.x+rr*0.7,q.y+rr*0.7);
    ctx.moveTo(q.x-rr*0.7,q.y+rr*0.7);ctx.lineTo(q.x+rr*0.7,q.y-rr*0.7);
    ctx.stroke()}
  ctx.globalAlpha=1;
  for(var fx2=G.fx.length-1;fx2>=0;fx2--){var fx=G.fx[fx2],fa=1-fx.age/fx.life;
    if(fx.t==='ring'){
      ctx.globalAlpha=fa*0.9;ctx.strokeStyle=fx.stag?'#ffd970':'#ffffff';ctx.lineWidth=3;
      var rrg=6+fx.age*160;
      ctx.beginPath();ctx.arc(fx.x,fx.y,rrg,0,6.29);ctx.stroke();
      ctx.globalAlpha=fa*0.4;ctx.beginPath();ctx.arc(fx.x,fx.y,rrg*0.6,0,6.29);ctx.stroke();
    }else if(fx.t==='dust'){
      ctx.globalAlpha=fa*0.5;ctx.fillStyle='#b9a98f';
      ctx.beginPath();ctx.arc(fx.x,fx.y-6,4+fx.age*46,0,6.29);ctx.fill();
    }else if(fx.t==='muz'){
      ctx.globalAlpha=fa;var ms=90*fa+30;
      ctx.drawImage(L.glow,W/2-ms/2,H-26-ms/2,ms,ms)}}
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.textAlign='center'; /* popups: outlined type treatment */
  for(var m=G.popups.length-1;m>=0;m--){
    var u=G.popups[m],sc=1+Math.min(0.6,u.age*3);
    ctx.save();ctx.translate(u.x,u.y-u.age*34);ctx.scale(sc,sc);ctx.globalAlpha=1-u.age/1.1;
    ctx.font='800 '+(u.big?22:16)+'px system-ui';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,0.65)';
    ctx.strokeText(u.txt,0,0);
    ctx.fillStyle=u.miss?'#ff7a7a':(u.big?'#ffd970':'#ffffff');
    ctx.fillText(u.txt,0,0);ctx.restore()}
  drawReticle(p);
}
function drawReticle(p){
  var holding=G.breath.holding,m=G.breath.m;
  if(holding){ctx.globalAlpha=0.16; /* subtle glass tint, pre-rendered sprite */
    ctx.drawImage(L.glow,p.x-90,p.y-90,180,180);ctx.globalAlpha=1}
  var bc=m>50?'#b8f36b':(m>30?'#ffb14e':'#ff5c5c'); /* breath meter as reticle ring */
  ctx.strokeStyle=bc;ctx.lineWidth=3;ctx.globalAlpha=0.85;
  ctx.beginPath();ctx.arc(p.x,p.y,30,-1.5708,-1.5708+6.2832*(m/100));ctx.stroke();
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=1.5; /* fine crosshair */
  ctx.beginPath();
  ctx.moveTo(p.x-30,p.y);ctx.lineTo(p.x-7,p.y);ctx.moveTo(p.x+7,p.y);ctx.lineTo(p.x+30,p.y);
  ctx.moveTo(p.x,p.y-30);ctx.lineTo(p.x,p.y-7);ctx.moveTo(p.x,p.y+7);ctx.lineTo(p.x,p.y+30);
  ctx.stroke();
  ctx.beginPath();ctx.arc(p.x,p.y,21,0,6.29);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.6)'; /* mildots */
  ctx.fillRect(p.x-1.5,p.y-44,3,3);ctx.fillRect(p.x-1.5,p.y+41,3,3);
  ctx.fillRect(p.x-44,p.y-1.5,3,3);ctx.fillRect(p.x+41,p.y-1.5,3,3);
  ctx.fillStyle='#ff5c5c';ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,6.29);ctx.fill();
  if(holding){ctx.strokeStyle='rgba(184,243,107,0.75)';ctx.lineWidth=2; /* settled ring */
    ctx.beginPath();ctx.arc(p.x,p.y,37+2*Math.sin(G.swayT*3),0,6.29);ctx.stroke()}
}

/* ---------- HUD ---------- */
function updHUD(){
  scorepill.textContent=G.score;
  roundpill.textContent='R'+(G.round+1)+'/6 '+RANGES[ROUNDS[G.round].range].name;
  timepill.textContent=Math.ceil(G.timeLeft)+'s';
  var wa={0:'\u2192',1:'\u2198',2:'\u2193',3:'\u2199',4:'\u2190',5:'\u2196',6:'\u2191',7:'\u2197'}[Math.round(((G.wind.ang%6.283)+6.283)%6.283/0.785)%8];
  windpill.textContent=wa+' '+Math.round(G.wind.spd);
  if(G.streak>=2){streakpill.classList.remove('hidden');streakpill.textContent='STREAK x'+(1+Math.min(G.streak,10)*0.1).toFixed(1)}
  else streakpill.classList.add('hidden');
  var ah='';
  for(var i=0;i<MAG;i++)ah+='<i class="'+(i<G.ammo?'':'spent')+'"></i>';
  ammopills.innerHTML=ah;
  var b=bbar;b.style.width=G.breath.m+'%';
  b.classList.toggle('low',G.breath.m<30||G.breath.locked);
  if(G.reloading>0){reloadbar.classList.add('on');reloadfill.style.width=((1-G.reloading/RELOAD_T)*100)+'%'}
  else reloadbar.classList.remove('on');
}

/* ---------- loop ---------- */
function tick(g,dt){
  g.swayT+=dt;
  HUNT.breathTick(g,dt);
  if(g.fireCd>0)g.fireCd-=dt;
  if(g.reloading>0){g.reloading-=dt;if(g.reloading<=0){g.ammo=MAG;g.reloading=0}}
  /* resolve in-flight shots (bullet travel → lead matters) */
  for(var i=g.shots.length-1;i>=0;i--){
    g.shots[i].t-=dt;
    if(g.shots[i].t<=0){HUNT.resolveShot(g,g.shots[i]);g.shots.splice(i,1)}
  }
  HUNT.updateAnimals(g,dt);
  for(var j=g.popups.length-1;j>=0;j--){g.popups[j].age+=dt;if(g.popups[j].age>1.1)g.popups.splice(j,1)}
  for(var k=g.parts.length-1;k>=0;k--){var q=g.parts[k];q.age+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.age>q.life)g.parts.splice(k,1)}
  for(var f2=g.fx.length-1;f2>=0;f2--){g.fx[f2].age+=dt;if(g.fx[f2].age>g.fx[f2].life)g.fx.splice(f2,1)}
  for(var ia=0;ia<g.animals.length;ia++){var aa=g.animals[ia];if(aa.hitFlash)aa.hitFlash=Math.max(0,aa.hitFlash-dt*2.5)}
  g.timeLeft-=dt;
  if(g.timeLeft<=0&&!g.over)endRound(g);
  if(bnT>0){bnT-=dt;if(bnT<=0)banner.classList.remove('on')}
}
function endRound(g){
  if(g.round>=ROUNDS.length-1){endSeason(g);return}
  g.round++;HUNT.startRound(g,g.round);
  showBanner('ROUND '+(g.round+1),RANGES[ROUNDS[g.round].range].name+' — wind picks up',2.2);
  updHUD();
}
function endSeason(g){
  g.over=true;playing=false;
  var t=HUNT.loadT();t.plays++;t.best=Math.max(t.best,g.score);HUNT.saveT(t);
  document.getElementById('sumscore').textContent=g.score;
  document.getElementById('sumbest').textContent='Personal best: '+t.best+' · Seasons: '+t.plays+(g.score>=PAR_SEASON?' · PAR CLEARED':' · Par '+PAR_SEASON);
  renderTrophies(document.getElementById('trophies2'),t);
  document.getElementById('summary').classList.remove('hidden');
}
function renderTrophies(el,t){
  var names={deer:'Deer',boar:'Boar',rabbit:'Rabbit',duck:'Duck',stag:'Golden Stag'};
  var h='';
  for(var k in names)h+='<div class="tcard"><b>'+names[k]+'</b><span>'+(t.tr[k]||0)+'</span></div>';
  h+='<div class="tcard"><b>BEST SEASON</b><span>'+t.best+'</span></div>';
  el.innerHTML=h;
}
function startGame(){
  fit();
  G=HUNT.newSeason();HUNT.startRound(G,0);
  playing=true;G.over=false;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('summary').classList.add('hidden');
  showBanner('ROUND 1',RANGES[0].name+' — steady... breathe...',2.4);
  updHUD();lastT=performance.now();
}
document.getElementById('startbtn').addEventListener('click',startGame);
document.getElementById('againbtn').addEventListener('click',startGame);
renderTrophies(document.getElementById('trophies'),HUNT.loadT());

var hudT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!playing||G.over)return;
  var dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  tick(G,dt);draw();
  hudT+=dt;if(hudT>0.12){hudT=0;updHUD()}
}
fit();
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',function(){lastT=performance.now()});
})();
</script>
