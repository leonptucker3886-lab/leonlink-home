<body>
<div id="topbar">

</div>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="hud">
      <div class="hpbar"><i id="ehp" style="width:100%"></i></div>
      <div class="pill">&#128168; <span id="windbox">&middot; 0</span></div>
      <div class="pill">&#9201; <span id="timer">45</span></div>

    </div>
    <div id="turnbanner"></div>
    <div id="menu">
      <h1 class="cat">CATILLERY</h1>
      <div class="sub">Turn-based artillery war between two cat crews. Aim, fire, blow them to bits.<br>Ember Crew vs Mire Gang &mdash; 4 cats a side, 45-second turns, wind matters.</div>
      <button class="bigbtn" id="b_cpu">VS CPU</button>

    </div>
    <div id="wbar">
      <button class="wpn" data-w="bazooka">&#128165;<small>Bazooka<br><span id="sgammo2"></span></small></button>
      <button class="wpn" data-w="grenade">&#127880;<small>Grenade</small></button>
      <button class="wpn" data-w="shotgun">&#128295;<small>Shotgun <span id="sgammo">2 / turn</span></small></button>

  </div>
</div>
<script>
/*ENGINE_START*/
var Catillery = (function(){
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var W=960,H=540,CELL=2,GW=W/CELL|0,GH=H/CELL|0,WATER_Y=500,GRAV=0.5;
var EMBER={name:'Ember Crew',color:'#f59e0b',dark:'#b45309',fur:'#e8930c',stripe:'#c26f06'};
var MIRE ={name:'Mire Gang',color:'#5eead4',dark:'#0f766e',fur:'#8b9bb4',stripe:'#5f6f88'};
var ENAMES=[['Biscuit','Pickles','Miso','Beans'],['Smokey','Ash','Pepper','Olive']];
var WEAPONS={
  bazooka:{key:'bazooka',label:'Bazooka',ammo:'inf'},
  grenade:{key:'grenade',label:'Grenade',ammo:'inf'},
  shotgun:{key:'shotgun',label:'Shotgun',ammo:'2 / turn'},
  cluster:{key:'cluster',label:'Cluster',ammo:'team'}
};
function solidAt(g,x,y){
  var cx=(x/CELL)|0, cy=(y/CELL)|0;
  if(cx<0||cx>=GW) return true;
  if(cy<0) return false;
  if(cy>=GH) return true;
  return g.grid[cy*GW+cx]===1;
}
function groundY(g,x){
  var cx=Math.max(0,Math.min(GW-1,(x/CELL)|0));
  for(var cy=0;cy<GH;cy++){ if(g.grid[cy*GW+cx]===1) return cy*CELL; }
  return H;
}
function genTerrain(g){
  var rng=g.rng, grid=g.grid;
  var p1=rng()*6.28,p2=rng()*6.28,p3=rng()*6.28;
  var ridges=[];
  var nR=2+((rng()*2)|0);
  for(var i=0;i<nR;i++) ridges.push({cx:60+rng()*(GW-120), h:30+rng()*60, w:50+rng()*70});
  for(var cx=0;cx<GW;cx++){
    var h=345+42*Math.sin(cx*0.021+p1)+26*Math.sin(cx*0.052+p2)+11*Math.sin(cx*0.13+p3);
    for(var r=0;r<ridges.length;r++){var R=ridges[r];var d=(cx-R.cx)/R.w;h-=R.h*Math.exp(-d*d);}
    h=Math.max(140,Math.min(WATER_Y-60,h));
    var topCy=(h/CELL)|0;
    for(var cy=topCy;cy<GH;cy++) grid[cy*GW+cx]=1;
  }
  // optional overhang pockets / cave
  if(rng()<0.7){
    var n=1+((rng()*2)|0);
    for(var k=0;k<n;k++){
      var px=80+rng()*(W-160), py=200+rng()*160, rx=36+rng()*40, ry=14+rng()*16;
      carveEllipse(g,px,py,rx,ry);
    }
  }
  g.dirty=true;
}
function carveEllipse(g,px,py,rx,ry){
  for(var cy=Math.max(0,((py-ry)/CELL)|0);cy<Math.min(GH,((py+ry)/CELL)|0)+1;cy++){
    for(var cx=Math.max(0,((px-rx)/CELL)|0);cx<Math.min(GW,((px+rx)/CELL)|0)+1;cx++){
      var dx=(cx*CELL-px)/rx, dy=(cy*CELL-py)/ry;
      if(dx*dx+dy*dy<=1) g.grid[cy*GW+cx]=0;
    }
  }
  g.dirty=true;
}
function carveCircle(g,px,py,r){ carveEllipse(g,px,py,r,r); }
function countSolid(g){var n=0;for(var i=0;i<g.grid.length;i++)if(g.grid[i]===1)n++;return n;}
function makeCat(team,idx,name,x,y){
  return {team:team,idx:idx,name:name,x:x,y:y,vx:0,vy:0,r:10,hp:100,dir:idx<2?1:-1,
    angle:45,power:12,move:60,alive:true,grounded:false,shots:2,weapon:'bazooka'};
}
function createGame(seed,mode){
  var g={rng:mulberry32(seed>>>0||1),grid:new Uint8Array(GW*GH),cats:[],teams:[Object.assign({cluster:3},EMBER),Object.assign({cluster:3},MIRE)],
    projectiles:[],particles:[],crates:[],stones:[],turn:1,lastIdx:[3,3],wind:0,
    state:'menu',timeLeft:45,turnCount:0,winner:-1,moveBudget:60,dirty:true,onEvent:null,waterY:WATER_Y,
    mode:mode||'cpu',auto:[false,false],settle:0};
  genTerrain(g);
  var xs=[70,170,270,370,590,690,790,890];
  for(var i=0;i<8;i++){
    var team=i<4?0:1;
    var gy=groundY(g,xs[i]);
    var tries=0;
    while(gy>WATER_Y-50&&tries<8){tries++;xs[i]+=60;gy=groundY(g,xs[i]%W);}
    g.cats.push(makeCat(team,i%4,ENAMES[team][i%4],xs[i],gy-12));
  }
  // settle initial cats
  for(var s=0;s<90;s++) physicsCats(g);
  if(g.mode==='cpu') g.auto=[false,true];
  newTurn(g);
  return g;
}
function teamHP(g,team){var t=0;for(var i=0;i<g.cats.length;i++){var c=g.cats[i];if(c.team===team&&c.alive)t+=c.hp;}return t;}
function aliveCount(g,team){var n=0;for(var i=0;i<g.cats.length;i++){var c=g.cats[i];if(c.team===team&&c.alive)n++;}return n;}
function nextCat(g,team){
  for(var k=1;k<=4;k++){var i=(g.lastIdx[team]+k)%4;var c=g.cats[team*4+i];if(c.alive){g.lastIdx[team]=i;return c;}}
  return null;
}
function newTurn(g){
  if(g.winner!==-1){g.state='over';return;}
  g.turn=1-g.turn; g.turnCount++;
  var cat=nextCat(g,g.turn);
  if(!cat){g.state='over';g.winner=1-g.turn;return;}
  g.active=cat;
  cat.move=60;cat.shots=2;cat.angle=45;cat.power=12;cat.weapon=g.lastWeapon||'bazooka';
  cat.dir = cat.x < 480 ? 1 : -1;
  g.wind=Math.round((g.rng()*2-1)*10);
  g.timeLeft=45; g.state='aim'; g.settle=0;
  if(g.turnCount>50){var nw=Math.max(120,WATER_Y-(g.turnCount-50)*4);if(nw<g.waterY){g.waterY=nw;emit(g,'tide',{});}}
  maybeDropCrate(g);
  emit(g,'turn',{team:g.turn,cat:cat.name,wind:g.wind});
}
function emit(g,ev,data){ if(g.onEvent) g.onEvent(ev,data); }
// ---- physics ----
function circleHits(g,x,y,r){
  var pts=[[0,0],[r,0],[-r,0],[0,r],[0,-r],[r*0.7,r*0.7],[-r*0.7,r*0.7],[r*0.7,-r*0.7],[-r*0.7,-r*0.7]];
  for(var i=0;i<pts.length;i++) if(solidAt(g,x+pts[i][0],y+pts[i][1])) return true;
  return false;
}
function physicsCats(g){
  for(var i=0;i<g.cats.length;i++){
    var c=g.cats[i]; if(!c.alive) continue;
    c.vy=Math.min(16,c.vy+GRAV);
    // horizontal
    var nx=c.x+c.vx;
    if(!circleHits(g,nx,c.y,c.r)){c.x=nx;}
    else{
      // step-up
      var stepped=false;
      for(var s=1;s<=6;s++){ if(!circleHits(g,nx,c.y-s,c.r)){c.x=nx;c.y-=s;stepped=true;break;} }
      if(!stepped) c.vx=0;
    }
    // vertical
    var ny=c.y+c.vy;
    if(circleHits(g,c.x,ny,c.r)){
      if(c.vy>0){
        // land: scan up to surface
        var land=c.y;
        for(var k=0;k<24;k++){ if(!circleHits(g,c.x,c.y-k,c.r)){land=c.y-k;break;} }
        if(c.vy>11) hurt(g,c,Math.min(40,Math.round((c.vy-11)*5)),null,'fall');
        c.y=land;c.vy=0;c.grounded=true;
      } else { c.vy=0; }
    } else { c.y=ny;c.grounded=false; }
    c.vx*=0.9; if(Math.abs(c.vx)<0.05)c.vx=0;
    if(c.x<12){c.x=12;c.vx=0;} if(c.x>W-12){c.x=W-12;c.vx=0;}
    // drown
    if(c.y+c.r*0.4>g.waterY){ die(g,c,'drown'); emit(g,'splash',{x:c.x,y:g.waterY}); }
  }
}
function hurt(g,cat,dmg,owner,cause){
  if(!cat.alive||dmg<=0) return;
  cat.hp-=dmg;
  emit(g,'hit',{x:cat.x,y:cat.y-14,dmg:dmg});
  if(cat.hp<=0) die(g,cat,cause||'boom');
}
function die(g,cat,cause){
  if(!cat.alive)return;
  cat.alive=false;cat.hp=0;
  var gy=groundY(g,cat.x);
  g.stones.push({x:cat.x,y:Math.min(gy-6,g.waterY-6),name:cat.name,team:cat.team});
  for(var i=0;i<14;i++) g.particles.push({x:cat.x+(g.rng()-0.5)*20,y:cat.y-8+(g.rng()-0.5)*14,vx:(g.rng()-0.5)*3,vy:-2-g.rng()*3,life:40+((g.rng()*20)|0),col:'#cfd6ea',r:2+g.rng()*3});
  emit(g,'die',{x:cat.x,y:cat.y,cause:cause,name:cat.name,team:cat.team});
}
function explode(g,x,y,radius,maxDmg,owner){
  carveCircle(g,x,y,radius);
  for(var i=0;i<10;i++) g.particles.push({x:x+(g.rng()-0.5)*radius,y:y+(g.rng()-0.5)*radius,vx:(g.rng()-0.5)*6,vy:-3-g.rng()*4,life:50+((g.rng()*25)|0),col:g.rng()<0.5?'#f59e0b':'#78350f',r:3+g.rng()*5});
  for(var i2=0;i2<8;i2++) g.particles.push({x:x,y:y,vx:(g.rng()-0.5)*4,vy:-1-g.rng()*2,life:70,col:'#57534e',r:4+g.rng()*6});
  for(var j=0;j<g.cats.length;j++){
    var c=g.cats[j]; if(!c.alive)continue;
    var d=Math.hypot(c.x-x,c.y-y);
    if(d<radius*1.7){
      var fall=1-d/(radius*1.7);
      hurt(g,c,Math.round(maxDmg*fall),owner,'boom');
      var a=Math.atan2(c.y-y,c.x-x);
      c.vx+=Math.cos(a)*14*fall;c.vy-=8*fall;c.grounded=false;
    }
  }
  emit(g,'boom',{x:x,y:y,r:radius});
}
function moveCat(g,cat,dir){
  if(!cat.alive||cat.move<=0)return false;
  cat.dir=dir;
  var step=2;
  var nx=cat.x+dir*step;
  if(!circleHits(g,nx,cat.y,cat.r)){cat.x=nx;}
  else{
    var ok=false;
    for(var s=1;s<=6;s++){ if(!circleHits(g,nx,cat.y-s,cat.r)){cat.x=nx;cat.y-=s;ok=true;break;} }
    if(!ok) return false;
  }
  cat.move-=1;
  return true;
}
function jumpCat(g,cat){
  if(!cat.alive||!cat.grounded||cat.move<12)return false;
  cat.vy=-10;cat.vx=cat.dir*3.5;cat.grounded=false;cat.move-=12;
  emit(g,'jump',{x:cat.x,y:cat.y});
  return true;
}

/* ---- weapons & firing ---- */
function aimVel(cat){
  var rad=cat.angle*Math.PI/180;
  return {vx:Math.cos(rad)*cat.power*1.35*cat.dir, vy:-Math.sin(rad)*cat.power*1.35};
}
function fire(g){
  var c=g.active;
  if(!c||!c.alive||g.state!=='aim')return false;
  var w=c.weapon;
  if(w==='shotgun'){
    if(c.shots<=0)return false;
    resolveShotgun(g,c);
    c.shots--;
    emit(g,'fire',{x:c.x,y:c.y,w:'shotgun'});
    if(c.shots<=0){g.state='firing';g.settle=50;}
    return true;
  }
  var v=aimVel(c);
  var mx=c.x+c.dir*14, my=c.y-6;
  if(w==='bazooka'){
    g.projectiles.push({type:'shell',x:mx,y:my,vx:v.vx,vy:v.vy,owner:c,r:36,dmg:55,t:0});
  }else if(w==='grenade'){
    g.projectiles.push({type:'grenade',x:mx,y:my,vx:v.vx*0.85,vy:v.vy*0.85,owner:c,r:30,dmg:50,fuse:180,t:0,bounces:0});
  }else if(w==='cluster'){
    var T=g.teams[c.team];
    if(T.cluster<=0)return false;
    T.cluster--;
    g.projectiles.push({type:'shell',x:mx,y:my,vx:v.vx*1.05,vy:v.vy*1.05,owner:c,r:36,dmg:20,t:0,cluster:true,fuse:130});
  }
  g.state='firing';g.settle=0;
  emit(g,'fire',{x:mx,y:my,w:w});
  return true;
}
function resolveShotgun(g,c){
  var rad=c.angle*Math.PI/180;
  var dx=Math.cos(rad)*c.dir, dy=-Math.sin(rad);
  var sx=c.x+c.dir*16, sy=c.y-6;
  for(var t=0;t<560;t+=5){
    var px=sx+dx*t, py=sy+dy*t;
    if(solidAt(g,px,py)){
      for(var i=0;i<5;i++)g.particles.push({x:px,y:py,vx:(g.rng()-0.5)*2,vy:-g.rng()*2,life:20,col:'#a8a29e',r:2});
      return;
    }
    for(var j=0;j<g.cats.length;j++){
      var e=g.cats[j];
      if(!e.alive||e.team===c.team||e===c)continue;
      if(Math.hypot(e.x-px,e.y-py)<13){
        var fall=1-t/700;
        hurt(g,e,Math.round(24*fall),c,'shot');
        e.vx+=dx*10*fall;e.vy-=4*fall;e.grounded=false;
        return;
      }
    }
  }
}
function stepProj(g,p){
  p.t++;
  if(p.type==='shell'&&p.wind!==false){p.vx+=g.wind*0.015;}
  if(p.type==='grenade'){p.fuse--;}
  if(p.fuse!==undefined&&p.fuse<=0){detonate(g,p);return true;}
  p.vy+=GRAV*(p.type==='shell'?0.9:1.0);
  // substep to avoid tunneling
  var steps=Math.ceil(Math.hypot(p.vx,p.vy)/4)||1;
  for(var s=0;s<steps;s++){
    p.x+=p.vx/steps;p.y+=p.vy/steps;
    if(solidAt(g,p.x,p.y)){
      if(p.type==='grenade'&&p.bounces<3){
        p.bounces++;p.vy*=-0.45;p.vx*=0.7;
        if(Math.abs(p.vy)<1.2)p.vy=0;
        return false;
      }
      detonate(g,p);return true;
    }
    if(p.x<0||p.x>W){return true;}
    if(p.y>g.waterY){explodeWater(g,p);return true;}
  }
  return false;
}
function explodeWater(g,p){

}
function detonate(g,p){

    for(var i=0;i<3;i++){

    }

    emit(g,'split',{x:p.x,y:p.y});

  }

/* ---- crates ---- */
function maybeDropCrate(g){
  if(g.crates.length>=2||g.rng()>0.16)return;
  var x=80+g.rng()*(W-160);
  g.crates.push({x:x,y:-20,vy:1.6,kind:g.rng()<0.6?'hp':'cluster',landed:false});
  emit(g,'crate',{x:x});
}
function stepCrates(g){
  for(var i=g.crates.length-1;i>=0;i--){
    var cr=g.crates[i];
    if(!cr.landed){
      cr.y+=cr.vy;
      if(solidAt(g,cr.x,cr.y+8)){cr.landed=true;cr.y=groundY(g,cr.x)-8;}
      if(cr.y>g.waterY){g.crates.splice(i,1);continue;}
    }else{
      for(var j=0;j<g.cats.length;j++){
        var c=g.cats[j];
        if(!c.alive)continue;
        if(Math.hypot(c.x-cr.x,c.y-cr.y)<22){
          if(cr.kind==='hp'){c.hp=Math.min(100,c.hp+25);emit(g,'crateget',{x:cr.x,y:cr.y,kind:'hp',name:c.name});}
          else{g.teams[c.team].cluster++;emit(g,'crateget',{x:cr.x,y:cr.y,kind:'cluster',name:c.name});}

/* ---- turn engine ---- */
function step(g){

    if(stepProj(g,g.projectiles[i]))g.projectiles.splice(i,1);

  stepCrates(g);
  physicsCats(g);
  // particles
  for(var k=g.particles.length-1;k>=0;k--){
    var p=g.particles[k];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;
    if(p.life<=0)g.particles.splice(k,1);
  }
  if(g.state==='firing'&&g.projectiles.length===0){
    g.settle++;
    var settled=true;
    for(var j=0;j<g.cats.length;j++){var c=g.cats[j];if(c.alive&&!c.grounded){settled=false;break;}}
    if(settled&&g.settle>70) endTurn(g);
    if(g.settle>600) endTurn(g); // hard safety

  if(g.winner===-1&&(aliveCount(g,0)===0||aliveCount(g,1)===0)) endTurn(g);

function endTurn(g){

  if(a0===0){g.winner=1;g.state='over';emit(g,'over',{winner:1});return;}
  if(a1===0){g.winner=0;g.state='over';emit(g,'over',{winner:0});return;}

}

/* ---- AI ---- */
function clearLine(g,x0,y0,x1,y1){
  var d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/6);
  for(var i=1;i<n;i++){if(solidAt(g,x0+(x1-x0)*i/n,y0+(y1-y0)*i/n))return false;}
  return true;
}
function simShot(g,x,y,vx,vy,type,windV){
  // returns {x,y} landing point, side-effect free
  var fuse=type==='grenade'?180:(type==='cluster'?130:1e9);
  var bounces=0;
  for(var t=0;t<500;t++){
    if(type==='shell')vx+=windV*0.015;
    vy+=GRAV*(type==='shell'?0.9:1.0);
    fuse--;
    if(fuse<=0)return{x:x,y:y,air:true};
    var steps=Math.ceil(Math.hypot(vx,vy)/4)||1;
    for(var s=0;s<steps;s++){
      x+=vx/steps;y+=vy/steps;
      if(solidAt(g,x,y)){
        if(type==='grenade'&&bounces<2){bounces++;vy*=-0.45;vx*=0.7;break;}
        return{x:x,y:y,air:false};
      }
      if(x<0||x>W||y>g.waterY)return{x:x,y:Math.min(y,g.waterY),air:true};
    }
  }

}
function aiPlan(g){
  var t0=Date.now();
  var c=g.active;
  if(!c||!c.alive)return null;
  var foes=[];for(var i=0;i<g.cats.length;i++){var e=g.cats[i];if(e.alive&&e.team!==c.team)foes.push(e);}
  if(!foes.length)return null;
  var tgt=foes[0],bd=1e9;
  for(var f=0;f<foes.length;f++){var d=Math.hypot(foes[f].x-c.x,foes[f].y-c.y);if(d<bd){bd=d;tgt=foes[f];}}
  var dir=tgt.x>=c.x?1:-1;
  // positioning: walk a bit toward the target
  var moves=[];
  if(bd>60&&c.move>20){var n=Math.min(26,Math.floor(c.move/2));for(var m=0;m<n;m++)moves.push(dir);}
  var weapon='bazooka';
  if(bd<165&&clearLine(g,c.x,c.y-6,tgt.x,tgt.y-6))weapon='shotgun';
  else if(bd<270)weapon='grenade';
  else{
    var clustered=0;
    for(var q=0;q<foes.length;q++)if(Math.hypot(foes[q].x-tgt.x,foes[q].y-tgt.y)<130)clustered++;
    if(clustered>=2&&g.teams[c.team].cluster>0)weapon='cluster';
  }
  var plan={moves:moves,weapon:weapon,angle:45,power:12,dir:dir};
  if(weapon==='shotgun'){
    plan.angle=Math.round(Math.atan2(-(tgt.y-6-(c.y-6)),Math.abs(tgt.x-c.x))*180/Math.PI);
    plan.angle=Math.max(10,Math.min(80,plan.angle));
  }else{
    var best=null,bs=1e9;
    var wtype=weapon==='grenade'?'grenade':(weapon==='cluster'?'cluster':'shell');
    var pw0=weapon==='grenade'?4:6, pw1=weapon==='grenade'?13:19;
    var x0=c.x+dir*14,y0=c.y-6;
    for(var a=25;a<=80;a+=5){
      for(var pw=pw0;pw<=pw1;pw+=2){
        var rad=a*Math.PI/180;
        var sp=weapon==='grenade'?0.85:(weapon==='cluster'?1.05:1.0);
        var r=simShot(g,x0,y0,Math.cos(rad)*pw*1.35*sp*dir,-Math.sin(rad)*pw*1.35*sp,wtype,g.wind);
        var s=Math.hypot(r.x-tgt.x,r.y-tgt.y)+(r.air?120:0);
        if(s<bs){bs=s;best={angle:a,power:pw};}
        if(Date.now()-t0>400)break;
      }
      if(Date.now()-t0>400)break;
    }
    if(best){plan.angle=best.angle;plan.power=best.power;}
    // skill error: decent but beatable
    plan.angle+=Math.round((g.rng()-0.5)*9);
    plan.power=Math.max(2,Math.min(20,plan.power*(1+(g.rng()-0.5)*0.16)));
  }
  plan.thinkMs=Date.now()-t0;
  return plan;
}
function aiDoTurn(g){
  // headless full AI turn driver; also used by live CPU mode
  var guard=0;
  while(guard++<3){
    var plan=null;
    try{plan=aiPlan(g);}catch(e){plan=null;}
    if(!plan)break;
    var c=g.active;
    if(!c||!c.alive||g.state!=='aim')break;
    for(var m=0;m<plan.moves.length;m++){if(g.state!=='aim')break;moveCat(g,c,plan.moves[m]);physicsCats(g);}
    c.dir=plan.dir;c.weapon=plan.weapon;c.angle=Math.max(10,Math.min(170,plan.angle));c.power=plan.power;
    var ok=false;
    if(plan.weapon==='shotgun'){ok=fire(g);if(ok&&c.alive&&c.shots>0&&g.state==='aim')fire(g);}
    else ok=fire(g);
    if(!ok){forceEndTurn(g);break;}
    var st=0;
    while(g.state==='firing'&&st++<1200)step(g);
    break;
  }
  if(g.state==='aim')forceEndTurn(g);
}
return {
  W:W,H:H,GW:GW,GH:GH,WATER_Y:WATER_Y,

  aiPlan:aiPlan,aiDoTurn:aiDoTurn,WEAPONS:WEAPONS,EMBER:EMBER,MIRE:MIRE
};
})();

  }
  else if(ev==='tide'){banner('🌊 The tide is rising!');}
  else if(ev==='over'){gameOver();}
  updHUD();
}
function gameOver(){
  document.getElementById('hud').classList.remove('on');
  document.getElementById('stage').classList.remove('on');
  document.getElementById('wbar').classList.remove('on');
  document.getElementById('tctl').classList.remove('on');
  var o=document.getElementById('over');o.style.display='block';
  var T=g.teams[g.winner];
  document.getElementById('wintitle').textContent=g.winner===-1?'Draw!':T.name+' wins!';
  document.getElementById('wintitle').style.color=g.winner===-1?'#fff':T.color;
  var surv=g?g.cats.filter(function(c){return c.team===g.winner&&c.alive;}).length:0;
  document.getElementById('winsub').textContent=g.turnCount+' turns · '+surv+' cats standing · Ember '+C.teamHP(g,0)+' – '+C.teamHP(g,1)+' Mire';
}
document.getElementById('b_cpu').onclick=function(){Snd.init();Snd.click();start('cpu');};
document.getElementById('b_2p').onclick=function(){Snd.init();Snd.click();start('2p');};
document.getElementById('b_rematch').onclick=function(){Snd.click();start(mode);};
document.getElementById('b_menu2').onclick=function(){
  document.getElementById('over').style.display='none';
  document.getElementById('menu').style.display='block';
};
document.querySelectorAll('#wbar .wpn').forEach(function(b){
  b.addEventListener('click',function(){
    if(!humanTurn())return;
    g.active.weapon=b.dataset.w;Snd.click();updHUD();
  });
});
/* ---------- input ---------- */
var stage=document.getElementById('stage');
function cvPos(e){
  var r=cv.getBoundingClientRect();
  var p=e.touches?e.touches[0]:e;
  return {x:(p.clientX-r.left)/r.width*W,y:(p.clientY-r.top)/r.height*H};
}
cv.addEventListener('pointerdown',function(e){
  Snd.init();
  if(!humanTurn())return;
  var p=cvPos(e);
  drag={x0:p.x,y0:p.y};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',function(e){
  if(!drag||!humanTurn())return;
  var p=cvPos(e),a=g.active;
  var dx=drag.x0-p.x,dy=drag.y0-p.y;
  if(Math.abs(dx)<4&&Math.abs(dy)<4)return;
  a.dir=dx>=0?1:-1;
  a.angle=Math.max(10,Math.min(170,Math.atan2(-dy,Math.abs(dx))*180/Math.PI));
  a.power=Math.max(2,Math.min(20,Math.hypot(dx,dy)/14));
});
cv.addEventListener('pointerup',function(e){
  if(drag&&humanTurn()&&g.state==='aim'){
    var a=g.active;
    if(a.power>=3){C.fire(g);}
  }
  drag=null;
});
window.addEventListener('keydown',function(e){
  if(!g||!humanTurn())return;
  var a=g.active;
  if(e.key==='ArrowLeft'){keys.l=true;e.preventDefault();}
  if(e.key==='ArrowRight'){keys.r=true;e.preventDefault();}
  if(e.key==='ArrowUp'&&!e.repeat){C.jumpCat(g,a);e.preventDefault();}
  if(e.key==='ArrowDown'){e.preventDefault();}
  if(e.key==='a'||e.key==='A')a.angle=Math.min(170,a.angle+2);
  if(e.key==='d'||e.key==='D')a.angle=Math.max(10,a.angle-2);
  if(e.key==='w'||e.key==='W')a.power=Math.min(20,a.power+0.5);
  if(e.key==='s'||e.key==='S')a.power=Math.max(2,a.power-0.5);
  if(e.key===' '){C.fire(g);e.preventDefault();}
  if(e.key>='1'&&e.key<='4'){var w=['bazooka','grenade','shotgun','cluster'][+e.key-1];if(w!=='cluster'||g.teams[g.turn].cluster>0){a.weapon=w;updHUD();}}
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')keys.l=false;
  if(e.key==='ArrowRight')keys.r=false;
});
function hold(id,down,up){
  var el=document.getElementById(id);
  el.addEventListener('pointerdown',function(e){e.preventDefault();down();});
  el.addEventListener('pointerup',up);el.addEventListener('pointerleave',up);
}
hold('t_left',function(){keys.l=true;},function(){keys.l=false;});
hold('t_right',function(){keys.r=true;},function(){keys.r=false;});
document.getElementById('t_jump').addEventListener('click',function(){if(humanTurn())C.jumpCat(g,g.active);});
document.getElementById('firebtn').addEventListener('click',function(){if(humanTurn())C.fire(g);});
/* ---------- main loop ---------- */
function cpuStep(){
  var c=g.active;
  if(!cpuQ){
    var plan=null;
    try{plan=C.aiPlan(g);}catch(e){}
    if(!plan){C.forceEndTurn(g);return;}
    c.weapon=plan.weapon;c.dir=plan.dir;
    c.angle=Math.max(10,Math.min(170,plan.angle));c.power=plan.power;
    cpuQ={moves:plan.moves.slice(),fired:0,wait:0};
  }
  if(cpuQ.moves.length&&g.state==='aim'){
    for(var i=0;i<3&&cpuQ.moves.length;i++){C.moveCat(g,c,cpuQ.moves.shift());}
    C.step(g);
  }else if(g.state==='aim'&&cpuQ.wait<=0){
    if(c.weapon==='shotgun'&&cpuQ.fired<2){C.fire(g);cpuQ.fired++;cpuQ.wait=25;}
    else if(c.weapon!=='shotgun'){C.fire(g);cpuQ.wait=25;}
  }
  if(cpuQ.wait>0)cpuQ.wait--;
}
function loop(now){
  requestAnimationFrame(loop);
  if(!g)return;
  var dt=Math.min(0.1,(now-lastT)/1000);lastT=now;
  timerAcc+=dt;
  if(g.state==='aim'){
    g.timeLeft-=dt;
    if(g.timeLeft<=0){C.forceEndTurn(g);}
    if(humanTurn()){
      var a=g.active;
      if(keys.l){C.moveCat(g,a,-1);a.dir=-1;}
      if(keys.r){C.moveCat(g,a,1);a.dir=1;}
      if(keys.ArrowDown){} // reserved
      C.step===null;
      // physics still runs for falling cats
      physicsTick();
    }else if(g.auto[g.turn]){
      cpuStep();
    }
    if(Math.floor(timerAcc*4)!==Math.floor((timerAcc-dt)*4))updHUD();
  }else if(g.state==='firing'){
    var n=Math.floor(dt*60);
    for(var i=0;i<n;i++){C.step(g);if(g.state!=='firing')break;}
  }
  draw();
  if(Math.floor(now/500)!==Math.floor((now-dt*1000)/500)&&g.state==='aim')updHUD();
}
function physicsTick(){C.step(g);if(g.state==='firing')return;}
requestAnimationFrame(loop);
})();
</script>
