<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Play | LeonLink SNES</title><style>body{margin:0;background:#000;color:#FAFAF9;font-family:system-ui,sans-serif}a{color:#9a9af0}#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#2a2a40,#000);z-index:9;text-align:center;transition:opacity .8s}#intro .p{letter-spacing:.4em;font-size:14px;opacity:0;animation:f 1s .2s forwards}#intro h1{font-size:clamp(40px,9vw,80px);margin:.2em 0;background:linear-gradient(90deg,#6b6bd6,#d66bb0,#6bd6c8);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:f 1s .9s forwards}#intro .s{font-size:18px;opacity:0;animation:f 1s 1.6s forwards}.bar{width:240px;height:6px;background:#333;border-radius:3px;margin-top:28px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#6b6bd6;animation:l 3.2s .3s forwards}@keyframes f{to{opacity:1}}@keyframes l{to{width:100%}}#game{width:100%;height:min(78vh,760px)}.info{max-width:960px;margin:auto;padding:14px;font-size:14px}.info.hide{display:none}#ib{position:fixed;right:10px;bottom:10px;z-index:5;background:#222;color:#FAFAF9;border:1px solid #555;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;display:none}</style></head><body>
<div id="intro"><div class="p">LEONLINK PRESENTS</div><h1>SNES</h1><div class="s">by Datasheet</div><div class="bar"><i></i></div><div id="t" style="margin-top:14px;font-size:13px;color:#aaa"></div></div>
<div id="game"></div><div class="info" id="info"></div><button id="ib" onclick="document.getElementById('info').classList.toggle('hide')">Credits &amp; license</button>
<script src="games.js"></script><script>
const id=new URLSearchParams(location.search).get('g'),x=SHELF.find(s=>s.id===id);
if(!x){location.href='./';}else{document.title=x.title+' | LeonLink SNES';
document.getElementById('t').textContent='Loading '+x.title+'...';
document.getElementById('info').innerHTML=`<a href="./">&larr; Game Shelf</a> &middot; <b>${x.title}</b> by ${x.author} &middot; License: <a href="${x.licUrl}" target="_blank" rel="noopener">${x.lic}</a> &middot; Original: <a href="${x.src}" target="_blank" rel="noopener">${x.src.replace('https://','')}</a><br><small>Free, openly licensed homebrew, hosted unmodified. Not affiliated with Nintendo. All rights stay with the original authors.</small>`;
setTimeout(()=>{const i=document.getElementById('intro');i.style.opacity=0;setTimeout(()=>i.remove(),800);
window.EJS_player='#game';window.EJS_core='snes';window.EJS_gameName=x.title;window.EJS_gameUrl='roms/'+x.id+'.sfc';window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_startOnLoaded=true;window.EJS_color='#6b6bd6';window.EJS_onGameStart=()=>{document.getElementById('info').classList.add('hide');document.getElementById('ib').style.display='block';};
const s=document.createElement('script');s.src='https://cdn.emulatorjs.org/stable/data/loader.js';document.body.appendChild(s);},3800);}
</script></body></html>
