    else if (id === "page") { noise(.16, t, 2600, .7, .045, "highpass"); tone(280, .1, t, { vol: .03, to: 170 }); }

    else if (id === "hit") { noise(.5, t, 900, .8, .1, "lowpass"); tone(110, .3, t, { vol: .1, to: 60 }); }
  } catch (e) {}
}
function toggleSound() {
  audioInit();
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : .4;
  st.sound = !muted;
  document.getElementById("snd").textContent = muted ? "\u00d7" : "\u266a";
  try { localStorage.setItem("snf:teaser:snd", muted ? "off" : "on"); } catch (e) {}
}

/* ---------- render ---------- */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function panelHTML(p, i) {
  if (p.map) return '<div class="panel off lotmap" data-p="' + i + '">' + mapSVG() +
    '<div class="lotbtns">' +
    '<button onclick="lotPick(\'courtney\',this)">Courtney</button>' +
    '<button onclick="lotPick(\'marcus\',this)">Marcus</button>' +
    '<button onclick="lotPick(\'april\',this)">April</button>' +
    '<button onclick="lotPick(\'leon\',this)">Leon</button>' +
    '<button onclick="lotPick(\'ali\',this)">Ali</button>' +
    '<button onclick="lotPick(\'clyde\',this)">Clyde</button>' +
    '<button onclick="lotPick(\'pond\',this)">The pond</button>' +
    '</div><div class="lotline" id="lotline">Tap a name. This is the whole park.</div></div>';
  var h = '<div class="panel off ' + (p.cls || "h-mid") + '" data-p="' + i + '">' +
    '<img src="' + p.img + '" alt="" loading="' + (i === 0 ? "eager" : "lazy") + '">' +
    '<div class="halftone"></div><div class="vig"></div>';
  if (p.cap) h += '<div class="cap' + (p.capPos === "bottom" ? " bottom" : "") + '">' + esc(p.cap) + '</div>';
  if (p.bub) h += bubble(p.bub);
  if (p.bub2) h += bubble(p.bub2);
  if (p.sfx) h += '<div class="sfx ' + (p.sfx.length > 12 ? "s2" : "s1") + '">' + esc(p.sfx) + '</div>';
  return h + '</div>';
}
function bubble(b) {
  return '<div class="bub ' + (b.pos || "bl") + '"><span class="who">' + esc(b.who) + '</span>' + esc(b.text) + '</div>';
}

function render() {
  var page = PAGES[st.page], book = document.getElementById("book"), html = "";
  if (page.type === "cover") {
    html = '<div class="page cover">' +
      '<div class="art"><img src="' + A + 'party.jpg" alt="The crew at Sun N Fun at night">' +
      '<div class="shade"></div>' +
      '<div class="addr">Rineyville, Kentucky &middot; Est. 1974</div>' +
      '<div class="lock"><div class="over">A LeonLink story</div>' +
      '<h1>Sun <em>N</em><br>Fun</h1>' +
      '<div class="sub">Chapter Zero &middot; The Phone</div>' +
      '<div class="tap">Tap to begin</div></div></div></div>';
  } else if (page.type === "end") {
    html = '<div class="page end">' +
      '<div class="strip">' +
      '<figure><img src="' + A + 'teaser-mask.jpg" alt=""><figcaption>the garage</figcaption></figure>' +
      '<figure><img src="' + A + 'teaser-cops.jpg" alt=""><figcaption>the pickup</figcaption></figure>' +
      '<figure><img src="' + A + 'teaser-pond.jpg" alt=""><figcaption>the meeting</figcaption></figure>' +
      '</div><div class="body">' +
      '<div class="soon">Coming<br>Soon<span>Chapter One</span></div>' +
      '<h3>The Meeting at the Pond</h3>' +
      '<p>Eleven trailers. Forty people. One of them made the call. DumNummy is in a cell in Hardin County for a phone call he did not make, and nobody in Sun N Fun is going home until somebody says a name.</p>' +
      '<p>You still have the phone. You still have not told anyone what is on it.</p>' +
      '<div class="acts">' +
      '<a href="sun-n-fun.html">Play Chapter Zero now</a>' +
      '<button onclick="shareIt()">Share this comic</button>' +
      '<button class="ghost" onclick="restart()">Read it again</button>' +
      '</div>' +
      '<p class="fine">Contains drinking, language, and small-town menace.<br>Everything here is fiction except the roads. <a href="/games.html">More games</a></p>' +
      '</div></div>';
  } else {
    html = '<div class="page">' +
      '<div class="page-head"><div><div class="k">' + esc(page.kicker) + '</div><h2>' + esc(page.title) + '</h2></div>' +
      '<div class="n">' + st.page + '</div></div>' +
      page.panels.map(panelHTML).join("") +
      '</div>';
  }
  book.innerHTML = html;
  book.scrollTop = 0;
  st.shown = 0;
  updateBar();
  if (page.type === "cover") { st.shown = 1; hint("Tap to begin"); }
  else if (page.type === "end") { st.shown = 1; cue("boom"); hint("That is all of it. For now."); }
  else { revealNext(); hint("Tap for the next panel"); }
}

function revealNext() {
  var page = PAGES[st.page], panels = document.querySelectorAll(".panel");
  if (!panels.length) return;
  var idx = st.shown;
  if (idx >= panels.length) return;
  st.shown++;
  var p = panels[idx];
  p.classList.remove("off");
  cue("tick");
  if (st.shown >= panels.length) hint("Tap to turn the page");
  setTimeout(function () {
    try { p.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {}
  }, 60);
  updateBar();
}
function updateBar() {
  var total = PAGES.length;
  document.getElementById("prog").style.width = ((st.page + 1) / total * 100) + "%";
  document.getElementById("pageno").textContent = (st.page + 1) + " / " + total;
  document.getElementById("back").disabled = st.page === 0;
}
function hint(t) { document.getElementById("hint").textContent = t; }

/* ---------- navigation ---------- */
function advance() {
  var page = PAGES[st.page];
  if (page.type === "cover") { nextPage(); return; }
  if (page.type === "end") { return; }
  if (st.shown < page.panels.length) { revealNext(); return; }
  nextPage();
}
function nextPage() {
  if (st.page >= PAGES.length - 1) return;
  st.page++;
  cue("page");
  render();
}
function prevPage() {
  if (st.page <= 0) return;
  st.page--;
  cue("page");
  render();
}
function restart() {
  st.page = 0;
  render();
  cue("page");
}
function goToPage(n) { if (n >= 0 && n < PAGES.length) { st.page = n; render(); } }

/* ---------- tap / keys ---------- */
var downX = 0, downY = 0, moved = false, downT = 0;
var book = document.getElementById("book");
book.addEventListener("pointerdown", function (e) {
  downX = e.clientX; downY = e.clientY; moved = false; downT = Date.now();
  audioInit();
});
book.addEventListener("pointermove", function (e) {
  if (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 14) moved = true;
});
book.addEventListener("pointerup", function (e) {
  if (Date.now() - downT > 700) return;
  if (moved) return;
  if (e.target.closest("button, a")) return;
  advance();
});
document.addEventListener("keydown", function (e) {
  if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); advance(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); prevPage(); }
  else if (e.key === "r") restart();
});

/* ---------- the map ---------- */
function mapSVG() {
  var s = '<svg viewBox="0 0 440 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Map of Sun N Fun Estates">';
  s += '<rect width="440" height="330" fill="#e6d8b2"/>';
  s += '<rect x="8" y="8" width="424" height="314" fill="none" stroke="#8a7449" stroke-width="1.2"/>';
  /* roads */
  s += '<path d="M 46 -4 C 44 90, 52 220, 40 336" stroke="#b6a37a" stroke-width="16" fill="none"/>';
  s += '<path d="M 46 -4 C 44 90, 52 220, 40 336" stroke="#6d5a38" stroke-width="1" fill="none"/>';
  s += '<path d="M 44 236 C 120 248, 220 226, 300 222 C 356 219, 404 236, 428 262" stroke="#8a7449" stroke-width="7" fill="none"/>';
  s += '<path d="M 48 92 C 130 78, 210 100, 292 92 C 350 86, 392 70, 420 54" stroke="#8a7449" stroke-width="7" fill="none"/>';
  s += '<path d="M 300 222 C 284 180, 296 140, 330 122 C 364 104, 392 140, 382 182 C 374 216, 338 230, 300 222" stroke="#8a7449" stroke-width="6" fill="none"/>';
  s += '<text x="20" y="160" fill="#4a3a24" font-size="8" font-weight="700" transform="rotate(-88 20 160)" font-family="Georgia,serif" letter-spacing="1.4">BOONE RD</text>';
  s += '<text x="104" y="230" fill="#4a3a24" font-size="8" font-weight="700" font-family="Georgia,serif" transform="rotate(4 104 230)">WAMPUM</text>';
  s += '<text x="120" y="86" fill="#4a3a24" font-size="8" font-weight="700" font-family="Georgia,serif" transform="rotate(-3 120 86)">TOMAHAWK TRL</text>';
  s += '<text x="330" y="196" fill="#4a3a24" font-size="7" font-weight="700" font-family="Georgia,serif" transform="rotate(-58 330 196)">COCHISE</text>';
  /* pond */
  s += '<ellipse cx="356" cy="286" rx="42" ry="24" fill="#4d6a63" stroke="#33493f" stroke-width="1.6"/>';
  s += '<text x="356" y="289" fill="#dbe6d8" font-size="8" text-anchor="middle" font-family="Georgia,serif" letter-spacing="1">POND</text>';
  /* trees */
  [[70,40],[96,120],[150,300],[250,290],[404,290],[64,196],[210,44]].forEach(function (t) {
    s += '<g stroke="#5d6b46" stroke-width="1" fill="none" opacity=".7"><path d="M' + t[0] + ' ' + (t[1] + 6) + ' l0 -6"/><path d="M' + (t[0] - 4) + ' ' + t[1] + ' l4 -6 l4 6"/></g>';
  });
  function dot(x, y, id, lab, anchor, dx, dy) {
    return '<g onclick="lotPick(\'' + id + '\',null)" style="cursor:pointer">' +
      '<circle cx="' + x + '" cy="' + y + '" r="5" fill="#a5141c" stroke="#e8ddc1" stroke-width="1.6"/>' +
      '<text x="' + (x + dx) + '" y="' + (y + dy) + '" fill="#2b2115" font-size="8" font-weight="700" text-anchor="' + anchor + '" font-family="Georgia,serif" style="paint-order:stroke;stroke:#e6d8b2;stroke-width:3px">' + lab + '</text></g>';
  }
  s += dot(232, 92, "leon", "LEON'S GARAGE", "start", 9, -6);
  s += dot(420, 54, "clyde", "WOODS", "end", -8, -8);
  s += dot(140, 236, "courtney", "COURTNEY", "middle", 0, 18);
  s += dot(300, 222, "marcus", "MARCUS", "middle", 0, 18);
  s += dot(346, 132, "april", "APRIL", "middle", 0, -10);
  s += dot(120, 92, "ali", "ALI", "middle", 0, 18);
  s += dot(60, 292, "pond", "", "middle", 0, 0);
  s += '<text x="116" y="316" fill="#5b4a30" font-size="6.5" font-style="italic" font-family="Georgia,serif">the dip</text>';
  return s + '</svg>';
}
var LOT_LINES = {
  courtney: "<b>Courtney</b> \u2014 Wampum Road, blue trim. Drew the map at two in the morning. The only person in this park glad to see you.",
  marcus: "<b>Marcus</b> \u2014 first lot on Cochise. Axe in the block, knife on the tailgate, sword on the porch. Nobody asks anymore.",
  april: "<b>April</b> \u2014 last lot before the trees. Door shut, curtains shut. Your phone is on her windowsill, face down, charging.",
  leon: "<b>Leon</b> \u2014 owns the garage on Tomahawk. You sleep in it. He has not had a phone since 2019 and says it was the best year of his life.",
  ali: "<b>Ali</b> \u2014 back of Tomahawk. Four-wheeler. Watches everything and says about a third of it.",
  clyde: "<b>Clyde</b> \u2014 past the fence, in the trees. A shelf of things people lose. He does not like you and will not say why.",
  pond: "<b>The pond</b> \u2014 the meeting place. Dusk. Chairs out, wood stacked, nobody sitting down."
};
function lotPick(id, btn) {
  audioInit(); cue("tick");
  var line = document.getElementById("lotline");
  if (line) line.innerHTML = LOT_LINES[id] || "";
  var btns = document.querySelectorAll(".lotbtns button");
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove("on");
  if (btn) btn.classList.add("on");
}

/* ---------- share ---------- */
function toast(t) {
  var el = document.getElementById("toast");
  el.textContent = t;
  el.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.classList.remove("on"); }, 2600);
}
function shareIt() {
  var url = location.href.split("#")[0];
  var data = { title: "Sun N Fun \u2014 Chapter Zero: The Phone", text: "You wake up in a garage with no phone. An interactive comic from Sun N Fun Estates.", url: url };
  if (navigator.share) {
    navigator.share(data).catch(function () {});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function () { toast("Link copied"); }, function () { window.prompt("Copy this link", url); });
    return;
  }
  window.prompt("Copy this link", url);
}

/* ---------- boot ---------- */
try {
  if (localStorage.getItem("snf:teaser:snd") === "off") { muted = true; st.sound = false; }
} catch (e) {}
document.getElementById("snd").textContent = muted ? "\u00d7" : "\u266a";
render();
</script>
