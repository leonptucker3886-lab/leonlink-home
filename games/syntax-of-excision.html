<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Syntax of Excision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IBM+Plex+Mono:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#05070a; --bone:#e8e4d8; --bone-dim:rgba(232,228,216,.62);
  --blood:#8b1a1a; --blood-bright:#c0392b;
  --gold:#c9a961; --gold-dim:rgba(201,169,97,.55);
  --neon:#39ff14; --lb:5vh;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg0);color:var(--bone);overflow:hidden;
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  user-select:none;-webkit-user-select:none;
  font-size:15px;line-height:1.5;overscroll-behavior:none;touch-action:manipulation;
}
button{font-family:inherit;color:inherit;border:0;background:transparent;cursor:pointer}

#stage{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(139,26,26,.08), transparent 60%),
    radial-gradient(ellipse at 50% 110%, rgba(57,255,20,.03), transparent 55%),
    var(--bg0);
  overflow:hidden;
}
#stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(0,0,0,.72) 100%);
}
#stage::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0px, rgba(255,255,255,.014) 1px, transparent 1px, transparent 3px);
  opacity:.5;
}
#corruption{
  position:fixed;inset:0;pointer-events:none;z-index:7;
  background:radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(139,26,26,.5) 100%);
  opacity:0;transition:opacity 1.4s ease;
}
#scars-overlay{
  position:fixed;inset:0;pointer-events:none;z-index:8;
  background:
    radial-gradient(ellipse at 22% 34%, rgba(180,30,30,.22), transparent 32%),
    radial-gradient(ellipse at 78% 62%, rgba(180,30,30,.18), transparent 30%);
  opacity:0;transition:opacity 1.2s ease;
}
#grain{
  position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.055;
  background-image:
    radial-gradient(1px 1px at 20% 30%, #fff, transparent),
    radial-gradient(1px 1px at 60% 70%, #fff, transparent),
    radial-gradient(1px 1px at 80% 20%, #fff, transparent),
    radial-gradient(1px 1px at 33% 88%, #fff, transparent),
    radial-gradient(1px 1px at 72% 45%, #fff, transparent),
    radial-gradient(1px 1px at 10% 60%, #fff, transparent);
  background-size:200px 200px;
  animation:grain .7s steps(2) infinite;
}
@keyframes grain{
  0%{background-position:0 0}25%{background-position:-40px -20px}
  50%{background-position:20px -40px}75%{background-position:-30px 30px}
  100%{background-position:0 0}
}
.letterbox{
  position:fixed;left:0;right:0;height:0;background:#000;z-index:40;
  transition:height .8s cubic-bezier(.7,0,.3,1);pointer-events:none;
}
.letterbox.top{top:0} .letterbox.bot{bottom:0} .letterbox.open{height:var(--lb)}

#topbar{
  position:fixed;top:0;left:0;right:0;z-index:45;
  padding:calc(6px + env(safe-area-inset-top)) 10px 6px;
  display:flex;align-items:center;gap:5px;
  font-family:'Cinzel',serif;pointer-events:none;
}
#topbar.hidden{display:none}
.corruption-bar{flex:1;height:2px;background:rgba(0,0,0,.6);position:relative;overflow:hidden;border:1px solid rgba(201,169,97,.18)}
.corruption-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--blood-bright));box-shadow:0 0 8px rgba(139,26,26,.7);transition:width 1s cubic-bezier(.4,0,.2,1)}
.hud-tag{
  padding:3px 6px;border:1px solid rgba(201,169,97,.3);background:rgba(0,0,0,.6);
  font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  backdrop-filter:blur(6px);white-space:nowrap;
}
.hud-tag .n{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;color:var(--bone);margin-left:4px;letter-spacing:0}
.hud-tag.blood{border-color:rgba(139,26,26,.5);color:#e77} .hud-tag.blood .n{color:#fbb}
.hud-tag.neon{border-color:rgba(57,255,20,.4);color:var(--neon)}

.screen{
  position:absolute;inset:0;z-index:3;display:none;flex-direction:column;
  padding:calc(var(--lb) + 22px) 20px calc(var(--lb) + 22px);
  overflow:hidden;
}
.screen.on{display:flex;animation:screenIn .7s cubic-bezier(.4,0,.2,1)}
@keyframes screenIn{from{opacity:0}to{opacity:1}}
.screen.compact{padding-left:14px;padding-right:14px}

.title-xl{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(22px,6.5vw,40px);line-height:1.05;letter-spacing:.05em;text-align:center}
.title-lg{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(18px,4.6vw,28px);line-height:1.15;letter-spacing:.06em}
.small-caps{font-family:'Cinzel',serif;font-weight:500;font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-dim)}
.mono{font-family:'IBM Plex Mono',monospace}
.serif{font-family:'Cormorant Garamond',serif}
.ital{font-style:italic}
.blood{color:var(--blood-bright)} .gold{color:var(--gold)} .neon{color:var(--neon)} .dim{color:var(--bone-dim)}

.subtitle{position:absolute;left:0;right:0;bottom:calc(var(--lb) + 22px);padding:0 22px;text-align:center;z-index:10;pointer-events:none}
.subtitle-text{
  display:inline-block;font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;
  font-size:clamp(16px,4.3vw,21px);line-height:1.5;color:var(--bone);
  text-shadow:0 2px 12px rgba(0,0,0,.95);max-width:620px;
}
.subtitle-text .cursor{display:inline-block;width:7px;background:var(--bone);margin-left:3px;animation:blink .9s steps(2) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.speaker{
  display:block;font-family:'Cinzel',serif;font-weight:700;
  font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;margin-bottom:8px;
  text-shadow:0 0 14px currentColor;
}

.portrait{
  position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);
  font-size:clamp(70px,26vw,130px);line-height:1;
  filter:drop-shadow(0 0 30px rgba(0,0,0,.85)) drop-shadow(0 0 60px currentColor);
  z-index:2;animation:portraitIn .9s cubic-bezier(.34,1.4,.64,1);
}
@keyframes portraitIn{
  from{opacity:0;transform:translate(-50%,-50%) scale(.7);filter:blur(20px)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}
}
/* Portrait temperament animations */
.portrait.ecstatic{animation:portraitIn .9s ease, tempo-ecstatic 1.6s ease-in-out infinite}
@keyframes tempo-ecstatic{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  25%{transform:translate(-50%,-50%) scale(1.04) rotate(-1deg)}
  75%{transform:translate(-50%,-50%) scale(.99) rotate(1deg)}
}
.portrait.patient{animation:portraitIn .9s ease, tempo-patient 5s ease-in-out infinite}
@keyframes tempo-patient{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.02)}
}
.portrait.precise{animation:portraitIn .9s ease, tempo-precise 2.4s steps(4) infinite}
@keyframes tempo-precise{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.01) translateY(-2px)}
}
.portrait.quiet{animation:portraitIn 1.4s ease, tempo-quiet 6s ease-in-out infinite}
@keyframes tempo-quiet{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}
  50%{transform:translate(-50%,-50%) scale(1.01);opacity:1}
}
.portrait.martial{animation:portraitIn .5s cubic-bezier(.4,0,.2,1), tempo-martial 1s ease-in-out infinite}
@keyframes tempo-martial{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.015) translateX(1px)}
}
.portrait.gentle{animation:portraitIn 1.2s ease, tempo-gentle 3.4s ease-in-out infinite}
@keyframes tempo-gentle{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.025) translateY(-3px)}
}
.portrait.kind{animation:portraitIn 1s ease, tempo-kind 4s ease-in-out infinite}
@keyframes tempo-kind{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.03) rotate(1deg)}
}
.portrait.cold{animation:portraitIn .8s ease, tempo-cold 8s linear infinite}
@keyframes tempo-cold{
  0%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.005) rotate(-0.5deg)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

.choices-veil{
  position:absolute;left:0;right:0;bottom:calc(var(--lb) + 12px);
  padding:12px 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.88) 25%,rgba(0,0,0,.97));
  z-index:11;display:flex;flex-direction:column;gap:8px;
  animation:choicesIn .6s cubic-bezier(.4,0,.2,1);
}
@keyframes choicesIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.choice{
  padding:13px 16px 13px 30px;border:1px solid rgba(201,169,97,.35);
  background:rgba(0,0,0,.55);text-align:left;font-family:'IBM Plex Mono',monospace;
  font-size:13px;line-height:1.4;color:var(--bone);letter-spacing:.02em;
  transition:.16s;position:relative;overflow:hidden;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-height:48px;
}
.choice::before{content:'▸';position:absolute;left:12px;top:14px;color:var(--gold);opacity:.5;transition:.2s;font-family:'Cinzel',serif;font-size:12px}
.choice:active{background:rgba(139,26,26,.28);border-color:var(--blood-bright);transform:translateX(2px)}
.choice:active::before{opacity:1;color:var(--blood-bright)}
.choice .sub{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:var(--bone-dim);margin-top:3px}
.choice .tone{display:inline-block;font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.24em;color:var(--gold);opacity:.85;margin-right:8px;vertical-align:middle;text-transform:uppercase}
.choice.danger{border-color:rgba(139,26,26,.55)}
.choice.danger:active{background:rgba(139,26,26,.5);border-color:var(--blood-bright)}

.tap-hint{position:absolute;left:0;right:0;bottom:calc(var(--lb) + 10px);text-align:center;z-index:10;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.3em;color:var(--gold-dim);text-transform:uppercase;animation:pulse 2s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}

.story-card{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;height:100%;text-align:center}
.story-card .chapter-no{font-family:'Cinzel',serif;font-weight:500;font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--gold-dim)}
.story-card .chapter-title{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(24px,7vw,42px);line-height:1.05;letter-spacing:.04em;color:var(--bone);text-shadow:0 0 24px rgba(0,0,0,.9),0 0 60px rgba(139,26,26,.3);max-width:520px}
.story-card .chapter-epi{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14.5px;line-height:1.6;color:var(--bone-dim);max-width:440px}

.interrogation{display:flex;flex-direction:column;height:100%;gap:12px}
.inter-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:9px;border-bottom:1px solid rgba(201,169,97,.2);flex-wrap:wrap;gap:6px}
.inter-head .ih-label{font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.inter-head .ih-prog{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--bone-dim);letter-spacing:.14em}
.inter-timer{height:2px;background:rgba(0,0,0,.6);border:1px solid rgba(139,26,26,.3);margin-bottom:4px;overflow:hidden}
.inter-timer i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--blood-bright));transition:width linear;box-shadow:0 0 8px rgba(139,26,26,.7)}
.inter-doc{flex:1;display:flex;flex-direction:column;padding:16px 14px;background:rgba(0,0,0,.4);border-left:2px solid var(--blood);border-right:1px solid rgba(201,169,97,.14);min-height:120px;overflow-y:auto}
.inter-doc .speaker-name{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--blood-bright);margin-bottom:10px}
.inter-doc .question{font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.5;color:var(--bone);font-style:italic;flex:1}
.inter-doc .interject{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(201,169,97,.2);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold-dim);letter-spacing:.02em}
.inter-choices{display:grid;gap:8px}
.inter-choice{padding:12px 14px;border:1px solid rgba(201,169,97,.28);background:rgba(0,0,0,.5);text-align:left;font-size:12.5px;line-height:1.42;color:var(--bone);transition:.15s;font-family:'IBM Plex Mono',monospace;min-height:44px}
.inter-choice:active{background:rgba(201,169,97,.14);transform:translateX(2px)}
.inter-choice.right{background:rgba(57,255,20,.1);border-color:var(--neon);color:#e0ffd4}
.inter-choice.wrong{background:rgba(139,26,26,.32);border-color:var(--blood-bright);color:#fdd}
.inter-choice.reveal{background:rgba(57,255,20,.06);border-color:rgba(57,255,20,.45);color:#e0ffd4}
.inter-verdict{padding:11px 13px;border-left:3px solid var(--gold);background:rgba(201,169,97,.06);font-family:'Cormorant Garamond',serif;font-size:13.5px;line-height:1.5;font-style:italic;color:var(--bone)}

.map{position:relative;width:100%;aspect-ratio:1;max-width:420px;margin:0 auto;border:1px solid rgba(201,169,97,.24);background:radial-gradient(circle at 50% 50%, rgba(139,26,26,.12), transparent 55%), rgba(0,0,0,.5);overflow:hidden}
.map::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(201,169,97,.05) 1px, transparent 1px),linear-gradient(90deg, rgba(201,169,97,.05) 1px, transparent 1px);background-size:12.5% 12.5%}
.map .core{position:absolute;left:50%;top:50%;width:14%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 35%, rgba(232,228,216,.9), rgba(201,169,97,.5) 35%, transparent 70%);box-shadow:0 0 30px rgba(201,169,97,.6), 0 0 60px rgba(139,26,26,.3);animation:corePulse 3s ease-in-out infinite}
@keyframes corePulse{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.05);opacity:1}}
.map .node{position:absolute;width:17%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:2px solid currentColor;display:grid;place-items:center;font-size:16px;cursor:pointer;transition:.25s;background:radial-gradient(circle at 40% 35%, rgba(255,255,255,.06), rgba(0,0,0,.5));box-shadow:0 0 14px -4px currentColor}
.map .node.active{animation:nodePulse 2.4s ease-in-out infinite}
@keyframes nodePulse{0%,100%{box-shadow:0 0 14px -4px currentColor}50%{box-shadow:0 0 28px 0 currentColor}}
.map .node.dead{color:#444 !important;filter:grayscale(1) brightness(.5);box-shadow:none;pointer-events:none}
.map .node.dead::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;color:var(--blood-bright);font-size:22px;opacity:.7}
.map .node .nlabel{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:currentColor;opacity:.85}
.map .node .intel-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);font-size:7px;font-weight:900;color:#000;display:grid;place-items:center;font-family:'Cinzel',serif}
.map .node .intel-dot.hidden{display:none}

.panel{background:linear-gradient(160deg,rgba(14,10,10,.94),rgba(4,4,4,.98));border:1px solid rgba(201,169,97,.24);padding:14px 13px;position:relative}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid rgba(201,169,97,.16)}
.panel-head .ph-name{font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.panel-head .ph-tag{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim)}

.sigil{width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;font-size:22px;line-height:1;border:1px solid currentColor;background:radial-gradient(circle at 40% 35%, rgba(255,255,255,.08), rgba(0,0,0,.4));box-shadow:0 0 18px -6px currentColor, inset 0 0 12px rgba(0,0,0,.6)}

.dossier{display:flex;flex-direction:column;gap:11px}
.dossier-head{display:flex;gap:12px;align-items:center}
.dossier-title .dt-name{font-family:'Cinzel',serif;font-weight:900;font-size:16px;letter-spacing:.1em;text-transform:uppercase;line-height:1.15}
.dossier-title .dt-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12.5px;color:var(--bone-dim);margin-top:3px}
.dossier-quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13.5px;line-height:1.55;color:var(--bone);padding:10px 12px;border-left:2px solid var(--gold);background:rgba(201,169,97,.04)}
.dossier-facts{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:11.5px}
.dossier-facts dt{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);padding-top:2px}
.dossier-facts dd{color:var(--bone);line-height:1.4}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-family:'Cinzel',serif;font-weight:700;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;transition:.2s;min-height:46px}
.btn:active{background:rgba(201,169,97,.14);transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,rgba(139,26,26,.9),rgba(80,12,12,.9));border-color:var(--blood-bright);color:var(--bone);box-shadow:0 0 18px rgba(139,26,26,.4)}
.btn.primary:active{background:linear-gradient(135deg,rgba(180,30,30,.95),rgba(100,15,15,.95))}
.btn.ghost{border-color:rgba(201,169,97,.3);color:var(--bone-dim)}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.btn-row .btn{flex:1;min-width:0}
.btn-sm{padding:8px 14px;font-size:9px;min-height:36px;letter-spacing:.2em}

.ending-scrim{position:fixed;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center}
.ending-scrim.on{display:flex;animation:scrimIn 2.4s ease}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
.ending-scrim .end-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(15px,4.2vw,20px);line-height:1.7;color:var(--bone);max-width:520px}
.ending-scrim .end-attr{margin-top:28px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dim);line-height:2}
.ending-scrim .end-attr strong{color:var(--gold);font-weight:700}

.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
.scroll::-webkit-scrollbar{width:3px}
.scroll::-webkit-scrollbar-thumb{background:rgba(201,169,97,.3)}
.scroll::-webkit-scrollbar-track{background:transparent}

.menu{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;height:100%;text-align:center;animation:screenIn 1s ease}
.menu-title{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(28px,9vw,52px);line-height:1;letter-spacing:.06em;color:var(--bone);text-shadow:0 0 30px rgba(139,26,26,.5),0 0 80px rgba(139,26,26,.2);margin-bottom:4px}
.menu-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--bone-dim);letter-spacing:.02em;margin-bottom:22px;max-width:380px;line-height:1.6}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}
.menu-btns .btn{width:100%}

.herald{position:fixed;left:0;right:0;bottom:calc(var(--lb) + 8px);z-index:9;padding:0 16px;display:flex;align-items:flex-end;gap:10px;pointer-events:none;animation:heraldIn .7s cubic-bezier(.34,1.3,.64,1)}
@keyframes heraldIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.herald-card{flex:1;background:linear-gradient(135deg,rgba(10,14,10,.92),rgba(4,6,4,.96));border:1px solid rgba(201,169,97,.28);border-left:3px solid var(--gold);padding:10px 13px;backdrop-filter:blur(8px)}
.herald-name{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.herald-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13.5px;line-height:1.5;color:var(--bone)}
.herald-avatar{font-size:34px;line-height:1;filter:drop-shadow(0 0 14px rgba(201,169,97,.6));animation:heraldFloat 3s ease-in-out infinite}
@keyframes heraldFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* Codex */
.codex-tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid rgba(201,169,97,.16);scrollbar-width:none}
.codex-tabbar::-webkit-scrollbar{display:none}
.codex-tab{flex:0 0 auto;padding:7px 11px;border:1px solid rgba(201,169,97,.24);background:rgba(0,0,0,.5);font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);transition:.15s;cursor:pointer;white-space:nowrap}
.codex-tab.active{color:var(--gold);border-color:var(--gold);background:rgba(201,169,97,.12)}
.codex-entry{padding:12px 13px;border:1px solid rgba(201,169,97,.16);background:rgba(0,0,0,.4);margin-bottom:8px;position:relative;transition:.15s}
.codex-entry.locked{opacity:.4;filter:grayscale(.5)}
.codex-entry.unlocked{border-left:2px solid var(--gold)}
.codex-entry .ce-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.codex-entry .ce-ico{font-size:15px;filter:drop-shadow(0 0 6px currentColor)}
.codex-entry .ce-title{font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);flex:1}
.codex-entry .ce-locked-tag{font-family:'Cinzel',serif;font-size:8px;letter-spacing:.18em;color:var(--blood-bright);opacity:.7}
.codex-entry .ce-body{font-family:'Cormorant Garamond',serif;font-size:13.5px;line-height:1.6;font-style:italic;color:var(--bone)}
.codex-entry .ce-body.locked{font-style:normal;color:var(--bone-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.02em}

/* Final confession */
.confession{
  display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;
  height:100%;text-align:center;padding:0 8px;
}
.confession-line{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(15px,4.2vw,20px);line-height:1.6;color:var(--bone);max-width:520px;
}
.confession-line.hidden{opacity:0}
.confession-line.shown{opacity:1;animation:fadeUp .8s ease backwards}

.confession-attr{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:.28em;text-transform:uppercase;

}

/* ============================================================
   AUDIO ENGINE
   ============================================================ */
const Audio = (()=>{
  let ctx=null, master=null, droneNodes=null, heartbeatHandle=null, muted=false;
  function init(){
    if(ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.35; master.connect(ctx.destination);
      startDrone(); startHeartbeat();
    }catch(e){}
  }
  function resume(){ if(!ctx) init(); if(ctx && ctx.state==='suspended') ctx.resume().catch(()=>{}); }
  function startDrone(){
    if(!ctx) return;
    const now = ctx.currentTime;
    const g = ctx.createGain(); g.gain.value = 0; g.connect(master);
    const filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=180; filter.Q.value=3; filter.connect(g);
    const o1 = ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=55;
    const o2 = ctx.createOscillator(); o2.type='sine'; o2.frequency.value=55.4;
    const o3 = ctx.createOscillator(); o3.type='sine'; o3.frequency.value=110.5;
    o1.connect(filter); o2.connect(filter); o3.connect(filter);
    o1.start(now); o2.start(now); o3.start(now);
    g.gain.linearRampToValueAtTime(0.14, now + 4);
    droneNodes = {g, o1, o2, o3, filter};
  }
  function startHeartbeat(){
    const beat = ()=>{
      if(!ctx || muted) return scheduleNext();
      const now = ctx.currentTime;
      const kick = (t, vol) => {
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(60, t);
        o.frequency.exponentialRampToValueAtTime(28, t+0.14);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t+0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.18);
        o.connect(g); g.connect(master); o.start(t); o.stop(t+0.2);
      };
      kick(now, 0.20); kick(now + 0.22, 0.14);
      scheduleNext();
    };
    const scheduleNext = ()=>{
      const bpm = 48 + Math.floor(Math.random()*6);
      heartbeatHandle = setTimeout(beat, (60/bpm)*1000);
    };
    scheduleNext();
  }
  function cue(name){
    if(!ctx || muted) return;
    const now = ctx.currentTime;
    switch(name){
      case 'click': tone(880, 0.03, 'triangle', 0.06); break;
      case 'page': noise(0.15, 0.08, 800); break;
      case 'stinger': [196, 246.94, 293.66].forEach((f,i)=>tone(f, 0.6, 'sine', 0.14, i*0.03)); break;
      case 'corrupt': tone(110, 0.5, 'sawtooth', 0.12, 0, 55); tone(82.4, 0.6, 'sine', 0.1, 0.05, 41); break;
      case 'mercy': [329.63, 392, 493.88, 659.25].forEach((f,i)=>tone(f, 0.5, 'sine', 0.09, i*0.07)); break;
      case 'reveal': tone(48, 1.5, 'sine', 0.22, 0, 24); tone(96, 1.2, 'triangle', 0.1, 0.1, 48); break;
      case 'right': tone(660, 0.09, 'triangle', 0.12, 0, 990); tone(990, 0.12, 'sine', 0.08, 0.05); break;
      case 'wrong': tone(180, 0.2, 'sawtooth', 0.1, 0, 90); break;
      case 'type': tone(1800 + Math.random()*400, 0.012, 'square', 0.012); break;
      case 'whisper': tone(220, 0.3, 'sine', 0.05, 0, 180); tone(440, 0.3, 'sine', 0.035, 0.05, 380); break;
    }
  }
  function tone(freq, dur, type, vol, delay, glide){
    if(!ctx) return;
    const now = ctx.currentTime + (delay||0);
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, now);
    if(glide) o.frequency.exponentialRampToValueAtTime(glide, now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol||0.05, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(master);
    o.start(now); o.stop(now + dur + 0.03);
  }
  function noise(dur, vol, cutoff){
    if(!ctx) return;
    const now = ctx.currentTime;
    const bs = ctx.sampleRate * dur;
    const buffer = ctx.createBuffer(1, bs, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bs;i++) data[i] = Math.random()*2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value = cutoff||1000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol||0.05, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(filter); filter.connect(g); g.connect(master);
    src.start(now); src.stop(now + dur + 0.05);
  }
  function setCorruption(level){
    if(!ctx || !droneNodes) return;
    const target = 0.14 + level * 0.35;
    droneNodes.g.gain.linearRampToValueAtTime(target, ctx.currentTime + 2);
    droneNodes.filter.frequency.linearRampToValueAtTime(180 + level * 900, ctx.currentTime + 2);
  }
  function toggleMute(){ muted = !muted; if(master) master.gain.value = muted ? 0 : 0.35; return muted; }
  return { init, resume, cue, setCorruption, toggleMute, isMuted: ()=>muted };
})();

const SAVE_KEY = 'syntax_excision_v1';
const DEFAULT = {
  szpans:0, reputation:0, intel:0, scars:0, purges:0, mercy:0, corruption:0,

  heraldSeen:[], codex:[], started:false, ended:false,
  voiceCracksSeen:0, endedAs:null, knownByVoice:false
};
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT));
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), JSON.parse(raw));
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT)); }
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function softWipe(){
  // Preserve playthrough count when starting fresh
  const pt = S.playthrough;
  const herald = S.heraldSeen.filter(x=>false); // fresh herald
  S = JSON.parse(JSON.stringify(DEFAULT));
  S.playthrough = pt;
  S.heraldSeen = herald;
  save();
}
function hardWipe(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  S = JSON.parse(JSON.stringify(DEFAULT));
}

function heraldCue(key){
  const pool = HERALD_LINES[key];
  if(!pool) return null;
  const seen = S.heraldSeen || [];
  const available = pool.filter(l => !seen.includes(l.text));
  const line = available.length ? available[0] : pool[Math.floor(Math.random()*pool.length)];
  S.heraldSeen = [...seen, line.text].slice(-40);
  save();
  return line;
}
async function showHerald(key, duration=3200){
  const line = heraldCue(key);
  if(!line) return;
  const el = document.createElement('div');
  el.className = 'herald';
  el.innerHTML = `
    <div class="herald-avatar">🦊</div>
    <div class="herald-card">
      <div class="herald-name">Ember · Herald of Curiosity</div>
      <div class="herald-text">${line.text}</div>
    </div>
  `;
  document.getElementById('stage').appendChild(el);
  await new Promise(r => setTimeout(r, duration));
  el.style.transition = 'opacity .5s ease, transform .5s ease';
  el.style.opacity = '0'; el.style.transform = 'translateY(8px)';
  await new Promise(r => setTimeout(r, 500));
  el.remove();
}

let typingHandle = null;
function clearScreen(){ if(typingHandle){ clearInterval(typingHandle); typingHandle = null; } host.innerHTML = ''; }
function setLetterbox(open){ lbTop.classList.toggle('open', open); lbBot.classList.toggle('open', open); }

function typeInto(el, text, speed=22){
  return new Promise(resolve=>{
    el.innerHTML = '';
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor'; cursor.innerHTML = '&nbsp;';
    const span = document.createElement('span');
    el.appendChild(span); el.appendChild(cursor);
    typingHandle = setInterval(()=>{
      if(i >= text.length){
        clearInterval(typingHandle); typingHandle = null;
        cursor.remove(); resolve(); return;
      }
      span.textContent += text[i++];
      if(i % 3 === 0) Audio.cue('type');
    }, speed);
  });
}
function waitForTap(screenEl){
  return new Promise(resolve=>{
    const handler = (e) => {
      if(e.target.closest('button') && !e.target.closest('.tap-anywhere')) return;
      screenEl.removeEventListener('click', handler);
      resolve();
    };
    screenEl.addEventListener('click', handler);
  });
}

async function scene({chapter,title,portrait,portraitColor,speaker,lines,choices,noTap=false,tone}){
  const screen = document.createElement('div');
  screen.className = 'screen';

  if(chapter || title){
    const header = document.createElement('div');
    header.style.cssText = `position:absolute;top:calc(var(--lb) + 10px);left:16px;right:16px;z-index:8;text-align:center;`;
    header.innerHTML = `
      ${chapter ? `<div class="small-caps" style="margin-bottom:5px">${chapter}</div>` : ''}
      ${title ? `<div class="title-lg" style="color:var(--bone)">${title}</div>` : ''}
    `;
    screen.appendChild(header);
  }
  if(portrait){
    const p = document.createElement('div');
    p.className = 'portrait' + (tone ? ' ' + tone : '');
    p.style.color = portraitColor || '#c9a961';
    p.textContent = portrait;
    screen.appendChild(p);
  }
  const sub = document.createElement('div');
  sub.className = 'subtitle';
  sub.innerHTML = `
    ${speaker ? `<span class="speaker" style="color:${portraitColor || 'var(--gold)'}">${speaker}</span>` : ''}
    <div class="subtitle-text" id="subText"></div>
  `;
  screen.appendChild(sub);

  host.innerHTML = '';
  host.appendChild(screen);
  requestAnimationFrame(()=>screen.classList.add('on'));

  const subText = sub.querySelector('#subText');
  for(let i=0;i<lines.length;i++){
    if(i > 0) await waitForTap(screen);
    await typeInto(subText, lines[i], 22);
  }
  if(choices && choices.length){
    const veil = document.createElement('div');
    veil.className = 'choices-veil';
    veil.innerHTML = choices.map((c,i)=>`
      <button class="choice ${c.danger ? 'danger' : ''}" data-i="${i}">
        ${c.tone ? `<span class="tone">${c.tone}</span>` : ''}
        ${c.text}
        ${c.sub ? `<span class="sub">${c.sub}</span>` : ''}
      </button>
    `).join('');
    screen.appendChild(veil);
    Audio.cue('stinger');
    return new Promise(resolve=>{
      veil.addEventListener('click', e=>{
        const b = e.target.closest('.choice');
        if(!b) return;
        Audio.cue('click');
        resolve({ choice: choices[+b.dataset.i], index: +b.dataset.i });
      });
    });
  }
  if(!noTap){
    const hint = document.createElement('div');
    hint.className = 'tap-hint';
    hint.textContent = '▸ tap to continue ▸';
    screen.appendChild(hint);
    await waitForTap(screen);
    Audio.cue('page');
  }
  return {};
}

        <span class="ih-prog" id="ihProg">01 / ${String(questions.length).padStart(2,'0')}</span>

      <div class="inter-timer" id="ihTimerWrap" style="display:none"><i id="ihTimer" style="width:100%"></i></div>
      <div class="inter-doc">
        <div class="speaker-name" id="ihSpeaker">${target}</div>
        <div class="question" id="ihQuestion"></div>
        <div class="interject" id="ihInterject" style="display:none"></div>
      </div>
      <div class="inter-choices" id="ihChoices"></div>
      <div class="inter-verdict" id="ihVerdict" style="display:none"></div>
      <button class="btn primary" id="ihNext" style="display:none;margin-top:4px">Continue</button>
    </div>
  `;
  host.innerHTML = '';
  host.appendChild(screen);
  requestAnimationFrame(()=>screen.classList.add('on'));

  const qEl = screen.querySelector('#ihQuestion');
  const cEl = screen.querySelector('#ihChoices');
  const vEl = screen.querySelector('#ihVerdict');
  const pEl = screen.querySelector('#ihProg');
  const nEl = screen.querySelector('#ihNext');
  const ij = screen.querySelector('#ihInterject');
  const timerWrap = screen.querySelector('#ihTimerWrap');
  const timerEl = screen.querySelector('#ihTimer');

  let correct = 0, wrong = 0;

  for(let i=0;i<questions.length;i++){
    const q = questions[i];
    pEl.textContent = `${String(i+1).padStart(2,'0')} / ${String(questions.length).padStart(2,'0')}`;
    qEl.textContent = q.q;
    ij.style.display = 'none'; ij.textContent = '';

    if(i > 0 && Math.random() < 0.5){
      ij.style.display = 'block';
      const lines = [
        `The ${family.don} watches you. It has not blinked.`,
        `A door closes somewhere behind you. You do not turn.`,
        `The lights flicker. The ${family.name} is doing something.`,
        `You feel the room get smaller. You do not react.`,
        `The ${family.don} speaks a word you do not understand. The room ignores it.`,
        `Something in the ${family.name}'s posture has changed. You do not know what.`
      ];
      ij.textContent = lines[Math.floor(Math.random()*lines.length)];
    }

    let timerHandle = null;
    let timedOut = false;
    if(timerSeconds && i >= 2){
      timerWrap.style.display = 'block';
      timerEl.style.transition = 'none';
      timerEl.style.width = '100%';
      void timerEl.offsetWidth;
      timerEl.style.transition = `width ${timerSeconds}s linear`;
      timerEl.style.width = '0%';
      timerHandle = setTimeout(()=>{
        timedOut = true;
        cEl.dispatchEvent(new CustomEvent('timeout'));
      }, timerSeconds * 1000);
    } else {
      timerWrap.style.display = 'none';
    }

    cEl.innerHTML = q.a.map((a,idx)=>`<button class="inter-choice" data-i="${idx}">${a}</button>`).join('');

    const picked = await new Promise(resolve=>{
      const onClick = (e) => {
        const b = e.target.closest('.inter-choice');
        if(!b || b.disabled) return;
        cEl.removeEventListener('click', onClick);
        resolve(+b.dataset.i);
      };
      cEl.addEventListener('click', onClick);
      cEl.addEventListener('timeout', ()=>{
        cEl.removeEventListener('click', onClick);
        resolve(-1);
      }, {once:true});
    });
    if(timerHandle) clearTimeout(timerHandle);
    timerWrap.style.display = 'none';

    const isRight = picked === q.correct;
    [...cEl.children].forEach((b,idx)=>{
      b.disabled = true;
      if(idx === q.correct) b.classList.add(isRight ? 'right' : 'reveal');
      else if(idx === picked) b.classList.add('wrong');
    });

    if(isRight){ correct++; Audio.cue('right'); } else { wrong++; Audio.cue('wrong'); }

    vEl.style.display = 'block';
    vEl.textContent = isRight
      ? (q.rightText || `You press. The ${family.name} flinch.`)
      : (timedOut
        ? `Too slow. The ${family.don} marks the silence as an answer.`
        : (q.wrongText || `You press wrong. The ${family.name} marks you.`));

    nEl.style.display = 'inline-flex';
    await new Promise(resolve=>{
      nEl.addEventListener('click', function h(){
        nEl.removeEventListener('click', h);
        Audio.cue('click');
        resolve();
      });
    });
    vEl.style.display = 'none'; nEl.style.display = 'none';
  }
  return { correct, wrong };
}

function codexEntriesFor(famId){
  return CODEX[famId] || [];
}
function isCodexUnlocked(entryId){
  return S.codex.includes(entryId);
}
function unlockCodex(entryIds){
  let added = false;
  for(const id of entryIds){
    if(!S.codex.includes(id)){ S.codex.push(id); added = true; }
  }
  if(added) save();
  return added;
}

async function runLoop(){
  while(S.turn < 12){
    const alive = Object.entries(S.families).filter(([k,v])=>v.status==='alive');
    if(alive.length === 0) break;

    const mapChoice = await mapScreen();

    if(mapChoice.codex){
      await codexScreen();
      continue;
    }

    if(mapChoice.close){
      const confirmEnd = await scene({
        portrait:'🎩', portraitColor:'#8b1a1a', tone:'cold',
        speaker:'The Voice',
        lines:['You are not finished. There are still families in her head.'],
        choices:[
          { text:'I need to stop.', sub:'The Voice is silent for a long moment.', tone:'Halt' },
          { text:'I will continue.', sub:'The Voice says nothing. The work resumes.', tone:'Continue' }
        ]
      });
      if(confirmEnd.choice.tone === 'Halt') break;
      continue;
    }

    const key = mapChoice.target;
    const f = FAMILIES[key];
    if(S.families[key].status === 'dead') continue;

    const proceed = await dossierScreen(key);
    if(!proceed) continue;

    const timerForThis = S.turn >= 4 ? 18 : null;
    const result = await interrogation({
      target: f.don, family: f,
      questions: QUESTIONS[key],
      timerSeconds: timerForThis
    });

    S.intel += result.correct;
    S.scars += result.wrong;
    save(); updateTopBar();

    // Unlock codex entries tied to this family's intel level
    const famCodex = CODEX[key] || [];
    const intelNow = (S.families[key].intel || 0) + 1;
    if(intelNow >= 1 && famCodex[0]) unlockCodex([famCodex[0].id]);
    if(intelNow >= 2 && famCodex[1]) unlockCodex([famCodex[1].id]);
    if(intelNow >= 3 && famCodex[2]) unlockCodex([famCodex[2].id]);

    const won = result.correct > result.wrong;
    const drew = result.correct === result.wrong;

    if(won){
      await scene({
        portrait: f.sigil, portraitColor: f.color, tone: f.tone,
        speaker: f.don,
        lines: [`"You have me. What do you want?"`, `You do not answer. You have learned what you came to learn.`]
      });

      const { choice } = await scene({
        portrait:'🗡️', portraitColor:'#c9a961', tone:'precise',
        speaker:'The Choice',
        lines:['PURGE. Burn them out.', 'RECLAIM. Absorb them.', 'Which?'],
        choices:[
          { text:'PURGE.', sub:'Clean. Permanent. Rewarded.', tone:'Destroy', danger:true },
          { text:'RECLAIM.', sub:'Slow. Forgetful. Preserved.', tone:'Absorb' }
        ]
      });

      if(choice.tone === 'Destroy'){
        S.purges++; S.reputation -= 15; spendSzpans(180);
        Audio.cue('corrupt');
        await scene({
          portrait:'🔥', portraitColor:'#8b1a1a', tone:'quiet',
          speaker:'',
          lines:[
            `The ${f.name} burn. They do not scream. They simply stop being.`,
            `The szpan counter rises. You do not look at it.`,
            `Somewhere in her cortex, a district goes dark.`
          ]
        });
        await showHerald('afterPurge');
      } else {
        S.mercy++; S.reputation += 15; spendSzpans(120);
        Audio.cue('mercy');
        await scene({
          portrait:'🌿', portraitColor:'#39ff14', tone:'gentle',
          speaker:'',
          lines:[
            `The ${f.name} do not die. They fold into you.`,
            `You do not understand all of them. Some of them do not understand themselves.`,
            `But they are yours now. And you are theirs.`
          ]
        });
        await showHerald('afterReclaim');
      }
      S.families[key].status = 'dead';
      save(); updateTopBar();

      // Consigliere speaks
      await showConsigliere(key);
      // Reactions
      await showReactions(key);

    } else if(drew){
      await scene({
        portrait: f.sigil, portraitColor: f.color, tone: f.tone,
        speaker: f.don,
        lines: [`"You are not strong enough to break me. Not yet."`, `The ${f.name} will hold. For now.`]
      });
      spendSzpans(40);
      S.families[key].intel = intelNow;
      save();
    } else {
      Audio.cue('wrong');
      await scene({
        portrait:'🩸', portraitColor:'#8b1a1a', tone:'quiet',
        speaker:'Scar',
        lines:[
          `You pressed wrong. The ${f.name} marked you.`,
          `You do not know where the mark is. You will find out later.`
        ]
      });
      S.families[key].intel = intelNow;
      save(); updateTopBar();
      await showHerald('afterWound');
    }

    S.turn++;
    save(); updateTopBar();

    // Voice identity crack at turn 5
    if(S.turn === 5 && S.voiceCracksSeen === 0){
      await voiceCrack();
      unlockCodex(['self_voice','self_szpan']);
    }

    // Herald path reactions
    if(S.purges >= 3 && S.purges - S.mercy >= 2 && S.turn % 2 === 0) await showHerald('purgePath');
    else if(S.mercy >= 3 && S.mercy - S.purges >= 2 && S.turn % 2 === 0) await showHerald('mercyPath');

    // Voice check-ins
    if([2,4,6,8].includes(S.turn)) await voiceCheck();

    // Late game herald
    if(S.turn === 6) await showHerald('lateGame');
    if(S.turn === 10) await showHerald('final');

    // Corruption threshold
    if(S.corruption >= 100){
      await scene({
        portrait:'💀', portraitColor:'#8b1a1a', tone:'quiet',
        speaker:'',
        lines:[
          'The counter has reached its limit.',
          'You did not notice it filling.',
          'It has been filling since the first cut.',
          'There is nothing left to spend.'
        ]
      });
      break;
    }
  }

  const ending = S.purges >= 4 ? 'A' : S.mercy >= 4 ? 'B' : 'C';
  await finalConfession();
  await runEnding(ending);
}

/* ============================================================
   ENDINGS
   ============================================================ */
async function runEnding(ending){
  Audio.cue('reveal');
  await storyCard({ chapter:'The End', title:'The Gardener Was Never Real', epi:' ' });

  if(ending === 'A'){
    await scene({
      portrait:'💀', portraitColor:'#8b1a1a', tone:'quiet',
      speaker:'The Brain',
      lines:[
        'You have burned every family.',
        'You have switched off every belief.',
        'You have cleaned the garden.',
        'On a Tuesday morning, at 3:47 AM, a woman stops mid-sentence.',
        'The word she stops on is "therefore."',
        'She does not finish the sentence. She never will.',
        'She is flatlined.',
        'The garden is clean. The gardener has done their job perfectly.'
      ]
    });
  } else if(ending === 'B'){
    await scene({
      portrait:'🌿', portraitColor:'#39ff14', tone:'gentle',
      speaker:'The Brain',
      lines:[
        'You have absorbed the families. All of them.',
        'You do not understand them all. Some of them do not understand themselves.',
        'But they are yours now. And you are theirs.',
        'On a Tuesday morning, at 3:47 AM, a woman stops mid-sentence.',
        'The word she stops on is "therefore."',
        'She finishes it.',
        'The sentence is not clean. It is not perfect. But it is hers.',
        'She is alive.'
      ]
    });
  } else {
    await scene({
      portrait:'🕯️', portraitColor:'#c9a961', tone:'quiet',
      speaker:'The Brain',
      lines:[
        'You have conquered some. You have spared some.',
        'You have left the garden wild. And wild is not clean. And wild is not safe.',
        'But wild is alive.',
        'On a Tuesday morning, at 3:47 AM, a woman stops mid-sentence.',
        'The word she stops on is "therefore."',
        'She has not finished it.',
        'She has not stopped either.',
        'She is between. She is breathing. Someone should sit with her.'
      ]
    });
  }

  await new Promise(r=>setTimeout(r, 1000));
  $('#endingScrim').classList.add('on');

  const finalText = ending === 'A'
    ? 'The garden is clean. The gardener rests. There is no brain left to garden.'
    : ending === 'B'
    ? 'The garden is wild. The gardener puts down the shears. There is a person here, and she is breathing.'
    : 'You were not the gardener. You were the refusal. The brain is dying. She is still in here. Stay with her.';

  $('#endText').textContent = finalText;
  await new Promise(r=>setTimeout(r, 1400));

  const playthroughLabel = S.playthrough >= 2
    ? `<div style="margin-top:10px;color:#e77;font-size:10px;letter-spacing:.24em">This was your ${S.playthrough === 1 ? 'first' : 'second'} return. She remembers.</div>`
    : '';

  $('#endAttr').innerHTML = `
    <div><strong>${S.szpans.toLocaleString()}</strong> szpans spent</div>
    <div><strong>${S.purges}</strong> purged · <strong>${S.mercy}</strong> reclaimed</div>
    <div><strong>${S.intel}</strong> intel · <strong>${S.scars}</strong> scars</div>
    <div><strong>${S.codex.length}</strong> codex entries recovered</div>
    ${playthroughLabel}
    <div style="margin-top:16px;opacity:.5">Syntax of Excision · v1.1</div>
    <div style="margin-top:14px">
      <button class="btn ghost" id="endRestart" style="padding:10px 18px;font-size:10px">Begin Again</button>
    </div>
  `;
  document.getElementById('endRestart').addEventListener('click', ()=>{
    // Preserve playthrough
    const pt = S.playthrough;
    hardWipe();
    S.playthrough = pt + 1;
    save();
    location.reload();
  });

  S.ended = true;
  S.endedAs = ending;
  save();
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  setLetterbox(true);
  showTopBar(false);

  const unlockAudio = ()=>{
    Audio.init(); Audio.resume();
    document.removeEventListener('pointerdown', unlockAudio);
    document.removeEventListener('keydown', unlockAudio);
  };
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);

  const action = await mainMenu();

  if(action === 'continue'){
    if(S.ended){
      const pt = S.playthrough;
      hardWipe();
      S.playthrough = pt + 1;
      save();
      await campaign();
    } else if(!S.started){
      await campaign();
    } else {
      showTopBar(true);
      updateTopBar();
      await storyCard({
        chapter:'Resume',
        title:'The Work Continues',
        epi:'You have been doing this for longer than you remember.'
      });
      await runLoop();
    }
  } else {
    await campaign();
  }
}

setTimeout(()=>{
  boot().catch(err=>{
    console.error(err);
    document.body.innerHTML = `<pre style="color:#e88;font-family:monospace;padding:20px;font-size:12px;white-space:pre-wrap">${err.message}\n\n${err.stack}</pre>`;
  });
}, 300);
</script>
