<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#06060b">
<title>Bert Kart – LeonLink Kids</title><meta name="description" content="Bert Kart: a free 3D kart racing game for kids aged 10-12. Race three tracks, upgrade your kart and beat Ghost Bert. No ads, no logins, no chat.">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#06060b;font-family:system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:linear-gradient(#06060bcc,#0b1030ee);z-index:5;overflow:auto}
.panel[hidden],#hud[hidden],#pad[hidden]{display:none}
h1{margin:0;font-size:clamp(2.2rem,8vw,3.6rem);letter-spacing:2px}h1 b{color:#22f0ff}.tag{margin:0;opacity:.85}
.top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:6;pointer-events:none}.top>*{pointer-events:auto}
.pill{background:#0008;border:2px solid #22f0ff55;border-radius:999px;padding:8px 14px;font-weight:800;color:#fff;font-size:1rem;text-decoration:none}
#tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;width:min(640px,100%)}
.trk{background:#14183a;border:3px solid #22f0ff;border-radius:18px;color:#fff;padding:16px;display:flex;flex-direction:column;gap:4px;font-size:1.1rem;cursor:pointer}.trk .te{font-size:2.6rem}.trk.lock{opacity:.55;border-color:#555}
.big{background:#22f0ff;color:#06060b;border:0;border-radius:999px;padding:14px 30px;font-weight:900;font-size:1.2rem;cursor:pointer}.ghost{background:transparent;color:#22f0ff;border:2px solid #22f0ff}
.up{display:flex;align-items:center;gap:12px;background:#14183a;border-radius:16px;padding:12px;width:min(480px,100%)}.up>div{flex:1}.ue{font-size:2rem}.lv{color:#ffd34d}.up button{background:#ffd34d;border:0;border-radius:999px;padding:10px 14px;font-weight:900}.up button:disabled{opacity:.4}
#paint{display:flex;gap:10px}.sw{width:44px;height:44px;border-radius:50%;border:3px solid #fff4}.sw.sel{border-color:#fff;transform:scale(1.15)}
#hud{position:fixed;top:60px;left:12px;z-index:4;display:flex;flex-direction:column;gap:6px;font-weight:900;text-shadow:0 2px 4px #000}#hud div{background:#0007;border-radius:12px;padding:6px 12px}
#count{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:6rem;font-weight:900;color:#ffd34d;text-shadow:0 6px 0 #0008;z-index:4;pointer-events:none}
#boostbar,#offroad{position:fixed;top:120px;right:12px;z-index:4;padding:6px 12px;border-radius:12px;font-weight:900;opacity:0;transition:opacity .2s}#boostbar{background:#ff7a00}#offroad{background:#5cbf4a;top:160px}
#pad{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;z-index:4;pointer-events:none}#pad>div{display:flex;gap:12px}
#pad button{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:3px solid #fff8;background:#0009;color:#fff;font-size:2rem;font-weight:900}#pad button.on{background:#22f0ff;color:#06060b}#pad .go{width:96px;height:96px;background:#16a34a}
#bert{position:fixed;right:10px;bottom:120px;width:84px;background:none;border:0;z-index:7;cursor:pointer;padding:0;transition:transform .3s}#bert .bertsvg{width:84px;height:112px;animation:bob 2.4s ease-in-out infinite}
#bert .bubble{position:absolute;right:88px;bottom:40px;width:min(260px,60vw);background:#fff;color:#18181b;border-radius:16px;padding:10px 12px;font-size:1rem;font-weight:700;text-align:left;opacity:0;transform:scale(.8);transition:.25s;pointer-events:none}
#bert.show .bubble{opacity:1;transform:none}.b-talk,.b-spark{display:none}#bert.talking .b-talk{display:inline;transform-box:fill-box;transform-origin:center;animation:talk .18s infinite alternate}#bert.talking .b-smile{display:none}#bert.boing .b-spark{display:inline}#bert.boing{animation:boing .6s}
@keyframes bob{50%{transform:translateY(-4px) rotate(2deg)}}@keyframes talk{to{transform:scaleY(.4)}}@keyframes boing{30%{transform:scale(1.2,.8)}60%{transform:scale(.9,1.15)}}
.pb{background:#ffd34d;color:#000;border-radius:6px;padding:2px 6px;font-size:.8rem}#results p,#pause p{margin:4px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body>
