<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pip's Sticky-Note Chase</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#bfe6ff,#fff7d6);font-family:system-ui,sans-serif;touch-action:manipulation;user-select:none}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;font-size:26px;font-weight:800;color:#18181B;z-index:5}
.note{position:absolute;width:84px;height:84px;border-radius:6px;box-shadow:3px 4px 8px #0003;display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer}
#pip{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:70px;transition:transform .15s}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;background:#fff8;text-align:center}
button{font-size:34px;padding:18px 40px;border:0;border-radius:40px;background:#2A78D6;color:#fff;font-weight:800;box-shadow:0 6px 0 #1a4f90}
.pop{position:absolute;font-size:34px;font-weight:900;color:#008300;pointer-events:none;animation:up .7s forwards}@keyframes up{to{transform:translateY(-60px);opacity:0}}</style></head><body>
<div id="hud"><span>📝 <b id="s">0</b></span><span id="stars"></span></div>
<div id="pip">📄🙂</div>
<div id="start"><div style="font-size:90px">📄🙂✏️</div><h1>Pip's Sticky-Note Chase</h1><p style="font-size:22px">Tap the flying notes!<br>Help Pip remember everything.</p><button id="go">PLAY ▶</button></div>
<script>
const cols=['#ffe66d','#ff9fb2','#9be7a0','#9fd3ff','#ffc078'],icons=['⭐','❤️','🐞','🎲','🏠','🌙','🍪','🎵'];
let score=0,on=false,t;const S=document.getElementById('s'),pip=document.getElementById('pip');
function beep(f){try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.stop(a.currentTime+.3)}catch(e){}}
function spawn(){if(!on)return;const n=document.createElement('div');n.className='note';n.style.background=cols[Math.random()*5|0];n.textContent=icons[Math.random()*8|0];
let x=Math.random()*(innerWidth-90),y=innerHeight,vx=(Math.random()-.5)*1.5,vy=-(1.2+Math.random()*1.3+Math.min(score,40)/40),r=0;
n.style.left=x+'px';n.style.top=y+'px';document.body.appendChild(n);
const step=()=>{if(!n.isConnected)return;x+=vx+Math.sin(y/60);y+=vy;r+=vx;n.style.left=x+'px';n.style.top=y+'px';n.style.transform='rotate('+r+'deg)';if(y<-100)n.remove();else requestAnimationFrame(step)};step();
n.onpointerdown=e=>{score++;S.textContent=score;beep(500+score*10);const p=document.createElement('div');p.className='pop';p.textContent='+1';p.style.left=x+20+'px';p.style.top=y+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),700);n.remove();
pip.style.transform='translateX(-50%) scale(1.25)';setTimeout(()=>pip.style.transform='translateX(-50%)',150);
document.getElementById('stars').textContent='⭐'.repeat(Math.min(5,score/10|0));if(score%10==0){pip.textContent='📄😄🎉';beep(900);setTimeout(()=>pip.textContent='📄🙂',1200)}};
t=setTimeout(spawn,Math.max(450,1100-score*12))}
document.getElementById('go').onclick=()=>{document.getElementById('start').remove();on=true;spawn()};
</script></body></html>
