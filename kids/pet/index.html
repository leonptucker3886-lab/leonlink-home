<title>LeonLink Kids – Pet</title><link rel="stylesheet" href="style.css"><style>#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(#141428,#06060b);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:system-ui,sans-serif;text-align:center;transition:opacity .6s}

.splogo{width:120px;height:120px;font-size:96px;animation:spspin .8s ease-out both}
@keyframes spspin{from{transform:rotateY(0) scale(.3);opacity:0}to{transform:rotateY(720deg) scale(1);opacity:1}}
.spl1,.spl2,.spl3{opacity:0;animation:spin2 .8s ease-out forwards}
.spl1{font-size:28px;font-weight:800;margin-top:18px;letter-spacing:2px;animation-delay:.5s}.spl1 b{color:#22f0ff}

.spl3{font-size:64px;font-weight:900;margin-top:22px;letter-spacing:6px;background:linear-gradient(90deg,#22e5ff,#ff3fb4);-webkit-background-clip:text;background-clip:text;color:transparent;animation-delay:1.3s}
@keyframes spin2{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.spbar{width:60%;max-width:320px;height:10px;border-radius:5px;background:#ffffff22;margin-top:34px;overflow:hidden}
.spbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22e5ff,#ff3fb4);animation:spfill 2.4s linear forwards}
@keyframes spfill{to{width:100%}}</style></head><body>
