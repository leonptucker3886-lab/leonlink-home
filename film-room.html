<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Film Room — LeonLink traffic</title>
<link rel="icon" href="/favicon.png">
<style>
:root{--bg:#06060b;--cy:#22f0ff;--gold:#c9a227;--tx:#f2f2f5;--dim:#8a8a96}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"DM Sans",system-ui,sans-serif;padding:20px;max-width:1060px;margin:0 auto;min-height:100vh}
.h{display:flex;align-items:center;gap:14px;margin:8px 0 4px}
.h img{width:44px;height:44px}
.h h1{font-size:34px;letter-spacing:.06em}
.h h1 span{color:var(--cy)}
.live{width:10px;height:10px;border-radius:50%;background:#37c25e;box-shadow:0 0 10px #37c25e;animation:bl 2s infinite}
@keyframes bl{50%{opacity:.4}}
.sub{color:var(--dim);margin-bottom:22px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.card{background:#0c0c14;border:1px solid #1c1c28;border-radius:14px;padding:18px}
.card .n{font-size:42px;font-weight:800;color:var(--cy)}
.card .l{color:var(--dim);font-size:13px;letter-spacing:.08em;margin-top:4px}
.card.gold .n{color:var(--gold)}
.panel{background:#0c0c14;border:1px solid #1c1c28;border-radius:14px;padding:18px;margin-bottom:22px}
.panel h2{font-size:18px;letter-spacing:.06em;margin-bottom:14px}
.panel h2 span{color:var(--cy)}
canvas#chart{width:100%;height:220px;display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.row{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
.bar{margin:9px 0}
.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar .t b{color:var(--cy)}
.bar .tr{height:9px;background:#17171f;border-radius:5px;overflow:hidden}
.bar .f{height:100%;background:linear-gradient(90deg,#0e7f8f,var(--cy));border-radius:5px}
.empty{color:var(--dim);text-align:center;padding:40px 10px;font-size:17px}
.foot{color:var(--dim);font-size:12px;text-align:center;margin:26px 0 10px}
</style>
</head>
<body>
<div class="h"><img src="/img/logo-128.png" alt=""><h1>FILM <span>ROOM</span></h1><div class="live"></div></div>
<p class="sub">leonlink.net traffic · private</p>
<div id="app"><div class="empty">Loading the tape…</div></div>
<div class="foot" id="upd"></div>
<script>
const K=new URLSearchParams(location.search).get('k')||'';
async function load(){
  try{
    const r=await fetch('/api/stats?k='+encodeURIComponent(K));
    if(r.status===403){document.getElementById('app').innerHTML='<div class="empty">This film room needs its key. Add ?k=YOUR_KEY to the URL.</div>';return}
    const d=await r.json();render(d);
    document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){document.getElementById('app').innerHTML='<div class="empty">No tape yet. Views will show up here once tracking is live.</div>'}
}
function render(d){
  const days=Object.keys(d.perDay).sort();
  const today=days.length?days[days.length-1]:null;
  const topPage=d.pages.length?d.pages[0]:null;
  let s='<div class="cards">';
  s+='<div class="card"><div class="n">'+d.total+'</div><div class="l">VIEWS · 14 DAYS</div></div>';
  s+='<div class="card"><div class="n">'+(today?d.perDay[today]:0)+'</div><div class="l">TODAY</div></div>';
  s+='<div class="card gold"><div class="n" style="font-size:20px;word-break:break-all">'+(topPage?topPage[0]:'—')+'</div><div class="l">TOP PAGE'+(topPage?' · '+topPage[1]+' VIEWS':'')+'</div></div></div>';
  s+='<div class="panel"><h2>VIEWS <span>PER DAY</span></h2><canvas id="chart" width="960" height="220"></canvas></div>';
  s+='<div class="row"><div class="panel"><h2>TOP <span>PAGES</span></h2>'+bars(d.pages)+'</div>';
  s+='<div class="panel"><h2>TOP <span>REFERRERS</span></h2>'+bars(d.refs)+'</div></div>';
  document.getElementById('app').innerHTML=s;chart(days,d.perDay);
}
function bars(list){
  if(!list.length)return '<div class="empty">Nothing yet.</div>';
  const mx=list[0][1]||1;
  return list.map(x=>'<div class="bar"><div class="t"><span>'+esc(x[0])+'</span><b>'+x[1]+'</b></div><div class="tr"><div class="f" style="width:'+Math.round(x[1]/mx*100)+'%"></div></div></div>').join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function chart(days,perDay){
  const c=document.getElementById('chart');if(!c)return;const x=c.getContext('2d');
  const vals=days.map(d=>perDay[d]);const mx=Math.max(1,...vals);
  const W=c.width,H=c.height,pad=8,bw=(W-pad*2)/Math.max(1,days.length);
  x.clearRect(0,0,W,H);
  days.forEach((d,i)=>{
    const v=vals[i],bh=(H-46)*(v/mx),bx=pad+i*bw+bw*0.18,bwid=bw*0.64;
    const g=x.createLinearGradient(0,H-30-bh,0,H-30);
    g.addColorStop(0,'#22f0ff');g.addColorStop(1,'#0e5f6b');
    x.fillStyle=g;
    x.beginPath();x.roundRect(bx,H-30-bh,bwid,Math.max(2,bh),4);x.fill();
    x.fillStyle='#8a8a96';x.font='11px sans-serif';x.textAlign='center';
    x.fillText(d.slice(5),pad+i*bw+bw/2,H-10);
    if(v>0){x.fillStyle='#f2f2f5';x.font='bold 12px sans-serif';x.fillText(v,pad+i*bw+bw/2,H-36-bh)}
  });
}
load();setInterval(load,60000);
</script>
</body>
</html>
