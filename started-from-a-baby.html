<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Started From a Baby — Life Sim</title>
<meta name="description" content="A complete life simulator. Born a baby, die a legend — then play as your heir. Drugs, badges, thrones, sawdust: every life is different.">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="/favicon.png">
<style>
:root{--bg:#0b0f1a;--pan:#121828;--ink:#eef2ff;--mut:#8b95b3;--g:#39ff88;--c:#22f0ff;--p:#ff3dc8;--y:#ffe14d;--r:#ff5d5d;--line:#1e2a44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.hud{position:sticky;top:0;z-index:10;background:#0b0f1af2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}
.hud .row1{display:flex;align-items:center;gap:10px}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#22f0ff,#39ff88)}
.who{flex:1;min-width:0}
.who b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--mut)}
.money{font-weight:800;color:var(--g);font-size:15px;text-align:right}
.money small{display:block;color:var(--mut);font-weight:600;font-size:11px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--pan);color:var(--mut);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--c);color:#03222a;border-color:var(--c)}
main{flex:1;padding:14px;overflow-y:auto}
.screen{display:none}.screen.on{display:block}
.bars{display:grid;gap:8px;margin-bottom:14px}
.bar{display:flex;align-items:center;gap:10px}
.bar .ic{font-size:18px;width:26px;text-align:center}
.bar .nm{font-size:12px;font-weight:700;color:var(--mut);width:56px;letter-spacing:.02em}
.bar .tr{flex:1;height:12px;background:#1a2338;border-radius:7px;overflow:hidden}
.bar .fl{height:100%;border-radius:7px;transition:width .4s}
.bar .vl{font-size:12px;font-weight:800;width:34px;text-align:right}
.log{display:flex;flex-direction:column;gap:8px}
.ev{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.ev .yr{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.06em}
.ev.good{border-color:#1f5c38}.ev.bad{border-color:#5c2222}.ev.wild{border-color:#5c4a1f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:1px solid var(--line);background:var(--pan);border-radius:16px;padding:16px 10px;color:var(--ink);cursor:pointer;text-align:center}
.act{border-top:3px solid var(--ac,#22f0ff)}
.act b{font-size:14px;display:block}
.act small{color:var(--mut);font-size:11px}
.act:disabled{opacity:.35}
.act.wide{grid-column:1/-1}
.jobcard{background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.jobcard h3{margin:0 0 4px;font-size:18px}
.jobcard p{margin:4px 0;color:var(--mut);font-size:13px}
.jobcard .pay{color:var(--g);font-weight:800}
.jlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.jlist button{border:1px solid var(--line);background:#0e1424;color:var(--ink);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.jlist button b{display:block;font-size:15px}
.jlist button small{color:var(--mut)}
.jlist button:disabled{opacity:.4}
.agebar{position:sticky;bottom:0;background:#0b0f1af2;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
#ageBtn{width:100%;border:none;border-radius:18px;padding:18px;font-size:22px;font-weight:900;letter-spacing:.04em;background:linear-gradient(135deg,var(--g),var(--c));color:#04140a;cursor:pointer;box-shadow:0 6px 24px #39ff8844}
#ageBtn:active{transform:scale(.98)}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#04060acc;padding:18px}
.modal.on{display:flex}
.mbox{background:var(--pan);border:1px solid var(--line2,#2a3a5c);border-radius:22px;padding:24px 20px;max-width:440px;width:100%;max-height:86vh;overflow-y:auto;text-align:center}
.mbox h2{margin:0 0 8px;font-size:24px}
.mbox p{color:var(--mut);font-size:14px;line-height:1.6}
.mbox .big{font-size:52px}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.choices button{border:1px solid var(--line);background:#0e1424;color:var(--ink);border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
.choices button:hover{border-color:var(--c)}
.result{margin-top:14px;font-size:15px;line-height:1.6}
.dead{color:var(--r)}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--mut)}
.fam{display:flex;flex-direction:column;gap:8px}
.member{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.title-screen{text-align:center;padding:40px 20px}
.title-screen h1{font-size:clamp(2.2rem,10vw,3.4rem);margin:.3em 0;line-height:1.05}
.title-screen h1 em{font-style:normal;color:var(--g);text-shadow:0 0 24px #39ff8877}
.title-screen .kick{font-size:.75rem;letter-spacing:.24em;color:var(--y);font-weight:800}
#startBtn{margin-top:26px;border:none;border-radius:18px;padding:18px 44px;font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--g),var(--c));color:#04140a;cursor:pointer}
.feat{color:var(--mut);font-size:13px;line-height:1.9;margin-top:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#1a2338;border:1px solid var(--c);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;display:none}

.modal.on .mbox{animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal{background:#04060ad9;backdrop-filter:blur(4px)}
.mbox .big{font-size:30px;display:block;margin-bottom:4px;opacity:.9}
#ageBtn{transition:transform .1s}
#ageBtn.pulse{animation:apulse .5s ease}
@keyframes apulse{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.mutebtn{background:none;border:1px solid var(--line);border-radius:10px;color:var(--mut);font-size:16px;padding:6px 10px;cursor:pointer}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:100;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.ev{animation:slidein .3s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.deadtomb{font-size:64px;filter:grayscale(1)}

</style>
</head>
<body>
<div id="title" class="title-screen">
  <div class="kick">LEONLINK PRESENTS</div>
  <h1>Started<br>From a <em>Baby</em></h1>
  <p style="color:var(--mut)">One life. Every choice matters.<br>Die, and your heir carries the name.</p>
  <button id="startBtn">Be Born</button><div id="contWrap"></div>
  <div class="feat">baby → school → career → love → heirs → legacy<br>
  cop · dealer · woodworker · doctor · <b>emperor</b> · and 20 more fates<br>
  snake bites · lottery wins · prison · miracles · tragedy</div>
</div>

<div id="game" style="display:none;flex:1;flex-direction:column">
  <div class="hud">
    <div class="row1">
      <div class="avatar" id="hAv">👶</div>
      <div class="who"><b id="hName">—</b><span id="hSub">Age 0</span></div>
      <div class="money"><span id="hMoney">$0</span><small id="hGen">Gen 1</small></div><button class="mutebtn" id="muteBtn" title="Sound">♪</button>
    </div>
    <div class="tabs">
      <button data-tab="life" class="on">Life</button>
      <button data-tab="do">Do</button>
      <button data-tab="work">Work</button>
      <button data-tab="love">Love</button>
    </div>
  </div>
  <main>
    <div class="screen on" id="s-life">
      <div class="bars" id="bars"></div>
      <div class="log" id="log"></div>
    </div>
    <div class="screen" id="s-do"><div class="grid" id="acts"></div></div>
    <div class="screen" id="s-work"><div id="workbox"></div></div>
    <div class="screen" id="s-love"><div id="lovebox"></div></div>
  </main>
  <div class="agebar"><button id="ageBtn">AGE +1 →</button></div>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= UTIL ================= */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const fmt$=n=>{const neg=n<0;n=Math.abs(Math.round(n));let s=n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':''+n;return (neg?'-$':'$')+s;};
const MALE=['James','Marcus','Leo','Dre','Tommy','Kai','Malik','Rico','Sam','Theo','Jay','Chris','Dev','Tony','Ray'];
const FEMALE=['Maya','Zoe','Nia','Ava','Lena','Ruby','Ivy','Noor','Tiana','Gia','Wren','Alba','Suki','Demi','Rosa'];
const SURN=['Carter','Reyes','Okafor','Lindqvist','Marsh','Delacroix','Ashford','Vane','Kowalski','Rivers','Stone','Blackwood','Ferro','Quill','Holloway'];
const AV={baby:'👶',child:'🧒',teen:'🧑',adult:'🧔',senior:'🧓'};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200);}

/* ================= STATE ================= */
let S=null;
function newPerson(gen, surname, inherit){
  const male=Math.random()<0.5;
  const p={
    name:pick(male?MALE:FEMALE)+' '+surname, male,
    age:0, gen,
    health:R(70,95), happy:R(60,90), smarts:R(20,80), looks:R(20,80), fit:R(30,80),
    karma:R(40,60), spirit:R(20,60), fame:0, street:0,
    money:inherit||0, edu:'none', eduYears:0,
    job:null, jobYears:0, heat:0, prison:0,
    partner:null, kids:[], pets:[],
    addicted:false, inCollege:false,
    alive:true, cause:''
  };
  return p;
}
function newGame(){
  const surname=pick(SURN);
  S={surname, gen:1, p:newPerson(1,surname,0), log:[], peak:0, legends:[], fired:{}};
  log(`👶 <b>${S.p.name}</b> is born. The ${surname} dynasty begins.`,'wild');
  show('game'); render();
}
function log(html, cls){
  S.log.unshift({age:S.p.age, html, cls:cls||''});
  if(S.log.length>60)S.log.pop();
}

/* ================= UI ================= */
const BARS=[['health','Health','#ff5d5d'],['happy','Happy','#ffe14d'],['smarts','Smarts','#22f0ff'],['looks','Looks','#ff3dc8'],['fit','Fit','#39ff88'],['karma','Karma','#b48cff'],['spirit','Spirit','#ffd9a0']];
function stage(){const a=S.p.age;return a<3?'baby':a<13?'child':a<20?'teen':a<60?'adult':'senior';}
function render(){
  const p=S.p;
  const _ini=p.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const _av=document.getElementById('hAv');_av.textContent=_ini;
  _av.style.background=p.prison>0?'linear-gradient(135deg,#555,#222)':({baby:'linear-gradient(135deg,#22f0ff,#39ff88)',child:'linear-gradient(135deg,#39ff88,#ffe14d)',teen:'linear-gradient(135deg,#ff3dc8,#b48cff)',adult:'linear-gradient(135deg,#22f0ff,#7a5cff)',senior:'linear-gradient(135deg,#b48cff,#ff9f1c)'})[stage()];
  _av.title=p.prison>0?'In prison':stage();
  document.getElementById('hName').textContent=p.name+(p.prison>0?' (in prison)':'');
  document.getElementById('hSub').textContent=`Age ${p.age} · ${p.job?p.job.title:'Unemployed'}`+(p.partner?` · 💘 ${p.partner.name.split(' ')[0]}`:'');
  document.getElementById('hMoney').textContent=fmt$(p.money);
  document.getElementById('hGen').textContent=`Gen ${S.gen} · House ${S.surname}`;
  document.getElementById('bars').innerHTML=BARS.map(([k,nm,c])=>
    `<div class="bar"><span class="nm">${nm}</span><div class="tr"><div class="fl" style="width:${clamp(Math.round(p[k]))}%;background:${c}"></div></div><span class="vl">${Math.round(clamp(p[k]))}</span></div>`).join('')
    +`<div class="bar"><span class="nm">Fame</span><div class="tr"><div class="fl" style="width:${clamp(Math.round(p.fame))}%;background:#fff"></div></div><span class="vl">${Math.round(clamp(p.fame))}</span></div>`
    +(p.street>0?`<div class="bar"><span class="nm">Street</span><div class="tr"><div class="fl" style="width:${clamp(Math.round(p.street))}%;background:#ff9f1c"></div></div><span class="vl">${Math.round(clamp(p.street))}</span></div>`:'');
  document.getElementById('log').innerHTML=S.log.map(e=>`<div class="ev ${e.cls}"><div class="yr">AGE ${e.age}</div>${e.html}</div>`).join('');
  renderActs(); renderWork(); renderLove();
}
function show(id){
  document.getElementById('title').style.display='none';
  const g=document.getElementById('game'); g.style.display='flex';
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+b.dataset.tab).classList.add('on');
});
</script>
<script>
"use strict";
/* ================= ACTIONS ================= */
function addAct(list,e,t,sub,fn,ok){list.push({e,t,sub,fn,ok:ok===undefined?true:ok});}
function renderActs(){
  const p=S.p, L=[];
  const locked=p.age<6, teen=p.age>=6;
  addAct(L,'📚','Study','+smarts',()=>{p.smarts=clamp(p.smarts+R(2,6));p.happy=clamp(p.happy-R(1,4));p.karma=clamp(p.karma+1);return 'Hit the books.';},teen);
  addAct(L,'🏋️','Work out','+fitness',()=>{p.fit=clamp(p.fit+R(3,7));p.health=clamp(p.health+R(1,4));p.looks=clamp(p.looks+R(0,3));p.happy=clamp(p.happy+R(0,3));return 'Gym session crushed.';},p.age>=8);
  addAct(L,'🧘','Meditate','+spirit',()=>{p.spirit=clamp(p.spirit+R(3,8));p.happy=clamp(p.happy+R(2,5));p.karma=clamp(p.karma+1);return 'Mind like still water.';},p.age>=8);
  addAct(L,'🙏','Pray','luck',()=>{p.spirit=clamp(p.spirit+R(2,6));if(Math.random()<0.12+p.spirit/1000){const g=R(50,500);p.money+=g;log(`🙏 Answered prayer: found <b>${fmt$(g)}</b>!`,'good');return 'You feel watched over.';}p.happy=clamp(p.happy+R(1,4));return 'A quiet moment.';},p.age>=6);
  addAct(L,'🎉','Party','+happy',()=>{p.happy=clamp(p.happy+R(5,12));p.health=clamp(p.health-R(2,6));if(Math.random()<0.15){p.addicted=true;log('🍺 The partying turned into a <b>habit</b>.','bad');}return 'Good times.';},p.age>=14);
  addAct(L,'🏥','Doctor','$500',()=>{if(p.money<500)return 'No money for the doctor.';p.money-=500;p.health=clamp(p.health+R(8,18));return 'Checkup: all good.';},p.age>=6);
  addAct(L,'💪','Therapy','+$300',()=>{if(p.money<300)return 'Therapy costs money.';p.money-=300;p.happy=clamp(p.happy+R(8,15));return 'Talked it out.';},p.age>=12);
  addAct(L,'🎰','Lottery','$10',()=>{
    if(p.money<10)return 'Not even $10 to spare.';
    p.money-=10;
    const r=Math.random();
    if(r<0.001){p.money+=1000000;log('🎰 <b>JACKPOT! $1,000,000!</b>','wild');return 'JACKPOT!!! $1,000,000!';}
    if(r<0.02){const w=R(100,2000);p.money+=w;return `Won ${fmt$(w)}!`;}
    p.happy=clamp(p.happy-2);return 'Lost. Again.';
  },p.age>=18);
  addAct(L,'🏕️','Hike','risk',()=>{
    p.fit=clamp(p.fit+R(1,4));p.happy=clamp(p.happy+R(2,6));
    if(Math.random()<0.06){p.health=clamp(p.health-R(15,30));log('🐍 <b>Snake bite on the trail!</b> Rushed to hospital.','bad');return 'SNAKE BITE! You survive, barely.';}
    return 'Fresh air. No snakes today.';
  },p.age>=10);
  addAct(L,'📖','Read','+smarts',()=>{p.smarts=clamp(p.smarts+R(1,5));p.happy=clamp(p.happy+R(1,3));return 'A chapter a day.';},teen);
  addAct(L,'🎨','Create','fame?',()=>{
    p.happy=clamp(p.happy+R(2,6));
    if(Math.random()<0.05+p.smarts/2000){p.fame=clamp(p.fame+R(5,20));log('🎨 Your creation <b>went viral</b>!','good');return 'VIRAL! Fame rising.';}
    return 'Made something beautiful.';
  },p.age>=8);
  if(p.addicted)addAct(L,'💊','Rehab','$2,000',()=>{
    if(p.money<2000)return 'Rehab costs $2,000.';
    p.money-=2000;
    if(Math.random()<0.7){p.addicted=false;p.health=clamp(p.health+10);log('💊 <b>Clean!</b> A new chapter.','good');return 'Clean. One day at a time.';}
    p.happy=clamp(p.happy-10);return 'Relapsed. Try again.';
  },true);
  const _pal=['#22f0ff','#39ff88','#ff3dc8','#ffe14d','#b48cff','#ff9f1c','#7a5cff'];
  document.getElementById('acts').innerHTML=L.map((a,i)=>`<button class="act" data-i="${i}" ${a.ok?'':'disabled'} style="--ac:${_pal[i%_pal.length]}"><b>${a.t}</b><small>${a.sub}</small></button>`).join('');
  document.querySelectorAll('#acts .act').forEach(b=>b.onclick=()=>{
    const a=L[+b.dataset.i]; const r=a.fn(); if(r)toast(r); render();
  });
}

/* ================= WORK ================= */
const JOBS=[
 {t:'Woodworker',pay:34000,need:{edu:'hs'},d:'Honest work. Sawdust smells like pride.'},
 {t:'Barista',pay:26000,need:{},d:'Espresso yourself.'},
 {t:'Warehouse Clerk',pay:30000,need:{},d:'Boxes. So many boxes.'},
 {t:'Police Officer',pay:58000,need:{edu:'hs',fit:55},d:'Serve and protect. Danger included.'},
 {t:'Detective',pay:82000,need:{job:'Police Officer',years:4,smarts:60},d:'Follow the evidence.'},
 {t:'Police Chief',pay:120000,need:{job:'Detective',years:5},d:'The badge gets heavy.'},
 {t:'Nurse',pay:72000,need:{edu:'college'},d:'Long shifts, big heart.'},
 {t:'Teacher',pay:52000,need:{edu:'college'},d:'Mold young minds.'},
 {t:'Engineer',pay:115000,need:{edu:'college',smarts:60},d:'Build the future.'},
 {t:'Lawyer',pay:160000,need:{edu:'grad'},d:'Objection! Sustained.'},
 {t:'Doctor',pay:290000,need:{edu:'grad',smarts:70},d:'Do no harm. Bill plenty.'},
 {t:'CEO',pay:450000,need:{edu:'college',smarts:75,fame:20},d:'Corner office energy.'},
 {t:'Drug Dealer',pay:0,need:{street:10},crime:true,d:'Fast money. Faster consequences.'},
 {t:'Emperor',pay:1000000,need:{},special:true,d:'All hail.'},
];
const CRIME_RANKS=[['Corner Dealer',40000],['Distributor',120000],['Kingpin',400000]];
function canDo(j){
  const p=S.p,n=j.need||{};
  if(j.special)return false;
  if(n.edu){const order={none:0,hs:1,college:2,grad:3};if(order[p.edu]<order[n.edu])return false;}
  if(n.fit&&p.fit<n.fit)return false;
  if(n.smarts&&p.smarts<n.smarts)return false;
  if(n.street&&p.street<n.street)return false;
  if(n.job&&(!p.job||p.job.title!==n.job))return false;
  if(n.years&&p.jobYears<n.years)return false;
  return true;
}
function renderWork(){
  const p=S.p,box=document.getElementById('workbox');
  let html='';
  if(p.prison>0){box.innerHTML=`<div class="jobcard"><h3>⛓️ In prison</h3><p>${p.prison} years left. Keep your head down.</p></div>`;return;}
  if(p.age<16){box.innerHTML=`<div class="jobcard"><h3>🧒 Too young</h3><p>Enjoy childhood. It ends.</p></div>`;return;}
  // education
  const order={none:0,hs:1,college:2,grad:3};
  let edu=`<div class="jobcard"><h3>🎓 Education: ${p.edu==='none'?'None':p.edu.toUpperCase()}</h3>`;
  if(p.age>=18&&p.edu==='none')edu+=`<button class="act wide" id="gedBtn" style="width:100%;margin-top:8px"><b>📜 Get GED / finish high school</b></button>`;
  if(p.age>=18&&p.age<=30&&p.edu==='hs')edu+=`<button class="act wide" id="colBtn" style="width:100%;margin-top:8px"><b>🎓 College ($40k, 4 yrs)</b></button>`;

function promote(){
  const p=S.p,order=['Police Officer','Detective','Police Chief'];
  const i=order.indexOf(p.job.title);
  if(i>=0&&i<order.length-1){
    const nj=JOBS.find(j=>j.t===order[i+1]);
    if(canDo(nj)){p.job={title:nj.t,pay:nj.pay,d:nj.d};p.jobYears=0;log(`🎖️ <b>PROMOTED to ${nj.t}!</b> ${fmt$(nj.pay)}/yr.`,'good');toast('Promoted!');return;}
  }
  const raise=Math.round(p.job.pay*R(3,10)/100);
  p.job.pay+=raise;p.happy=clamp(p.happy+4);log(`📈 Raise! +${fmt$(raise)}/yr.`,'good');toast('Raise!');
}

function modal(html){const m=document.getElementById('modal');document.getElementById('mbox').innerHTML=html;m.classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
function fireEvent(ev){
  const p=S.p;
  const ch=ev.c.map((c,i)=>`<button data-c="${i}">${c.t}</button>`).join('');
  modal(`<div class="big">${ev.e||'📣'}</div><h2>${ev.title||'Life happens'}</h2><p>${ev.t(p)}</p><div class="choices">${ch}</div><div class="result" id="evres"></div>`);
  document.querySelectorAll('#mbox [data-c]').forEach(b=>b.onclick=()=>{
    const r=ev.c[+b.dataset.c].f(p);
    document.getElementById('evres').innerHTML=r;
    document.querySelectorAll('#mbox [data-c]').forEach(x=>x.disabled=true);
    const btn=document.createElement('button');btn.textContent='Continue →';btn.style.cssText='margin-top:14px;width:100%;padding:14px;border-radius:14px;border:1px solid var(--c);background:#0e1424;color:var(--ink);font-weight:800;font-size:16px;cursor:pointer';
    btn.onclick=()=>{closeModal();render();drainEvents();};
    document.getElementById('evres').appendChild(btn);
  });
}
function drainEvents(){if(pendingEvents.length&&S.p.alive){const ev=pendingEvents.shift();S.fired[ev._i]=S.p.age;fireEvent(ev);}}

/* ================= YEAR TICK ================= */
function ageUp(){
  const p=S.p;
  if(!p.alive)return;
  p.age++;
  // kids age
  p.kids.forEach(k=>{if(k.alive)k.age++;});
  if(p.partner)p.partner.years++;
  // prison
  if(p.prison>0){
    p.prison--;p.happy=clamp(p.happy-8);dmg(p,3);
    log(`⛓️ Prison year. ${p.prison} left.`,'bad');
    if(p.prison===0){log('⛓️ <b>Free!</b>','good');p.job=null;}
    if(checkDeath())return;
    render();return;
  }
  // income
  if(p.job){
    p.jobYears++;
    let pay=p.job.pay;
    if(p.job.crime){
      const rank=Math.min(2,Math.floor(p.street/40));
      pay=CRIME_RANKS[rank][1];
      p.job.title=CRIME_RANKS[rank][0];p.job.pay=pay;
      p.heat=clamp(p.heat+R(5,20));
      if(Math.random()<p.heat/400){
        const y=R(4,12);p.prison=y;p.heat=0;p.money=Math.max(0,p.money*0.4);
        log(`🚔 <b>BUSTED as ${p.job.title}! ${y} years in prison.</b> 60% of cash seized.`,'bad');
        p.job=null;p.jobYears=0;
      }else if(Math.random()<0.08){p.alive=false;p.cause='Rival crew hit';return die();}
    }
    p.money+=pay;
    S.peak=Math.max(S.peak,p.money);
    p.happy=clamp(p.happy-2);
  }else if(p.age>=16){
    p.money-=R(8000,15000); // living costs
  }
  // emperor assassination risk
  if(p.job&&p.job.title==='Emperor'&&Math.random()<0.05){p.alive=false;p.cause='Assassinated';return die();}
  // addiction drain
  if(p.addicted){dmg(p,6);p.happy=clamp(p.happy-8);p.money=Math.max(0,p.money-3000);if(Math.random()<0.05){p.alive=false;p.cause='Overdose';return die();}}
  // age drift
  if(p.age>40)dmg(p,R(1,3));
  if(p.age>60)dmg(p,R(2,5));
  if(p.age>80)dmg(p,R(4,8));
  p.happy=clamp(p.happy+R(-3,3));
  // milestones
  if(p.age===6)log('🎒 Started school.','good');
  if(p.age===13)log('🧑 Teenager now. Good luck.','wild');
  if(p.age===18){p.edu=p.edu==='none'?'hs':p.edu;log('🎓 <b>Turned 18.</b> The world is yours. High school done.','good');}
  if(p.age===65&&p.job)log('👴 Retirement age. The rocking chair beckons.');
  // random events: 1-2
  const nEvs=1+(Math.random()<0.35?1:0);
  for(let i=0;i<nEvs;i++){
    const pool=EV.filter(e=>p.age>=e.min&&p.age<=e.max&&(!e.cond||e.cond(p))&&(!S.fired[e._i]||(e.once?p.age-S.fired[e._i]>999:p.age-S.fired[e._i]>12)));
    if(!pool.length)continue;
    const tw=pool.reduce((s,e)=>s+e.w,0);let r=Math.random()*tw,ev=pool[0];
    for(const e of pool){r-=e.w;if(r<=0){ev=e;break;}}
    // don't stack modals: queue
    S.fired[ev._i]=p.age;pendingEvents.push(ev);
  }
  if(checkDeath())return;
  render();
  if(pendingEvents.length){const ev0=pendingEvents.shift();S.fired[ev0._i]=p.age;fireEvent(ev0);}
}
let pendingEvents=[];
function checkDeath(){
  const p=S.p;
  if(!p.alive){die();return true;}
  let risk=0.002;
  if(p.age>50)risk+=(p.age-50)*0.004;
  if(p.age>70)risk+=(p.age-70)*0.01;
  if(p.age>90)risk+=0.15;
  if(p.health<25)risk+=0.08;
  if(p.health<10)risk+=0.2;
  if(Math.random()<risk){
    p.cause=pick(['Old age','Heart failure','A freak accident','Pneumonia','A peaceful sleep']);
    die();return true;
  }
  return false;
}
function die(){
  const p=S.p;p.alive=false;
  const heirs=p.kids.filter(k=>k.alive);
  const worth=fmt$(p.money);
  let html=`<div class="big deadtomb">✝</div><h2 class="dead">${p.name} died</h2>
  <p>Age ${p.age} · ${p.cause||'Unknown causes'}</p>
  <div style="text-align:left;margin:14px 0">
  <div class="kv"><span>Net worth</span><b>${worth}</b></div>
  <div class="kv"><span>Career</span><b>${p.job?p.job.title:'—'}</b></div>
  <div class="kv"><span>Children</span><b>${p.kids.length}</b></div>
  <div class="kv"><span>Fame</span><b>${Math.round(p.fame)}</b></div>
  <div class="kv"><span>Karma</span><b>${Math.round(p.karma)}</b></div></div>`;
  if(p.fame>60||p.money>1000000||(p.job&&p.job.title==='Emperor')){S.legends.push(p.name);html+=`<p>🌟 <b>LEGEND.</b> Songs will be sung.</p>`;}
  if(heirs.length){
    html+=`<p>The ${S.surname} line continues. Choose your heir:</p><div class="choices">`+
      heirs.map((k,i)=>`<button data-h="${i}">${k.male?'👦':'👧'} ${k.name}, ${k.age}</button>`).join('')+`</div>`;
  }else{
    html+=`<p class="dead"><b>No heirs. The ${S.surname} dynasty ends here.</b></p>
    <div class="choices"><button id="endBtn">See dynasty legacy →</button></div>`;
  }
  modal(html);
  document.querySelectorAll('#mbox [data-h]').forEach(b=>b.onclick=()=>{
    const heir=heirs[+b.dataset.h];
    S.gen++;
    const inherit=Math.round(p.money*0.6);
    S.p=newPerson(S.gen,S.surname,inherit);
    S.fired={};
    S.p.age=Math.max(18,heir.age);S.p.name=heir.name;S.p.male=heir.male;
    closeModal();
    log(`👶 <b>${heir.name}</b> takes up the mantle. Generation ${S.gen}. Inherits ${fmt$(inherit)}.`,'wild');
    render();
  });
  const eb=document.getElementById('endBtn');
  if(eb)eb.onclick=()=>{
    const gens=S.gen;
    modal(`<h2 style="font-size:30px;margin-bottom:6px">Dynasty Complete</h2>
    <p>The ${S.surname} line lasted <b>${gens} generation${gens>1?'s':''}</b>.</p>
    <div style="text-align:left;margin:14px 0">
    <div class="kv"><span>Peak wealth</span><b>${fmt$(S.peak)}</b></div>
    <div class="kv"><span>Legends</span><b>${S.legends.length?S.legends.join(', '):'none'}</b></div></div>
    <div class="choices"><button id="againBtn">🔄 Start a new bloodline</button></div>`);
    document.getElementById('againBtn').onclick=()=>{closeModal();newGame();};
  };
  render();
}

/* ================= INIT ================= */
document.getElementById('startBtn').onclick=()=>newGame();
document.getElementById('ageBtn').onclick=()=>{if(!pendingEvents.length&&!document.getElementById('modal').classList.contains('on'))ageUp();};

</script>
<script>
"use strict";
/* ================= POLISH: sound, confetti, save ================= */
let AC=null, MUTED=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,when){if(MUTED)return;const c=ac();if(!c)return;const t=c.currentTime+(when||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);}
function sfx(n){
  if(n==='click')tone(600,0.06,'square',0.05);
  else if(n==='age'){tone(440,0.08,'triangle',0.08);tone(660,0.1,'triangle',0.06,0.07);}
  else if(n==='good'){tone(523,0.12,'sine',0.1);tone(659,0.12,'sine',0.1,0.1);tone(784,0.2,'sine',0.1,0.2);}
  else if(n==='bad'){tone(180,0.25,'sawtooth',0.08);tone(120,0.3,'sawtooth',0.08,0.12);}
  else if(n==='win'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.25,'triangle',0.12,i*0.11));}
  else if(n==='death'){tone(220,0.8,'sine',0.12);tone(110,1.2,'sine',0.1,0.3);}
  else if(n==='birth'){tone(660,0.15,'sine',0.1);tone(880,0.25,'sine',0.1,0.12);}
}
function confetti(n){
  const colors=['#39ff88','#22f0ff','#ff3dc8','#ffe14d','#fff'];
  for(let i=0;i<(n||50);i++){
    const d=document.createElement('div');d.className='confetti';
    d.style.left=Math.random()*100+'vw';
    d.style.background=colors[i%colors.length];
    d.style.animationDuration=(1.8+Math.random()*1.6)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),3600);
  }
}
function celebrate(big){sfx('win');confetti(big?90:45);}
/* hook sounds into existing flows */
const _fireEvent=fireEvent;
fireEvent=function(ev){const good=/good|wild/.test('');_fireEvent(ev);};
document.getElementById('muteBtn').onclick=function(){MUTED=!MUTED;this.textContent=MUTED?'✕':'♪';this.style.opacity=MUTED?.4:1;if(!MUTED)sfx('click');};
/* save / load */
const SAVE_KEY='sfab-save-v1';
function save(){try{if(S&&S.p.alive){const c=JSON.parse(JSON.stringify(S));localStorage.setItem(SAVE_KEY,JSON.stringify(c));}}catch(e){}}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const c=JSON.parse(raw);if(!c||!c.p||!c.p.alive)return null;c.log=c.log||[];c.fired=c.fired||{};return c;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
/* age button pulse + save hook */
const _ageUp=ageUp;
ageUp=function(){sfx('age');_ageUp();save();
  const b=document.getElementById('ageBtn');b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');};
/* celebrate big moments */
const _log=log;
log=function(html,cls){_log(html,cls);
  if(/JACKPOT|LOTTERY WIN|CROWNED EMPEROR|VIRAL/.test(html))celebrate(true);
  else if(cls==='good'&&/PROMOTED|Married|degree|Clean/.test(html))celebrate(false);};
/* death sting */
const _die=die;
die=function(){sfx('death');_die();clearSave();};
/* continue button on title */
(function(){
  const s=load();
  if(s){const w=document.getElementById('contWrap');
    w.innerHTML=`<button id="contBtn" style="margin-top:12px;border:1px solid var(--c);background:#0e1424;color:var(--ink);border-radius:18px;padding:16px 40px;font-size:17px;font-weight:800;cursor:pointer">Continue: ${s.p.name}, age ${s.p.age} (Gen ${s.gen})</button>`;
    document.getElementById('contBtn').onclick=()=>{S=s;pendingEvents=[];log('💾 Dynasty restored.','good');show('game');render();sfx('birth');};}
  const sb=document.getElementById('startBtn');
  const _s=sb.onclick; sb.onclick=()=>{clearSave();_s();sfx('birth');};
})();
document.addEventListener('pointerdown',()=>ac(),{once:true});

</script>
</body></html>
