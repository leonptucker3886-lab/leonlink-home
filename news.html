<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News | LeonLink</title><meta name="description" content="Neutral, fact-based national, international and tech news with sources."><link rel="icon" href="/favicon.png"><link rel="canonical" href="https://www.leonlink.net/news.html"><script src="/js/nav.js" defer></script>
<style>body{margin:0;background:#06060b;color:#e8e8f0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}h1{font-size:34px;margin:8px 0 4px}h1 span{color:#22f0ff}.sub{color:#9a9ab0;margin:0 0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tabs button{background:#12121c;color:#e8e8f0;border:1px solid #2a2a3a;border-radius:999px;padding:9px 16px;font:600 14px system-ui;cursor:pointer;min-height:40px}.tabs button.on{background:#22f0ff;color:#041016;border-color:#22f0ff}h2{font-size:22px;margin:26px 0 12px;color:#22f0ff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.card{background:#10101a;border:1px solid #23233a;border-radius:16px;padding:0 0 16px;overflow:hidden;display:flex;flex-direction:column;gap:10px}.card h3{margin:0;font-size:18px;line-height:1.3}.card p{margin:0;color:#c8c8d8}.src{font-size:13px;color:#9a9ab0}.src a{color:#22f0ff}.sh{align-self:flex-start;margin-top:auto;background:#22f0ff;color:#041016;border:0;border-radius:10px;padding:10px 16px;font:700 14px system-ui;cursor:pointer;min-height:42px}.card>*:not(.ph){margin-left:16px!important;margin-right:16px!important}.ph{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#1b2a4a,#3a1450);display:flex;align-items:center;justify-content:center;font-size:44px}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ph small{position:absolute;right:6px;bottom:4px;font-size:10px;color:#ddd;background:#0009;padding:1px 5px;border-radius:4px}.card.hl{border-color:#22f0ff;box-shadow:0 0 0 2px #22f0ff,0 0 24px #22f0ff66}.miss{background:#1a1424;border:1px solid #3a2a4a;border-radius:12px;padding:12px 14px;margin-bottom:16px}.note{margin-top:30px;font-size:13px;color:#8a8aa0}</style></head><body>
<main><h1>Leon<span>Link</span> News</h1><p class="sub">Just the facts on the biggest stories, with links to the original sources. No sides taken. <span id="up"></span></p>
<div class="tabs" id="tabs"></div><div id="out">Loading…</div>
<p class="note">Summaries are written from the linked reporting. Read the sources for full details. Updates automatically all day from public news feeds.</p></main>
<script>
var D,cur="All";function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sid(x){return "s-"+String(x.t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)}
function share(i){var x=window._n[i],u="https://www.leonlink.net/news.html#"+sid(x),t=x.t+" | LeonLink News";if(navigator.share){navigator.share({title:t,text:x.f,url:u}).catch(function(){})}else{navigator.clipboard.writeText(t+"\n"+x.f+"\n"+u).then(function(){alert("Copied to share")})}}
function render(){var h="",n=[],k=Object.keys(D.sections);k.forEach(function(sec){if(cur!="All"&&cur!=sec)return;h+="<h2>"+esc(sec)+"</h2><div class=grid>";D.sections[sec].forEach(function(x){var i=n.push(x)-1;var em={National:"🇺🇸",International:"🌍",Tech:"💻"}[sec]||"📰";h+="<article class=card id=\""+sid(x)+"\"><div class=ph>"+em+(x.i?'<img loading=lazy src="'+esc(x.i)+'" alt="" onerror="this.remove()">'+(x.c?"<small>"+esc(x.c)+"</small>":""):"")+"</div><h3>"+esc(x.t)+"</h3><p>"+esc(x.f)+"</p><div class=src>Sources: "+x.s.map(function(s){return'<a href="'+esc(s[1])+'" target=_blank rel="noopener nofollow">'+esc(s[0])+"</a>"}).join(", ")+"</div><button class=sh onclick=share("+i+")>Share ↗</button></article>"});h+="</div>"});window._n=n;document.getElementById("out").innerHTML=h;jump();
document.getElementById("tabs").innerHTML=["All"].concat(k).map(function(t){return"<button class='"+(t==cur?"on":"")+"' onclick=\"cur='"+t+"';render()\">"+t+"</button>"}).join("")}
function jump(){var h=location.hash.slice(1);if(!h||h.indexOf("s-")!=0)return;var e=document.getElementById(h);if(!e){if(cur!="All"){cur="All";render();return}if(!document.querySelector(".miss"))document.getElementById("out").insertAdjacentHTML("afterbegin","<div class=miss>That story has rotated off the live feed. Here are the latest headlines.</div>");return}e.classList.add("hl");setTimeout(function(){e.scrollIntoView({behavior:"smooth",block:"center"})},150)}
window.addEventListener("hashchange",jump);
fetch("/api/news").then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return fetch("/news.json?"+Date.now()).then(function(r){return r.json()})}).then(function(d){D=d;document.getElementById("up").textContent="Updated "+d.updated+".";render()}).catch(function(){document.getElementById("out").textContent="News is loading slowly. Refresh in a moment."});
</script></body></html>
