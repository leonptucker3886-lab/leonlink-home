<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New | LeonLink</title>
<meta name="description" content="Every new update to LeonLink, listed automatically as it ships.">
<link rel="icon" href="/favicon.png">
<link rel="canonical" href="https://www.leonlink.net/whats-new.html">
<style>
body{margin:0;background:#06060b;color:#e8e8f0;font:17px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(30px,5vw,46px);margin:20px 0 6px}h1 em{color:#E9A93B;font-style:normal}
.lede{color:#cfcfd6;margin:0 0 18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.stats div{background:#11111a;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 14px}
.stats b{display:block;font-size:24px;color:#22f0ff}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.f button{background:#11111a;color:#e8e8f0;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.f button.on{background:#22f0ff;color:#06060b}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:#ff9100;margin:26px 0 8px}
.i{background:#11111a;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;margin:8px 0;break-inside:avoid}
.i .t{color:#fff}.i .m{font-size:13px;color:#9a9aa8;margin-top:3px}
.tag{display:inline-block;font-size:12px;background:rgba(34,240,255,.12);color:#22f0ff;border-radius:6px;padding:1px 7px;margin-right:6px}
a{color:#22f0ff}
</style>
</head><body>
<script src="/js/nav.js" defer></script>
<main>
<h1>What's <em>new</em></h1>
<p class="lede">Every update to LeonLink shows up here automatically the moment it ships. No manual edits.</p>
<div class="stats"><div><b id="s24">-</b>last 24 hours</div><div><b id="s7">-</b>last 7 days</div><div><b id="sd">-</b>vs weekly daily avg</div></div>
<div class="f" id="f"></div>
<div id="list"><p>Loading the latest updates...</p></div>
</main>
<script>
(function(){
var U="leonptucker3886-lab",API="https://api.github.com",K="ll-whatsnew-v1",TTL=6e5;
var since=new Date(Date.now()-7*864e5).toISOString();
var NAMES={"leonlink-home":"LeonLink","arcadeline":"Arcadeline","afterglow":"Afterglow","glowline":"Glowline"};
function nm(r){return NAMES[r]||r.replace(/-/g," ")}
function j(u){return fetch(u,{headers:{Accept:"application/vnd.github+json"}}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function clean(m){m=(m||"").split("\n")[0].trim();if(/^merge /i.test(m))return "";return m.charAt(0).toUpperCase()+m.slice(1)}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(){
 try{var c=JSON.parse(localStorage.getItem(K));if(c&&Date.now()-c.t<TTL)return Promise.resolve(c.d)}catch(e){}
 return j(API+"/users/"+U+"/repos?per_page=100&sort=pushed").then(function(rs){
  rs=rs.filter(function(r){return !r.fork&&r.pushed_at>=since}).slice(0,12);
  return Promise.all(rs.map(function(r){return j(API+"/repos/"+U+"/"+r.name+"/commits?per_page=100&since="+since).then(function(cs){
   return cs.map(function(c){return{r:r.name,m:clean(c.commit.message),d:c.commit.author.date,u:c.html_url}})}).catch(function(){return[]})}))
 }).then(function(a){var d=[].concat.apply([],a).filter(function(x){return x.m});d.sort(function(x,y){return x.d<y.d?1:-1});
  try{localStorage.setItem(K,JSON.stringify({t:Date.now(),d:d}))}catch(e){}return d})}
var all=[],cur="all";
function render(){
 var d=all.filter(function(x){return cur=="all"||x.r==cur}),h="",last="";
 var now=Date.now(),n24=d.filter(function(x){return now-new Date(x.d)<864e5}).length,avg=d.length/7;
 document.getElementById("s24").textContent=n24;document.getElementById("s7").textContent=d.length;
 document.getElementById("sd").textContent=avg?((n24/avg-1)*100>=0?"+":"")+Math.round((n24/avg-1)*100)+"%":"-";
 d.forEach(function(x){var dt=new Date(x.d),day=dt.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  if(day!=last){h+="<h2>"+day+"</h2>";last=day}
  h+='<div class="i"><div class="t"><span class="tag">'+esc(nm(x.r))+"</span>"+esc(x.m)+'</div><div class="m">'+dt.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})+"</div></div>"});
 document.getElementById("list").innerHTML=h||"<p>Nothing new in the last 7 days.</p>"}
load().then(function(d){all=d;var rs=["all"];d.forEach(function(x){if(rs.indexOf(x.r)<0)rs.push(x.r)});
 var f=document.getElementById("f");f.innerHTML=rs.map(function(r){return '<button data-r="'+r+'"'+(r=="all"?' class="on"':"")+">"+(r=="all"?"Everything":esc(nm(r)))+"</button>"}).join("");
 f.onclick=function(e){var b=e.target.closest("button");if(!b)return;cur=b.dataset.r;[].forEach.call(f.children,function(c){c.classList.toggle("on",c==b)});render()};
 render()}).catch(function(){document.getElementById("list").innerHTML="<p>Couldn't load updates right now. Try again in a few minutes.</p>"});
})();
</script>
</body></html>
